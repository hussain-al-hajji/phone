المرتبطة باحتياج المستخدم","عدد الصور","طول الوصف"],"answer":1},{"q":"أفضل مكان للمعلومة المهمة هو:","options":["مكان يصعب الوصول إليه","مكان مناسب لمرحلة القرار","آخر الصفحة دائمًا","صفحة منفصلة دائمًا"],"answer":1}],"principle":"ترتيب المعلومات حسب أهميتها للمستخدم يقلل العبء الذهني ويوضح القيمة.","hint":"<p>فكّر من منظور المستخدم لا من منظور فريق التصميم.</p>","why":"يختبر فهم مبادئ تنظيم المحتوى بأسئلة مباشرة.","model":"<p>ب، ب، ب، ب.</p>","axis":"a8"},{"id":"a8e4","title":"صح أو خطأ: المحتوى","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"وجود المعلومات وحده يكفي.","answer":false},{"q":"ترتيب المعلومات يؤثر على سهولة الفهم.","answer":true},{"q":"كل المعلومات لها الدرجة نفسها من الأهمية.","answer":false},{"q":"المعلومات المهمة يجب أن تكون سهلة الوصول.","answer":true},{"q":"زيادة المحتوى دائمًا تحسن التجربة.","answer":false},{"q":"وضوح القيمة يساعد على القرار.","answer":true},{"q":"المحتوى جزء من تجربة المستخدم.","answer":true},{"q":"المعلومات الثانوية يمكن تقديمها بشكل مختلف.","answer":true},{"q":"التنظيم يقلل الجهد الذهني.","answer":true},{"q":"صفحة المنتج لا تحتاج إلى توضيح الخطوة التالية.","answer":false}],"principle":"وجود المعلومة وحده لا يكفي؛ الترتيب والتوقيت والوضوح هي ما يدعم القرار.","hint":"<p>تذكّر: ليست كل المعلومات بنفس الأهمية.</p>","why":"يراجع مبادئ المحور بسرعة ويكشف التعميمات الخاطئة.","model":"<p>خطأ، صح، خطأ، صح، خطأ، صح، صح، صح، صح، خطأ.</p>","axis":"a8"},{"id":"a8e5","title":"قارن صفحتين","icon":"📄","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"صفحة تحتوي على معلومات كثيرة بلا ترتيب.","b":"صفحة بمعلومات أقل لكن مرتبة حسب مراحل القرار.","answer":"b"},{"a":"المواصفات التقنية الكاملة في أعلى الصفحة.","b":"الفائدة الأساسية والسعر في الأعلى، والمواصفات التفصيلية أسفلها.","answer":"b"},{"a":"صفحة مختصرة تعرض السعر والتوصيل والإرجاع بوضوح.","b":"صفحة مختصرة جدًا حُذفت منها معلومات التوصيل والإرجاع.","answer":"a"}],"scenario":"<p>في كل زوج وصفان لصفحة منتج. اختاروا الصفحة التي تدعم القرار بوضوح أكبر.</p>","principle":"الصفحة المرتبة حسب مراحل القرار تدعم القرار أكثر من الصفحة المزدحمة — بشرط ألا تحذف معلومات ضرورية.","hint":"<p>المعيار: هل يجد المستخدم ما يحتاجه للقرار بسرعة؟</p>","why":"يدرّب على المقارنة بمعيار دعم القرار لا بكمية المحتوى.","model":"<p>الحالة الثانية في الزوج الأول والثاني، والأولى في الثالث — لأن الترتيب حسب القرار مع عدم حذف الضروري هو المعيار.</p>","axis":"a8"},{"id":"a8e6","title":"غرفة تحرير المنتج","icon":"✂️","mode":"group","format":"text","steps":["احذفوا 3 عناصر.","أعيدوا ترتيب 5 عناصر، وأبرزوا 3.","انقلوا عنصرين إلى قسم ثانوي."],"scenario":"<p>صفحة منتج افتراضية (مكيّف منزلي) مليئة بالمعلومات: الاسم، 9 صور، وصف تسويقي طويل، السعر، 20 مواصفة، شارة «الأكثر مبيعًا»، 3 عروض، تقييمات، معلومات الشحن، سياسة الإرجاع، الضمان، أسئلة شائعة، منتجات مشابهة، زر الإضافة للسلة.</p>","principle":"التحرير الجيد يحذف ويعيد الترتيب ويُبرز وينقل للمستوى الثانوي، ولا يكتفي بالحذف.","task":"<p>اكتبوا النسخة الجديدة من هيكل الصفحة مع سبب مختصر لكل قرار.</p>","why":"يطبّق مبدأ الأولوية واختبار الحذف على صفحة كاملة.","model":"<p>مثال: حذف: شارة مكررة، عرضان من الثلاثة، المنتجات المشابهة من أعلى الصفحة. إبراز: السعر النهائي، موعد التوصيل، الفائدة (تبريد سريع وهادئ). ثانوي: المواصفات الكاملة، الأسئلة الشائعة.</p>","axis":"a8"},{"id":"a8e7","title":"أين تضع المعلومة؟","icon":"📍","mode":"group","format":"text","steps":["ارسموا أربع خانات: قبل القرار / أثناء المقارنة / قبل الإتمام / بعد الشراء.","وزّعوا المعلومات الست.","برروا التصنيف."],"scenario":"<p>أمامكم ست معلومات: السعر النهائي، المواصفات التفصيلية، سياسة الإرجاع، موعد التوصيل، وصف تسويقي، التقييمات.</p>","principle":"توقيت ظهور المعلومة جزء من تنظيمها؛ كل مرحلة لها معلوماتها.","task":"<p>صنّفوا المعلومات الست على الخانات الأربع مع تبرير كل قرار.</p>","why":"لا يوجد ترتيب إلزامي؛ النشاط يدرّب على تبرير التوقيت بمنطق القرار.","model":"<p>مثال: قبل القرار: وصف تسويقي، التقييمات. أثناء المقارنة: المواصفات التفصيلية. قبل الإتمام: السعر النهائي، موعد التوصيل، سياسة الإرجاع. بعد الشراء: تأكيد الموعد وتفاصيل الإرجاع.</p>","axis":"a8"},{"id":"a8e8","title":"اكتشف المعلومة المفقودة","icon":"🔦","mode":"individual","format":"text","steps":["اقرأ الأسئلة المتكررة كإشارات لا كشكاوى.","حدد المعلومة الغائبة خلف كل سؤال.","اقترح مكان إبرازها."],"scenario":"<p>المستخدمون يدخلون صفحة المنتج، ويقرؤون التفاصيل، ثم يتوقفون. الأسئلة المتكررة في خدمة العملاء: كم مدة الشحن؟ هل يمكن إرجاع المنتج؟ هل السعر النهائي شامل الرسوم؟</p>","principle":"الأسئلة المتكررة للعملاء خريطة جاهزة للمعلومات التي يجب إبرازها.","task":"<p>حدد المعلومات التي ينبغي إبرازها في صفحة المنتج، وأين تضعها.</p>","why":"يربط بيانات خدمة العملاء بقرارات تنظيم المحتوى.","model":"<p>مدة الشحن بجوار السعر، سطر مختصر عن الإرجاع قرب زر الإضافة، وعبارة «السعر شامل الضريبة والرسوم» تحت السعر مباشرة.</p>","axis":"a8"},{"id":"a8e9","title":"المهم الآن أم المهم عند الحاجة؟","icon":"⏲️","mode":"group","format":"text","steps":["اضبطوا مؤقتًا لـ 60 ثانية.","اختاروا 3 عناصر تُنقل إلى مستوى ثانوي.","اكتبوا سببًا بكلمات قليلة."],"scenario":"<p>صفحة منتج تضم 10 عناصر: الاسم، السعر، 6 صور، الفائدة الأساسية، المواصفات الكاملة، التقييمات، الشحن، الإرجاع، قصة العلامة، الأسئلة الشائعة. لديكم 60 ثانية.</p>","principle":"التمييز بين «المهم الآن» و«المهم عند الحاجة» جوهر تنظيم المحتوى.","task":"<p>اكتبوا العناصر الثلاثة التي نقلتموها إلى المستوى الثانوي وسبب كل منها.</p>","why":"الضغط الزمني يكشف الأولويات الحقيقية للمجموعة.","model":"<p>مثال: المواصفات الكاملة، قصة العلامة، الأسئلة الشائعة — مهمة عند الحاجة، ويمكن الوصول إليها بضغطة دون أن تزاحم معلومات القرار.</p>","axis":"a8"},{"id":"a8e10","title":"أعد بناء صفحة المنتج","icon":"🏗️","mode":"group","format":"text","steps":["رتّبوا العناصر من الأعلى إلى الأسفل.","اربطوا كل عنصر بسؤال من أسئلة المستخدم.","قدموا سبب الترتيب."],"scenario":"<p>لديكم العناصر: اسم المنتج، القيمة، السعر، الصور، المواصفات، التقييم، الشحن، الإرجاع، الضمان، الإجراء التالي.</p>","principle":"ترتيب الصفحة يتبع أسئلة المستخدم السبعة: ما هو؟ لماذا يناسبني؟ كم سعره؟ متى يصل؟ هل يُرجع؟ هل أثق به؟ ماذا أفعل الآن؟","task":"<p>اكتبوا ترتيب العناصر العشرة مع سبب الترتيب.</p>","why":"نشاط تكاملي يطبّق كل مبادئ المحور في هيكل صفحة واحدة.","model":"<p>مثال: الصور ← الاسم ← القيمة ← السعر ← الشحن ← التقييم ← الإرجاع والضمان ← المواصفات ← الإجراء التالي (زر ثابت ظاهر دائمًا).</p>","axis":"a8"}],"highlights":["كل معلومة لها وظيفة","مبدأ الأولوية بثلاث طبقات","العبء الذهني ووضوح القيمة","اختبار حذف المحتوى"],"unit":3,"icon":"file","color":7,"scene":"content","title":"المعلومة في وقتها","classic":"تنظيم المحتوى داخل التطبيق ودوره في دعم قرار الشراء","duration":"90 دقيقة","desc":"<p>تنظيم المحتوى يعني ترتيب المعلومات بطريقة تساعد المستخدم على فهم ما أمامه واتخاذ القرار في الوقت المناسب. لا يكفي وجود المعلومة؛ السؤال الأهم: هل ظهرت عندما يحتاجها المستخدم؟</p>"},{"id":"a9","slides":[{"type":"opening","title":"هل يعرف كل مستخدم إلى أين يذهب؟","text":"<p>المسار A: دخول ← بحث ← منتج ← سلة ← دفع. المسار B: دخول ← عروض ← تصنيف ← إعلان ← الرئيسية ← تصنيف آخر ← منتج ← تسجيل ← سلة ← مراجعة ← دفع.</p>","rule":"<p>أيهما يحتاج المستخدم فيه إلى جهد أقل؟</p>","chart":{"kind":"compare","items":["🟢 المسار A :: دخول ; بحث ; منتج ; سلة ; دفع","🔴 المسار B :: دخول ; عروض ; تصنيف ; إعلان ; الرئيسية ; تصنيف آخر ; منتج ; تسجيل ; سلة ; مراجعة ; دفع"]},"id":"a9s1"},{"type":"principle","title":"ما هو مسار التنقل؟","points":["يتوقف.","يعود للخلف.","يغيّر المسار.","يخرج أو يكرر الخطوات."],"intro":"<p>مسار التنقل هو الطريق الذي يسلكه المستخدم للوصول من نقطة إلى أخرى داخل التطبيق، مثل: الدخول ← البحث ← المنتج ← السلة ← الدفع. لكن المستخدم قد:</p>","rule":"<p>يجب تحليل المسار الفعلي، وليس المسار الذي صممه الفريق فقط.</p>","id":"a9s2"},{"type":"principle","title":"مسار واضح أم حر؟","points":["التنقل الحر: يعطي خيارات كثيرة للاستكشاف، ومفيد عندما يكون هدف المستخدم استكشافيًا.","التنقل الموجه: يقود المستخدم نحو هدف محدد، ومفيد عندما يكون هدفه واضحًا."],"intro":"<p>هناك نمطان للتنقل، ولكل منهما موضعه بحسب طبيعة هدف المستخدم:</p>","rule":"<p>تصميم المسار يجب أن يأخذ في الاعتبار نية المستخدم: من يريد منتجًا محددًا يحتاج مسارًا مباشرًا، ومن يستكشف يحتاج مساحة للتصفح والمقارنة.</p>","chart":{"kind":"compare","items":["🌿 تنقل حر :: خيارات كثيرة ; للاستكشاف ; مساحة للتصفح والمقارنة","🎯 تنقل موجه :: مسار نحو هدف ; لمن يعرف ما يريد ; خطوات أقل"]},"id":"a9s3"},{"type":"principle","title":"ثمن الخطوة الإضافية","points":["وقتًا إضافيًا.","قرارًا إضافيًا.","احتمالًا إضافيًا للتشتت.","فرصة إضافية للانسحاب."],"intro":"<p>كل خطوة إضافية تعني:</p>","rule":"<p>نسأل عن كل خطوة: هل يحتاجها المستخدم فعلًا؟</p>","id":"a9s4"},{"type":"tools","title":"ثلاثة أساليب لتحسين المسار","items":["إزالة الخطوات غير الضرورية::كل خطوة بلا قيمة واضحة مرشحة للحذف.","دمج الخطوات المتشابهة::مثل دمج العنوان والشحن في شاشة واحدة.","تسهيل الانتقال بين المراحل::أزرار واضحة، واحتفاظ بالبيانات، ومؤشر تقدم."],"id":"a9s5"},{"type":"mistakes","title":"لا تجعل المستخدم يتذكر","items":["يقرأ السعر في صفحة ثم ينتقل لأخرى ويعود لمعرفته::أبقِ السعر ظاهرًا في ملخص ثابت.","يعيد إدخال بيانات أدخلها سابقًا::احفظ البيانات واملأها تلقائيًا.","ينسى أي منتج اختار أثناء المقارنة::اعرض المنتجات المختارة جنبًا إلى جنب."],"id":"a9s6"},{"type":"principle","title":"نقاط التوقف: المكان لا يكفي","points":["المكان: أين توقف المستخدم؟","السبب: لماذا توقف هنا؟"],"intro":"<p>قد تظهر نقطة الانسحاب في البحث، أو صفحة المنتج، أو الإضافة للسلة، أو مراجعة السلة، أو إدخال البيانات، أو الدفع. لكن معرفة المكان وحدها لا تكفي.</p>","rule":"<p>نحتاج دائمًا أن نسأل: لماذا توقف المستخدم هنا؟</p>","chart":{"kind":"flow","items":["البحث","صفحة المنتج","الإضافة للسلة","مراجعة السلة","إدخال البيانات","الدفع"]},"id":"a9s7"},{"type":"examples","title":"اقرأ ما يفعله المستخدم","items":["ما يقوله المستخدم::«التطبيق ممتاز».","ما تظهره البيانات::يفتح المنتج، يعود، يفتح منتجًا آخر، يكرر العملية، ثم يخرج.","القراءة الصحيحة::السلوك هنا يكشف احتكاكًا قد لا يظهر في الكلام."],"id":"a9s8"},{"type":"principle","title":"رحلة الشراء الرقمية ونقاط التأثير","points":["الاكتشاف: هل فهم المستخدم ما الذي يقدمه التطبيق؟","الاستكشاف: هل يستطيع الوصول للخيارات؟","التقييم: هل يستطيع المقارنة؟","الإجراء: هل يستطيع بدء الشراء بسهولة؟","الإتمام: هل يستطيع إنهاء العملية بثقة؟"],"intro":"<p>يمكن تفكيك الرحلة إلى خمس مراحل، وفي كل مرحلة نقطة تؤثر على القرار:</p>","chart":{"kind":"steps","items":["الاكتشاف::هل فهم ما يقدمه التطبيق؟","الاستكشاف::هل يصل للخيارات؟","التقييم::هل يستطيع المقارنة؟","الإجراء::هل يبدأ الشراء بسهولة؟","الإتمام::هل ينهي العملية بثقة؟"]},"id":"a9s9"},{"type":"principle","title":"خريطة الرحلة","points":["السلوك المتوقع.","نقطة الاحتكاك.","المؤشر."],"intro":"<p>نرسم خطًا أفقيًا: دخول ← اكتشاف ← استكشاف ← تقييم ← إجراء ← إتمام. وتحت كل مرحلة نكتب ثلاث خانات:</p>","chart":{"kind":"table","items":["المرحلة ; السلوك المتوقع ; نقطة الاحتكاك ; المؤشر","الاكتشاف ; يفهم ما يقدمه التطبيق ; رسالة غير واضحة ; معدل الارتداد","الاستكشاف ; يصل للخيارات ; تصنيفات مربكة ; مشاهدات المنتجات","التقييم ; يقارن ; معلومات ناقصة ; الإضافة للسلة","الإجراء ; يبدأ الشراء ; تسجيل إجباري ; بدء الدفع","الإتمام ; ينهي بثقة ; رسوم مفاجئة ; معدل الإتمام"]},"id":"a9s10"},{"type":"principle","title":"مثال رقمي: أين أكبر الانخفاض؟","points":["لا نبدأ من الانطباع.","نبدأ من رحلة المستخدم والبيانات."],"intro":"<p>افترض أن 1000 مستخدم دخلوا التطبيق، ووصل 800 إلى المنتجات، وفتح 500 منتجًا، وأضاف 300 للسلة، وبدأ 180 الدفع، وأتم 120 الشراء.</p>","rule":"<p>الرقم يكشف المكان، والتحليل يبحث عن السبب.</p>","chart":{"kind":"funnel","items":["دخول::1000","المنتجات::800","فتح منتج::500","السلة::300","بدء الدفع::180","الإتمام::120"]},"id":"a9s11"},{"type":"principle","title":"من الانخفاض إلى التشخيص","points":["محتوى غير واضح أو نقص معلومات.","بنية مربكة أو خيارات كثيرة.","خطوة غير ضرورية.","مشكلة ثقة أو توقع غير متطابق."],"intro":"<p>انخفاض الانتقال بين مرحلتين لا يعني تلقائيًا أن هناك مشكلة واحدة. قد يكون السبب:</p>","chart":{"kind":"hub","items":["انخفاض بين مرحلتين","محتوى غير واضح","بنية مربكة","خيارات كثيرة","خطوة غير ضرورية","نقص معلومات","مشكلة ثقة","توقع غير متطابق"]},"id":"a9s12"},{"type":"principle","title":"صمّم الرحلة لا الصفحات","points":["لماذا موجودة؟ إن لم توجد إجابة واضحة: هل يمكن حذفها؟","إن كانت مهمة: هل يمكن تبسيطها؟","إن كانت مكررة: هل يمكن دمجها؟"],"intro":"<p>السؤال الخاطئ: هل كل صفحة جميلة؟ السؤال الأكثر ارتباطًا بالتحويل: هل الرحلة بين الصفحات واضحة وسلسة؟ ولكل خطوة في المسار نطبق اختبار «لماذا هذه الخطوة؟»:</p>","chart":{"kind":"tree","items":["لماذا هذه الخطوة؟","لا إجابة واضحة::احذفها","مهمة::بسّطها","مكررة::ادمجها"]},"id":"a9s13"},{"type":"principle","title":"المسار القصير ليس دائمًا الأفضل","points":["وضوح + سهولة.","معلومات مناسبة + انتقال سلس."],"intro":"<p>اختصار المسار لا يعني حذف كل شيء؛ هناك معلومات يحتاجها المستخدم لاتخاذ القرار. والمعادلة الصحيحة:</p>","rule":"<p>الهدف: أقصر مسار منطقي، وليس أقل عدد ممكن من الشاشات بأي ثمن.</p>","chart":{"kind":"equation","items":["وضوح","سهولة","معلومات مناسبة","انتقال سلس","= رحلة شراء أكثر كفاءة"]},"id":"a9s14"},{"type":"summary","title":"قاعدة المحور: المسار الجيد","text":"<p>المسار الجيد واضح، مباشر، قليل التعقيد، متناسب مع نية المستخدم، ويساعده على الانتقال للخطوة التالية. وحتى الآن رأينا ثلاث طبقات: البنية (هل التطبيق منظم؟)، والمحتوى (هل المعلومات مرتبة وتدعم القرار؟)، والمسار (هل ينتقل المستخدم بسهولة؟).</p>","rule":"<p>بنية واضحة ← محتوى منظم ← مسار سلس ← جهد أقل ← قرار أسرع ← تحويل أفضل. لكن إذا وصل المستخدم إلى الدفع... هل انتهت المهمة؟</p>","chart":{"kind":"vflow","items":["بنية واضحة","محتوى منظم","مسار سلس","جهد أقل","قرار أسرع","تحويل أفضل*"]},"id":"a9s15"}],"exercises":[{"id":"a9e1","title":"رتّب الرحلة الرقمية","icon":"🧭","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما الترتيب الصحيح؟","options":["الاستكشاف ← الاكتشاف ← الإجراء ← التقييم ← الدفع","الاكتشاف ← الاستكشاف ← التقييم ← الإجراء ← الدفع","الاكتشاف ← التقييم ← الاستكشاف ← الدفع ← الإجراء","التقييم ← الاكتشاف ← الاستكشاف ← الإجراء ← الدفع"],"answer":1},{"q":"في أي مرحلة يسأل المستخدم: «هل أستطيع المقارنة؟»","options":["الاكتشاف","التقييم","الإجراء","الإتمام"],"answer":1}],"scenario":"<p>بطاقات مبعثرة: التقييم، الدفع، الاكتشاف، الإجراء، الاستكشاف.</p>","principle":"رحلة الشراء الرقمية خمس مراحل: الاكتشاف، الاستكشاف، التقييم، الإجراء، الإتمام.","hint":"<p>ابدأ من أول لقاء للمستخدم مع التطبيق.</p>","why":"يثبّت تسلسل المراحل الذي تُبنى عليه خريطة الرحلة.","model":"<p>الاكتشاف ← الاستكشاف ← التقييم ← الإجراء ← الإتمام/الدفع.</p>","axis":"a9"},{"id":"a9e2","title":"أكمل الفراغ: المسار","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"مسار التنقل هو الطريق الذي يسلكه المستخدم من ___ إلى الإتمام.","answer":"الدخول"},{"text":"المسار الجيد يكون واضحًا و___.","answer":"مباشرًا"},{"text":"كل خطوة إضافية قد تزيد احتمال ___.","answer":"الانسحاب"},{"text":"يمكن تحسين المسار من خلال إزالة الخطوات غير ___.","answer":"الضرورية"},{"text":"يمكن دمج الخطوات ___.","answer":"المتشابهة"},{"text":"التنقل الموجه يناسب المستخدم الذي لديه ___ واضح.","answer":"هدف"},{"text":"معرفة مكان الانسحاب لا تكفي دون فهم ___.","answer":"السبب"},{"text":"رحلة الشراء تبدأ بـ ___.","answer":"الاكتشاف"},{"text":"نقطة الاحتكاك قد تؤثر على ___.","answer":"القرار"},{"text":"الهدف هو بناء مسار شراء أكثر ___.","answer":"كفاءة"}],"principle":"المسار الجيد واضح ومباشر، ويُحسَّن بإزالة غير الضروري ودمج المتشابه.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفاهيم التنقل بلغة مشتركة داخل المجموعة.","model":"<p>الدخول، الإتمام، مباشرًا، الانسحاب، الضرورية، المتشابهة، هدف، السبب، الاكتشاف، القرار، كفاءة.</p>","axis":"a9"},{"id":"a9e3","title":"اختيار من متعدد: التنقل","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أفضل وصف لمسار التنقل:","options":["مجموعة صفحات","الطريق الذي يسلكه المستخدم","شكل التطبيق","محتوى الإعلان"],"answer":1},{"q":"ماذا تفعل عند اكتشاف خطوة غير ضرورية؟","options":["إضافتها مرة أخرى","تقييم إمكانية حذفها","تغيير لونها","إضافة صورة"],"answer":1},{"q":"المستخدم الذي يعرف المنتج الذي يريده يحتاج غالبًا إلى:","options":["مسار أكثر تعقيدًا","مسار مباشر","خيارات بلا نهاية","صفحات إضافية"],"answer":1},{"q":"الانخفاض بين مرحلتين يدل على:","options":["مكان يحتاج إلى تحليل","سبب مؤكد","نجاح","فشل التصميم بالكامل"],"answer":0}],"principle":"الانخفاض بين مرحلتين مكان يحتاج إلى تحليل، لا سبب مؤكد.","hint":"<p>فرّق بين «أين» و«لماذا».</p>","why":"يختبر فهم مفاهيم المسار ونية المستخدم.","model":"<p>ب، ب، ب، أ.</p>","axis":"a9"},{"id":"a9e4","title":"صح أو خطأ: المسار","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"المسار الجيد يجب أن يكون واضحًا.","answer":true},{"q":"كلما زادت الخطوات كان المسار أفضل.","answer":false},{"q":"يمكن دمج الخطوات المتشابهة.","answer":true},{"q":"معرفة مكان الانسحاب تكشف السبب دائمًا.","answer":false},{"q":"نية المستخدم تؤثر على تصميم المسار.","answer":true},{"q":"التنقل الحر يناسب كل الحالات.","answer":false},{"q":"يجب تحليل الرحلة ككل.","answer":true},{"q":"تقليل الخطوات هدف بحد ذاته مهما كانت النتيجة.","answer":false},{"q":"البيانات تساعد في اكتشاف نقاط الانخفاض.","answer":true},{"q":"الخطوة التالية يجب أن تكون مفهومة للمستخدم.","answer":true}],"principle":"المسار يُحلَّل ككل، ونية المستخدم تحدد شكله، ومعرفة المكان لا تكشف السبب.","hint":"<p>احذر عبارات مثل «دائمًا» و«كل الحالات» و«بحد ذاته».</p>","why":"يراجع مفاهيم المحور ويكشف التعميمات الخاطئة.","model":"<p>صح، خطأ، صح، خطأ، صح، خطأ، صح، خطأ، صح، صح.</p>","axis":"a9"},{"id":"a9e5","title":"قارن المسارين","icon":"🔀","mode":"individual","format":"text","steps":["عدّ الخطوات في كل مسار.","حدد الخطوات التي لا تخدم هدف المستخدم مباشرة.","اقترح أين يمكن تقليل الجهد."],"scenario":"<p>المسار A: دخول ← بحث ← منتج ← سلة ← دفع. المسار B: دخول ← عروض ← تصنيف ← عرض آخر ← تسجيل ← تصنيف ← منتج ← توصيات ← سلة ← مراجعة ← دفع.</p>","principle":"الخطوة التي لا تضيف قيمة مباشرة لهدف المستخدم مرشحة للمراجعة.","task":"<p>حدد: نقاط التعقيد، والخطوات القابلة للمراجعة، وأين يمكن تقليل الجهد.</p>","why":"يدرّب على تحليل المسار كوحدة لا كصفحات منفصلة.","model":"<p>المسار B يحتوي على نقاط أكثر تحتاج إلى مراجعة، خصوصًا العرضين المتتاليين والتصنيف المكرر والتسجيل المبكر، إذا كانت لا تضيف قيمة مباشرة للهدف الذي جاء المستخدم لتحقيقه.</p>","axis":"a9"},{"id":"a9e6","title":"غرفة عمليات التحويل","icon":"📊","mode":"group","format":"text","steps":["احسبوا الانخفاض بين كل مرحلتين.","اختاروا نقطة واحدة للتحليل.","اقترحوا أسبابًا وبيانات مطلوبة."],"scenario":"<p>بيانات التطبيق: الدخول 10,000 ← مشاهدة المنتجات 7,500 ← صفحة المنتج 5,000 ← السلة 2,800 ← الدفع 1,900 ← الإتمام 1,400.</p>","principle":"لا نخلط بين مكان المشكلة المحتمل وسببها؛ الرقم يشير إلى المكان فقط.","task":"<p>حددوا نقاط الانخفاض، واختاروا نقطة واحدة للتحليل، واقترحوا 3 أسباب محتملة، وحددوا البيانات الإضافية المطلوبة.</p>","why":"يربط قراءة الـFunnel بالتفكير التشخيصي المنضبط.","model":"<p>أكبر انخفاض نسبي: من صفحة المنتج (5,000) إلى السلة (2,800). أسباب محتملة: قيمة غير واضحة، معلومات توصيل ناقصة، زر إضافة غير ظاهر. بيانات إضافية: التمرير والنقر في صفحة المنتج، والتقسيم حسب الجهاز والمصدر. لا توجد إجابة واحدة للسبب.</p>","chart":{"kind":"funnel","items":["الدخول::10000","مشاهدة المنتجات::7500","صفحة المنتج::5000","السلة::2800","الدفع::1900","الإتمام::1400"]},"axis":"a9"},{"id":"a9e7","title":"احذف خطوة","icon":"✂️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي خطوة تستحق المراجعة أولًا؟","options":["التصنيف","تسجيل الدخول قبل صفحة المنتج","إضافة للسلة","الدفع"],"answer":1},{"q":"ما المبرر الأقوى؟","options":["لأنها خطوة تقنية","لأنها تطلب جهدًا قبل ظهور القيمة للمستخدم","لأن لونها غير مناسب","لأنها آخر خطوة"],"answer":1}],"scenario":"<p>المسار: الدخول ← تصنيف ← اختيار المنتج ← تسجيل الدخول ← صفحة المنتج ← إضافة للسلة ← مراجعة ← الدفع.</p>","principle":"الخطوة التي تطلب جهدًا قبل ظهور القيمة تستحق المراجعة أولًا.","hint":"<p>أي خطوة جاءت قبل أن يرى المستخدم ما يريده؟</p>","why":"يطبّق اختبار «لماذا هذه الخطوة؟» على مسار حقيقي.","model":"<p>تسجيل الدخول قبل الوصول إلى صفحة المنتج، إذا كان التسجيل لا يخدم حاجة ضرورية في هذه المرحلة.</p>","axis":"a9"},{"id":"a9e8","title":"ماذا يقول هذا السلوك؟","icon":"🔁","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما التفسير الأقرب لهذا السلوك؟","options":["المستخدم لا يريد الشراء إطلاقًا","صعوبة المقارنة أو نقص معلومات","التطبيق سريع جدًا","المنتج نفد من المخزون"],"answer":1},{"q":"هل يمكن اعتبار هذا التفسير سببًا مؤكدًا؟","options":["نعم، السلوك واضح بما يكفي","لا، يحتاج إلى بيانات إضافية","نعم، إذا تكرر مرتين","لا، لأن السلوك لا يعني شيئًا"],"answer":1}],"scenario":"<p>المستخدم يفتح المنتج، ويقرأ التفاصيل، ويعود، ويفتح منتجًا آخر، ويعود، ويفتح الأول مرة أخرى، ثم يخرج.</p>","principle":"السلوك المتكرر إشارة تحتاج إلى تفسير، ولا يجوز اعتبار أي تفسير سببًا مؤكدًا دون بيانات إضافية.","hint":"<p>ميّز بين «تفسير محتمل» و«سبب مؤكد».</p>","why":"يدرّب على قراءة السلوك بحذر علمي.","model":"<p>السلوك قد يشير إلى صعوبة المقارنة، أو نقص معلومات، أو عدم وضوح القيمة، أو تردد. ولا يجوز اعتبار أحدها سببًا مؤكدًا دون بيانات إضافية.</p>","axis":"a9"},{"id":"a9e9","title":"تحدي الستين ثانية","icon":"⏱️","mode":"group","format":"text","steps":["اضبطوا مؤقتًا لدقيقة واحدة.","حددوا خطوتين للحذف، وخطوة للدمج، وخطوة للتبسيط.","اشرحوا السبب خلال 30 ثانية."],"scenario":"<p>مسار من 8 خطوات: الدخول ← نافذة ترحيب ← الرئيسية ← عرض ترويجي ← التصنيف ← المنتج ← تسجيل إجباري ← السلة ← الدفع.</p>","principle":"الحذف والدمج والتبسيط ثلاثة قرارات مختلفة، ولكل منها منطقه.","task":"<p>اكتبوا قراراتكم الأربعة (حذف ×2، دمج، تبسيط) مع سبب مختصر لكل قرار.</p>","why":"الضغط الزمني يدرّب على سرعة القرار المنطقي.","model":"<p>مثال: حذف: نافذة الترحيب، العرض الترويجي قبل التصنيف. دمج: الرئيسية مع التصنيف (تصنيفات ظاهرة في الرئيسية). تبسيط: التسجيل الإجباري إلى شراء كضيف.</p>","axis":"a9"},{"id":"a9e10","title":"رحلة مستخدم من الدخول إلى الشراء","icon":"🗺️","mode":"group","format":"text","steps":["اختاروا تطبيقًا ومنتجًا محددًا.","املؤوا لكل مرحلة ست خانات.","انتهوا بثلاثة تحسينات عملية."],"scenario":"<p>المشروع التطبيقي للمحور: كل فريق يصمم خريطة كاملة: الدخول ← الاكتشاف ← الاستكشاف ← التقييم ← الإجراء ← الإتمام، لتطبيق تجاري يختاره.</p>","principle":"خريطة الرحلة تجمع السلوك والاحتياج والمعلومات والتردد والمؤشر في رؤية واحدة.","task":"<p>تحت كل مرحلة حددوا: ماذا يفعل المستخدم؟ ماذا يحتاج؟ ما المعلومات التي يحتاجها؟ أين يمكن أن يتردد؟ ما الذي قد يدفعه للانتقال؟ ما المؤشر الذي يمكن قياسه؟ ثم اكتبوا 3 تحسينات عملية.</p>","why":"المشروع الختامي للوحدة؛ يجمع البنية والمحتوى والمسار في مخرج واحد.","model":"<p>المخرج النهائي: خريطة رحلة مستخدم + 3 تحسينات عملية. مثال لمرحلة التقييم: يقارن سماعتين ← يحتاج فروقًا واضحة ← عمر البطارية والسعر ← يتردد عند غياب المقارنة ← جدول مقارنة ← مؤشر: الإضافة للسلة.</p>","axis":"a9"}],"highlights":["التنقل الحر مقابل التنقل الموجه","ثلاثة أساليب لتحسين المسار","الرقم يكشف المكان والتحليل يبحث عن السبب","أقصر مسار منطقي لا أقل عدد شاشات"],"unit":3,"icon":"compass","color":8,"scene":"navigation","title":"أقصر طريق منطقي إلى الشراء","classic":"تحسين مسارات التنقل داخل التطبيق لرفع كفاءة التحويل","duration":"120 دقيقة","desc":"<p>مسار التنقل هو الطريق الذي يسلكه المستخدم من نقطة الدخول حتى الإتمام. المسار الجيد واضح ومباشر وخالٍ من التعقيد، ويتناسب مع نية المستخدم. نتعلم هنا إزالة الخطوات غير الضرورية ودمج المتشابه وقراءة نقاط التوقف.</p>"},{"id":"a10","slides":[{"type":"opening","title":"وصل إلى الدفع... ثم اختفى","text":"<p>10,000 مستخدم وصلوا إلى السلة، و6,000 بدأوا الدفع، و3,800 فقط أكملوا العملية. ماذا حدث بين «بدأ الدفع» و«أكمل الدفع»؟</p>","rule":"<p>قرب المستخدم من الإتمام يرفع أهمية كل تفصيل في التجربة.</p>","chart":{"kind":"funnel","items":["وصلوا إلى السلة::10000","بدأوا الدفع::6000","أكملوا العملية::3800"]},"id":"a10s1"},{"type":"principle","title":"لماذا تستحق مرحلة الدفع تحليلًا مستقلًا؟","points":["اتخذ معظم قرارات الشراء.","أصبح قريبًا من الإتمام.","يراجع التكلفة النهائية.","يتعامل مع بيانات شخصية ومالية.","يصبح أكثر حساسية للأخطاء والغموض."],"intro":"<p>لأن المستخدم في هذه المرحلة:</p>","id":"a10s2"},{"type":"principle","title":"ما المقصود بتجربة الدفع؟","points":["مراجعة الطلب ومعرفة السعر النهائي.","إدخال البيانات واختيار طريقة الدفع.","اختيار الشحن ومراجعة المعلومات.","تأكيد العملية ومعرفة ما سيحدث بعد الدفع."],"intro":"<p>تجربة الدفع لا تعني زر «ادفع» فقط، بل تشمل:</p>","chart":{"kind":"flow","items":["السلة","مراجعة الطلب","بيانات الشحن","طريقة التوصيل","طريقة الدفع","المراجعة النهائية","الإتمام*"]},"id":"a10s3"},{"type":"principle","title":"أين يمكن أن يحدث الانسحاب؟","points":["لا؛ الانسحاب عند البيانات غير الانسحاب عند الدفع.","كل نقطة تحتاج إلى تشخيص مختلف."],"intro":"<p>ضع علامة استفهام على كل مرحلة: السلة ← ؟ ← بيانات ← ؟ ← الدفع ← ؟ ← الإتمام. هل الانسحاب في كل نقطة يعني الشيء نفسه؟</p>","chart":{"kind":"flow","items":["السلة","؟","بيانات","؟","الدفع","؟","الإتمام*"]},"id":"a10s4"},{"type":"principle","title":"أهم نقاط التعقيد في الدفع","points":["عدم وضوح النتيجة.","كثرة الخطوات.","طلب بيانات غير ضرورية.","بطء التنفيذ."],"intro":"<p>من أسباب الانسحاب الشائعة في عملية الدفع أربعة أسباب رئيسية:</p>","chart":{"kind":"cards","items":["❔ عدم وضوح النتيجة","🪜 كثرة الخطوات","📝 بيانات غير ضرورية","🐢 بطء التنفيذ"]},"id":"a10s5"},{"type":"examples","title":"ثلاثة أمثلة على التعقيد","items":["زر «متابعة»::متابعة إلى ماذا؟ الدفع؟ مراجعة الطلب؟ اختيار الشحن؟ الإجراء غير الواضح يخلق ترددًا.","بيانات غير ضرورية::يُطلب الاسم والجوال والبريد والعنوان، ثم تاريخ الميلاد والمهنة وجهة العمل. هل يحتاج إتمام الطلب إلى كل هذه البيانات؟","كثرة الخطوات::تجربة A بثلاث خطوات مقابل تجربة B بثماني خطوات. هل كل خطوة إضافية تضيف قيمة؟"],"id":"a10s6"},{"type":"principle","title":"الأداء والسرعة في الدفع","points":["ضغط الزر مرة أخرى.","الرجوع.","إغلاق التطبيق.","الشك في نجاح العملية."],"intro":"<p>في مرحلة الدفع يصبح الانتظار أكثر حساسية. المستخدم يضغط «تأكيد الدفع» ثم تظهر شاشة تحميل طويلة بلا تفسير. ما الذي قد يحدث؟</p>","id":"a10s7"},{"type":"principle","title":"الوضوح في المرحلة النهائية","points":["ماذا سأدفع؟","متى سأدفع؟","ماذا سيحدث بعد الضغط؟","هل العملية تمت؟","متى يصل الطلب؟"],"intro":"<p>المستخدم يحتاج إلى إجابات واضحة لخمسة أسئلة، لأن الغموض هنا قد يؤدي إلى التردد أو الانسحاب:</p>","id":"a10s8"},{"type":"examples","title":"مفاجآت اللحظة الأخيرة","items":["في السلة::299 ريال.","عند الدفع::349 ريال.","السبب::رسوم توصيل، رسوم خدمة، ضريبة، رسوم أخرى.","المشكلة::المستخدم اكتشف معلومة مؤثرة في اللحظة الأخيرة."],"id":"a10s9"},{"type":"principle","title":"لا تجعل الدفع اختبارًا","points":["العملية واضحة.","الخطوات متوقعة.","المعلومات كافية.","الإجراء مفهوم."],"intro":"<p>تجربة الدفع الجيدة تجعل المستخدم يشعر أن:</p>","chart":{"kind":"cards","items":["✓ العملية واضحة","✓ الخطوات متوقعة","✓ المعلومات كافية","✓ الإجراء مفهوم"]},"id":"a10s10"},{"type":"tools","title":"إطار تحليل تجربة الدفع","items":["ماذا يفعل المستخدم؟::السلوك في هذه الخطوة.","ماذا يحتاج؟::المعلومة أو التسهيل المطلوب.","ماذا يرى؟::ما يظهر فعلًا على الشاشة.","ماذا يُطلب منه؟::البيانات أو القرارات المطلوبة.","ما الذي قد يربكه؟::مصادر الغموض.","ما الذي قد يدفعه للانسحاب؟::نقطة الخطر."],"id":"a10s11"},{"type":"summary","title":"حلّل قبل أن تقترح","text":"<p>تطبيق تجارة إلكترونية يعاني من وصول مرتفع إلى الدفع، وانسحاب مرتفع قبل الإتمام، وشكاوى من تعقيد العملية. المطلوب: تحليل تجربة الدفع قبل اقتراح الحل — تحديد نقاط التعقيد، وتفسير أسباب الانسحاب، ثم اقتراح التحسينات.</p>","rule":"<p>الدفع تجربة مستقلة داخل رحلة الشراء، وتستحق تشخيصًا مستقلًا.</p>","id":"a10s12"}],"exercises":[{"id":"a10e1","title":"أين المشكلة في مسار الدفع؟","icon":"🔍","mode":"individual","format":"text","steps":["امشِ في المسار كمستخدم مستعجل.","حدد أكبر نقطة احتكاك.","اربطها بسبب وبيانات تؤكدها."],"scenario":"<p>مسار دفع من 7 خطوات: السلة ← تسجيل الدخول ← العنوان ← طريقة التوصيل ← بيانات إضافية (تاريخ الميلاد والمهنة) ← طريقة الدفع ← تأكيد مع شاشة تحميل طويلة.</p>","principle":"نقطة الاحتكاك الأكبر تُربط بعنصر واضح: كثرة الخطوات، طلب بيانات، غموض، أو بطء.","task":"<p>حدد: أين ترى أكبر نقطة احتكاك؟ لماذا؟ ما البيانات التي تحتاجها للتأكد؟</p>","why":"يدرّب على التشخيص الفردي المدعوم بالبيانات لا بالانطباع.","model":"<p>لا توجد إجابة واحدة. مثال: البيانات الإضافية (تاريخ الميلاد والمهنة) — لأنها غير مرتبطة بإتمام الطلب. البيانات المطلوبة: نسبة الانسحاب في تلك الخطوة مقارنة بما قبلها.</p>","axis":"a10"},{"id":"a10e2","title":"أكمل الفراغات: الدفع","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"تجربة الدفع تشمل أكثر من زر ___.","answer":"الدفع"},{"text":"كثرة الخطوات قد تزيد احتمال ___.","answer":"الانسحاب"},{"text":"طلب البيانات يجب أن يكون مرتبطًا بـ ___.","answer":"إتمام العملية"},{"text":"عدم وضوح النتيجة قد يسبب ___.","answer":"التردد"},{"text":"بطء التنفيذ قد يؤدي إلى ___.","answer":"إعادة المحاولة"},{"text":"المستخدم يحتاج إلى معرفة السعر ___.","answer":"النهائي"},{"text":"المفاجآت في المرحلة الأخيرة قد تؤثر على ___.","answer":"الثقة والقرار"},{"text":"تحليل الدفع يبدأ بفهم ___.","answer":"رحلة المستخدم"},{"text":"كل خطوة يجب أن يكون لها ___.","answer":"سبب واضح"},{"text":"الهدف من تحسين الدفع هو دعم ___.","answer":"الإتمام"}],"principle":"تجربة الدفع منظومة كاملة: وضوح، خطوات مبررة، بيانات ضرورية، وسعر نهائي معلن.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفاهيم تجربة الدفع بلغة مشتركة.","model":"<p>الدفع، الانسحاب، إتمام العملية، التردد، إعادة المحاولة، النهائي، الثقة والقرار، رحلة المستخدم، سبب واضح، الإتمام.</p>","axis":"a10"},{"id":"a10e3","title":"اختيار من متعدد: الدفع","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي مما يلي يمثل مشكلة في تجربة الدفع؟","options":["وضوح الخطوات","طلب بيانات غير ضرورية","ظهور السعر النهائي مبكرًا","وضوح النتيجة"],"answer":1},{"q":"ماذا قد يحدث عند عدم وضوح زر الإجراء؟","options":["زيادة الثقة","التردد","تقليل الخطوات","زيادة السرعة"],"answer":1},{"q":"السعر النهائي الأفضل أن يكون:","options":["مفاجأة في النهاية","واضحًا قبل الإتمام","غير ظاهر","في صفحة منفصلة دائمًا"],"answer":1},{"q":"كثرة الخطوات تعني:","options":["مشكلة مؤكدة دائمًا","عنصرًا يستحق التحليل","تجربة أفضل","ثقة أكبر"],"answer":1},{"q":"البطء في الدفع قد يؤثر على:","options":["الثقة","الانسحاب","إتمام العملية","جميع ما سبق"],"answer":3}],"principle":"طلب البيانات غير الضرورية والأزرار الغامضة والبطء عناصر تستحق التحليل في الدفع.","hint":"<p>فكّر كمستخدم على بُعد خطوة من الإتمام.</p>","why":"يختبر الفهم الأساسي لنقاط التعقيد في الدفع.","model":"<p>ب، ب، ب، ب، د.</p>","axis":"a10"},{"id":"a10e4","title":"صح أم خطأ: الدفع","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"تجربة الدفع تبدأ عند الضغط على زر الدفع فقط.","answer":false},{"q":"طلب بيانات غير ضرورية قد يزيد الاحتكاك.","answer":true},{"q":"وضوح النتيجة مهم في المرحلة النهائية.","answer":true},{"q":"كثرة الخطوات لا تؤثر على تجربة المستخدم.","answer":false},{"q":"ظهور رسوم جديدة في النهاية قد يسبب ترددًا.","answer":true},{"q":"البطء قد يؤثر على الإتمام.","answer":true},{"q":"كل مستخدم ينسحب للسبب نفسه.","answer":false},{"q":"يجب تحليل مكان الانسحاب وأسبابه.","answer":true},{"q":"كل البيانات المطلوبة من المستخدم ضرورية بالضرورة.","answer":false},{"q":"تحليل تجربة الدفع يجب أن يسبق اقتراح التحسينات.","answer":true}],"principle":"الدفع تجربة كاملة، والانسحاب له أسباب متعددة تحتاج تحليلًا قبل التحسين.","hint":"<p>«فقط» و«كل» و«بالضرورة» تستحق التدقيق.</p>","why":"يراجع مفاهيم المحور بسرعة.","model":"<p>خطأ، صح، صح، خطأ، صح، صح، خطأ، صح، خطأ، صح.</p>","axis":"a10"},{"id":"a10e5","title":"أيهما أكثر وضوحًا؟","icon":"🔦","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"زر: متابعة","b":"زر: المتابعة إلى الدفع","answer":"b"},{"a":"«جارٍ المعالجة...» بلا أي تفاصيل.","b":"«جارٍ تأكيد الدفع — لا تغلق الصفحة، يستغرق ذلك ثوانٍ».","answer":"b"},{"a":"«الإجمالي: 349» في أسفل الصفحة فقط.","b":"«349 ريال شاملة التوصيل والضريبة» بجوار زر الدفع.","answer":"b"}],"scenario":"<p>أزواج من عناصر شاشة الدفع. اختاروا في كل زوج العنصر الذي يقدم وضوحًا أكبر.</p>","principle":"الإجراء الواضح يخبر المستخدم بما سيحدث بعد الضغط.","hint":"<p>الأوضح هو ما يجيب عن «ماذا سيحدث بعد الضغط؟».</p>","why":"يحوّل مبدأ «وضوح النتيجة» إلى حكم سريع على عناصر واجهة حقيقية.","model":"<p>الشاشة B أوضح في الزوج الأول لأن الإجراء المتوقع أوضح، وكذلك (ب) في الزوجين التاليين.</p>","axis":"a10"},{"id":"a10e6","title":"غرفة تشخيص الدفع","icon":"🩺","mode":"group","format":"text","steps":["ابدؤوا بالأسباب المحتملة.","حددوا البيانات التي تؤكد كل سبب.","اقترحوا تحسينًا لكل سبب."],"scenario":"<p>المستخدمون يصلون إلى صفحة الدفع، لكن 35% منهم ينسحبون قبل التأكيد.</p>","principle":"الأسباب المرتبطة بالمادة: كثرة الخطوات، البيانات غير الضرورية، الغموض، البطء، ظهور تكلفة غير متوقعة.","task":"<p>حددوا: 3 أسباب محتملة، و3 بيانات تحتاجون إلى تحليلها، وتحسينًا واحدًا لكل سبب.</p>","why":"يدرّب المجموعة على ربط السبب بالدليل وبالتحسين في سلسلة واحدة.","model":"<p>مثال: السبب: تكلفة غير متوقعة ← البيانات: الانسحاب بعد ظهور الإجمالي ← التحسين: إظهار الإجمالي في السلة. السبب: بطء ← البيانات: زمن تحميل خطوة التأكيد ← التحسين: مؤشر تقدم ورسالة طمأنة.</p>","axis":"a10"},{"id":"a10e7","title":"اكتشف الخطوة الزائدة","icon":"🔎","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي خطوة تحتاج إلى مراجعة أولًا؟","options":["العنوان","المهنة","الشحن","الاسم"],"answer":1}],"scenario":"<p>المسار: السلة ← تسجيل الدخول ← الاسم ← البريد ← العنوان ← المهنة ← الشحن ← الدفع.</p>","principle":"البيانات المطلوبة يجب أن ترتبط مباشرة بإتمام الطلب.","hint":"<p>أي معلومة لا يحتاجها المتجر لتوصيل الطلب؟</p>","why":"يطبّق مبدأ «البيانات الضرورية» على مسار واقعي.","model":"<p>المهنة، لأنها تبدو غير مرتبطة مباشرة بإتمام الطلب في السيناريو المعروض.</p>","axis":"a10"},{"id":"a10e8","title":"صمّم شاشة دفع أفضل","icon":"🎨","mode":"group","format":"text","steps":["احذفوا عنصرين.","أعيدوا ترتيب العناصر ووضّحوا زر الإجراء.","أظهروا السعر النهائي وأضيفوا مؤشر المرحلة."],"scenario":"<p>شاشة دفع مزدحمة: إعلان في الأعلى، 6 طرق دفع بلا توضيح، زر رمادي بعنوان «متابعة»، السعر النهائي غير ظاهر إلا بالتمرير، حقل كوبون كبير في المنتصف، ولا يوجد ما يدل على المرحلة الحالية.</p>","principle":"شاشة الدفع الجيدة واضحة، مختصرة، مرتبة، شفافة، وسهلة الإجراء.","task":"<p>اكتبوا الوصف النصي للشاشة الجديدة: ما حُذف، وترتيب العناصر، ونص الزر، ومكان السعر النهائي، ومؤشر المرحلة.</p>","why":"يحوّل المبادئ إلى تصميم نصي قابل للتقييم (5 نقاط: وضوح، اختصار، ترتيب، شفافية، سهولة الإجراء).","model":"<p>مثال: حذف الإعلان وتصغير حقل الكوبون إلى رابط. مؤشر «الخطوة 3 من 3». طرق الدفع الأكثر استخدامًا أولًا مع أيقونات. الإجمالي الشامل فوق الزر. نص الزر: «ادفع 249 ريال الآن».</p>","axis":"a10"},{"id":"a10e9","title":"ماذا ستقيس؟","icon":"📏","mode":"individual","format":"text","steps":["فكّر في كل مرحلة من مسار الدفع.","اختر مؤشرًا لكل مرحلة.","رتّبها حسب أهميتها."],"scenario":"<p>الفريق نفّذ تحسينات على تجربة الدفع، ويريد معرفة ما إذا كانت نجحت.</p>","principle":"التحسين بلا قياس مجرد افتراض؛ المؤشرات تُختار حسب مرحلة الدفع.","task":"<p>اكتب المؤشرات التي يمكن مراقبتها بعد تحسين تجربة الدفع، ولماذا.</p>","why":"يربط الوحدة الرابعة بمنطق القياس الذي ستتعمق فيه الوحدة الخامسة.","model":"<p>معدل بدء الدفع، معدل الإتمام، معدل الانسحاب، الزمن اللازم للإتمام، الانتقال من الدفع إلى التأكيد.</p>","axis":"a10"},{"id":"a10e10","title":"ورشة تحليل كاملة للدفع","icon":"🧰","mode":"group","format":"text","steps":["ارسموا مسار الدفع.","حددوا 3 نقاط احتكاك وفسّروها.","اقترحوا تحسينًا ومؤشرًا."],"scenario":"<p>تطبيق لديه زيارات جيدة ووصول مرتفع إلى الدفع، لكنه يعاني من انسحاب واضح في آخر مرحلة.</p>","principle":"التحليل المتكامل: مسار ← نقاط احتكاك ← تفسير ← تحسين ← مؤشر.","task":"<p>ارسموا مسار الدفع، وحددوا 3 نقاط احتكاك، وفسّروا كل نقطة، واقترحوا تحسينًا، وحددوا مؤشرًا لقياس النتيجة.</p>","why":"النشاط الختامي للمحور يجمع أدواته كلها.","model":"<p>مثال: المسار: السلة ← الشحن ← الدفع ← التأكيد. احتكاك 1: رسوم تظهر في الدفع (مفاجأة). احتكاك 2: إدخال بطاقة دون عناصر أمان (ثقة). احتكاك 3: تحميل طويل (بطء). التحسين: إجمالي شامل مبكر ومؤشر أمان ورسالة انتظار. المؤشر: الانتقال من الدفع إلى التأكيد.</p>","axis":"a10"}],"highlights":["الدفع أكثر من زر «ادفع»","أربعة أسباب شائعة للانسحاب","مفاجآت اللحظة الأخيرة","إطار تحليل كل خطوة"],"unit":4,"icon":"card","color":9,"scene":"checkout","title":"وصل إلى الدفع... ثم اختفى","classic":"فهم تجربة الدفع كمرحلة حاسمة في التحويل","duration":"90 دقيقة","desc":"<p>قد يصل المستخدم إلى الدفع بعد أن اكتشف المنتج وقارن وأضاف للسلة، ومع ذلك لا يكتمل الشراء. هنا ننظر إلى الدفع كتجربة مستقلة: مراحلها، ونقاط التعقيد فيها، ومفاجآت اللحظة الأخيرة.</p>"},{"id":"a11","slides":[{"type":"opening","title":"الدفع سهل... فلماذا لا يدفع المستخدم؟","text":"<p>التطبيق سريع، وجميل، وسهل الاستخدام. لكن المستخدم يتردد عند إدخال بيانات الدفع. ما الذي ينقص التجربة؟</p>","rule":"<p>الإجابة التي نصل إليها: الثقة.</p>","id":"a11s1"},{"type":"principle","title":"ما المقصود بالثقة؟","points":["العملية آمنة.","معلوماته محمية.","المبلغ واضح.","النتيجة متوقعة.","الجهة التي يتعامل معها موثوقة."],"intro":"<p>الثقة في تجربة الدفع تعني شعور المستخدم بأن:</p>","chart":{"kind":"hub","items":["🛡️ الثقة","عملية آمنة","معلومات محمية","مبلغ واضح","نتيجة متوقعة","جهة موثوقة"]},"id":"a11s2"},{"type":"principle","title":"سهولة الاستخدام ≠ الشعور بالأمان","points":["سهلة + غير مطمئنة.","مطمئنة + معقدة."],"intro":"<p>سهولة الاستخدام تسأل: هل أستطيع تنفيذ العملية بسهولة؟ والثقة تسأل: هل أشعر بالأمان وأنا أنفذها؟ يمكن أن تكون التجربة:</p>","rule":"<p>الهدف هو الجمع بين الاثنين.</p>","chart":{"kind":"matrix","items":["سهولة الاستخدام","الشعور بالأمان","مطمئنة ومعقدة","سهلة ومطمئنة ✓","صعبة وغير مطمئنة","سهلة وغير مطمئنة"]},"id":"a11s3"},{"type":"principle","title":"لماذا ترتفع حساسية المستخدم في الدفع؟","points":["بيانات شخصية.","بيانات مالية.","مبلغ مالي.","قرار نهائي."],"intro":"<p>لأن المستخدم قد يكون أمام أربعة أمور حساسة في لحظة واحدة، وبالتالي تصبح أي علامة غموض أكثر تأثيرًا:</p>","chart":{"kind":"cards","items":["🪪 بيانات شخصية","💳 بيانات مالية","💰 مبلغ مالي","✅ قرار نهائي"]},"id":"a11s4"},{"type":"tools","title":"كيف نبني الثقة؟","items":["وضوح المعلومات::ماذا سيُخصم؟ متى؟ ماذا سيحدث بعد الدفع؟ ما الخطوة التالية؟","إظهار عناصر الأمان::لا يبحث المستخدم عنها بنفسه؛ تظهر بوضوح وبما يناسب السياق دون إغراق الشاشة بالشعارات.","خيارات دفع مفهومة::بطاقة، محفظة، تحويل، دفع لاحق — تُعرض بشكل مريح يوضح الفرق.","وضوح ما سيحدث بعد العملية::تأكيد، رقم طلب، موعد متوقع."],"id":"a11s5"},{"type":"mistakes","title":"الثقة ليست شعارات","items":["إضافة 12 شعارًا أمنيًا::إشارات متسقة وقليلة في المكان المناسب.","أمان مخفي في صفحة بعيدة::إشارة أمان ظاهرة قرب إدخال البطاقة.","وعود عامة بلا تفاصيل::شفافية في المبلغ والتوقيت والنتيجة.","تجربة غير متسقة بين الشاشات::لغة ونبرة وتصميم متسق حتى النهاية."],"id":"a11s6"},{"type":"principle","title":"الشعور بالتحكم","points":["يفهم ما يحدث.","يتحكم في الخطوات.","يعرف النتيجة."],"intro":"<p>المستخدم يحتاج إلى أن يشعر بأنه:</p>","rule":"<p>التحكم يحوّل الدفع من «قفزة في المجهول» إلى خطوة محسوبة.</p>","chart":{"kind":"steps","items":["يفهم ما يحدث","يتحكم في الخطوات","يعرف النتيجة"]},"id":"a11s7"},{"type":"principle","title":"ماذا يحدث عند فقدان الثقة؟","points":["تردد.","تأجيل القرار.","العودة.","الانسحاب."],"intro":"<p>فقدان الثقة لا يظهر فجأة؛ بل يمر بسلسلة تنتهي بخسارة العملية:</p>","chart":{"kind":"vflow","items":["تردد","تأجيل القرار","العودة","الانسحاب!"]},"id":"a11s8"},{"type":"examples","title":"مفاجآت الدفع وتكلفتها على الثقة","items":["تكلفة إضافية::رسوم لم تُذكر من قبل.","تغيير في السعر::رقم مختلف عمّا رآه في السلة.","مدة توصيل مختلفة::موعد أبعد من المعلن.","طلب معلومات جديدة::حقول لم تكن متوقعة.","خطوة جديدة لم تكن متوقعة::شاشة إضافية قبل الإتمام.","الرسالة::المفاجأة في نهاية الرحلة لها تكلفة عالية على الثقة."],"id":"a11s9"},{"type":"principle","title":"معادلة الثقة والقرار","points":["وضوح + أمان محسوس.","شفافية + تحكم."],"intro":"<p>الثقة تتكون من إشارات متسقة، وتقود إلى استعداد أكبر للإتمام:</p>","chart":{"kind":"equation","items":["وضوح","أمان محسوس","شفافية","تحكم","= ثقة ← استعداد أكبر للإتمام"]},"id":"a11s10"},{"type":"summary","title":"حالة: سهل لكنه لا يطمئن","text":"<p>تطبيق دفعه سهل جدًا، لكن: لا توجد معلومات واضحة عن الأمان، ولا يظهر السعر النهائي بشكل كافٍ، ولا يعرف المستخدم ما سيحدث بعد الدفع. هل المشكلة في سهولة الاستخدام؟</p>","rule":"<p>لا. المشكلة الأساسية في عناصر الثقة والوضوح.</p>","id":"a11s11"}],"exercises":[{"id":"a11e1","title":"سهل أم مطمئن؟","icon":"🤔","mode":"individual","format":"mcq","steps":[],"items":[{"q":"زر الدفع واضح، لكن لا توجد أي معلومات عن العملية أو ما سيحدث بعد الدفع.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":1},{"q":"حقل رقم البطاقة صغير جدًا ويرفض المسافات دون توضيح.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":0},{"q":"ثماني خطوات للدفع، ولا يظهر أي مؤشر أمان عند إدخال البطاقة.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":2},{"q":"يتغير المبلغ الإجمالي في آخر شاشة دون تفسير.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":1},{"q":"شاشة واحدة، إجمالي شامل واضح، إشارة دفع آمن، وتأكيد فوري برقم الطلب.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":3},{"q":"زر «ادفع» يختفي أسفل الشاشة ويحتاج تمريرًا طويلًا للوصول إليه.","options":["مشكلة سهولة استخدام","مشكلة ثقة","الاثنان","لا مشكلة واضحة"],"answer":0}],"scenario":"<p>ستة مواقف من شاشات دفع مختلفة. حدد نوع المشكلة في كل موقف.</p>","principle":"مشكلات السهولة تتعلق بتنفيذ الإجراء؛ مشكلات الثقة تتعلق بالشعور بالأمان تجاه النتيجة.","hint":"<p>اسأل: هل المستخدم عاجز عن التنفيذ، أم قلق من النتيجة؟</p>","why":"يدرّب على التمييز بين نوعين من المشكلات تحتاج كل منهما حلًا مختلفًا.","model":"<p>1: ثقة/وضوح. 2: سهولة استخدام. 3: الاثنان. 4: ثقة. 5: لا مشكلة واضحة. 6: سهولة استخدام.</p>","axis":"a11"},{"id":"a11e2","title":"أكمل الفراغات: الثقة","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"الثقة تعني شعور المستخدم بأن العملية ___.","answer":"آمنة"},{"text":"سهولة الاستخدام تتعلق بوضوح و___ الإجراء.","answer":"سرعة"},{"text":"المستخدم في الدفع يكون أكثر حساسية تجاه ___.","answer":"الغموض"},{"text":"وضوح السعر يساعد على بناء ___.","answer":"الثقة"},{"text":"عناصر الأمان تدعم شعور المستخدم بـ ___.","answer":"الأمان"},{"text":"المفاجآت قد تقلل ___.","answer":"الاطمئنان"},{"text":"المستخدم يحتاج إلى معرفة ما سيحدث ___ الدفع.","answer":"بعد"},{"text":"الشعور بالتحكم يدعم اتخاذ ___.","answer":"القرار"},{"text":"الخيارات يجب أن تُعرض بشكل ___.","answer":"مريح وواضح"},{"text":"الثقة عنصر مؤثر في قرار ___.","answer":"الإتمام"}],"principle":"الثقة شعور بالأمان تجاه النتيجة، وتُبنى بالوضوح وتقليل المفاجآت والشعور بالتحكم.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفردات الثقة ويميزها عن مفردات السهولة.","model":"<p>آمنة، سرعة، الغموض، الثقة، الأمان، الاطمئنان، بعد، القرار، مريح وواضح، الإتمام.</p>","axis":"a11"},{"id":"a11e3","title":"اختيار من متعدد: الثقة","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"الثقة تختلف عن سهولة الاستخدام لأنها تتعلق بـ:","options":["سرعة التطبيق فقط","الشعور بالأمان والاعتماد","لون التطبيق","عدد المنتجات"],"answer":1},{"q":"ما الذي يدعم الثقة؟","options":["المفاجآت","الغموض","وضوح المعلومات","الخطوات المخفية"],"answer":2},{"q":"الشعور بالتحكم يعني أن المستخدم:","options":["لا يعرف ما يحدث","يفهم الخطوات والنتيجة","لا يستطيع الرجوع","يرى خيارات أكثر"],"answer":1},{"q":"ظهور تكلفة جديدة في آخر خطوة قد يؤثر على:","options":["الثقة","الانسحاب","القرار","جميع ما سبق"],"answer":3}],"principle":"الثقة تتعلق بالشعور بالأمان والاعتماد، وتدعمها المعلومات الواضحة والتحكم.","hint":"<p>فرّق بين ما يخص السرعة وما يخص الاطمئنان.</p>","why":"يختبر الفهم الأساسي لمفهوم الثقة.","model":"<p>ب، ج، ب، د.</p>","axis":"a11"},{"id":"a11e4","title":"صح أم خطأ: الثقة","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"سهولة الاستخدام وحدها تكفي لبناء الثقة.","answer":false},{"q":"الثقة ترتبط بالشعور بالأمان.","answer":true},{"q":"الوضوح يساعد على الثقة.","answer":true},{"q":"المفاجآت في الدفع قد تزيد الثقة.","answer":false},{"q":"المستخدم يحتاج إلى فهم النتيجة المتوقعة.","answer":true},{"q":"خيارات الدفع الواضحة تساعد التجربة.","answer":true},{"q":"الثقة لا علاقة لها بالإتمام.","answer":false},{"q":"الشعور بالتحكم يمكن أن يدعم القرار.","answer":true},{"q":"عناصر الأمان يجب أن تكون مفهومة.","answer":true},{"q":"كثرة شعارات الأمان تضمن الثقة.","answer":false}],"principle":"السهولة وحدها لا تبني الثقة، والشعارات الكثيرة لا تضمنها.","hint":"<p>تذكّر الفرق بين السهولة والثقة.</p>","why":"يراجع مفاهيم الثقة بسرعة.","model":"<p>خطأ، صح، صح، خطأ، صح، صح، خطأ، صح، صح، خطأ.</p>","axis":"a11"},{"id":"a11e5","title":"أي تجربة أكثر طمأنينة؟","icon":"😌","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"«ادفع الآن»","b":"«إتمام الدفع — سيتم خصم 249 ريال، والتوصيل يوم الثلاثاء»","answer":"b"},{"a":"«أدخل بيانات بطاقتك»","b":"«أدخل بيانات بطاقتك — الدفع مشفّر ولا نحتفظ برقم البطاقة»","answer":"b"},{"a":"«تم»","b":"«تم الدفع بنجاح — رقم طلبك #45821 وسيصلك إشعار عند الشحن»","answer":"b"}],"scenario":"<p>أزواج من نصوص أزرار ورسائل الدفع. اختاروا الأكثر طمأنينة في كل زوج.</p>","principle":"النص المطمئن يوضح الإجراء والتكلفة والنتيجة المتوقعة.","hint":"<p>الأكثر طمأنينة يجيب عن: كم؟ متى؟ ماذا بعد؟</p>","why":"يحوّل عناصر الثقة إلى صياغات ملموسة.","model":"<p>(ب) في الأزواج الثلاثة، لأنها توضح الإجراء والتكلفة والنتيجة المتوقعة.</p>","axis":"a11"},{"id":"a11e6","title":"مختبر الثقة","icon":"🧪","mode":"group","format":"text","steps":["حددوا 5 عناصر تؤثر على الثقة في الشاشة.","أعيدوا تصميم الشاشة نصيًا.","تحققوا من اتساق الإشارات."],"scenario":"<p>شاشة دفع تحتوي على: سعر غير واضح، زر غامض، خيارات دفع كثيرة، ولا يوجد توضيح لما بعد الدفع.</p>","principle":"الثقة مجموعة إشارات متسقة: وضوح، شفافية، اتساق، أمان ظاهر، نتيجة متوقعة.","task":"<p>اكتبوا العناصر الخمسة المؤثرة على الثقة، ثم وصفًا نصيًا للشاشة بعد إعادة التصميم.</p>","why":"يطبّق عناصر بناء الثقة على شاشة كاملة.","model":"<p>العناصر: الإجمالي الشامل، نص الزر، ترتيب طرق الدفع، إشارة الأمان، ما بعد الدفع. التصميم: «الإجمالي 249 ريال شامل التوصيل»، طرق الدفع الثلاث الأكثر استخدامًا أولًا، قفل صغير «دفع آمن ومشفّر»، زر «ادفع 249 ريال»، سطر «ستصلك رسالة تأكيد برقم الطلب فورًا».</p>","axis":"a11"},{"id":"a11e7","title":"رتّب إشارات الثقة","icon":"🪜","mode":"group","format":"text","steps":["رتّبوا البطاقات الست.","اربطوا كل بطاقة بقرار المستخدم في تلك اللحظة.","دافعوا عن الترتيب."],"scenario":"<p>بطاقات: السعر النهائي، سياسة الإرجاع، معلومات الدفع، عناصر الأمان، معلومات الشحن، زر الدفع.</p>","principle":"ترتيب إشارات الثقة يتبع ما يحتاج المستخدم إلى معرفته في المراحل الأخيرة.","task":"<p>اكتبوا ترتيبكم للبطاقات الست مع تبرير مختصر.</p>","why":"لا توجد إجابة مطلقة؛ التقييم على منطق الترتيب وربطه بقرار المستخدم.","model":"<p>مثال: السعر النهائي ← معلومات الشحن ← سياسة الإرجاع ← معلومات الدفع ← عناصر الأمان (قرب البطاقة) ← زر الدفع.</p>","axis":"a11"},{"id":"a11e8","title":"اكتشف المفاجأة","icon":"😲","mode":"individual","format":"text","steps":["حدد الفرق ومصدره المحتمل.","حدد اللحظة المناسبة لإظهاره.","قدّر الأثر على قرار المستخدم."],"scenario":"<p>رحلة شراء: السلة تعرض 200 ريال، وصفحة الدفع تعرض 248 ريال.</p>","principle":"المفاجأة في نهاية الرحلة لها تكلفة عالية على الثقة.","task":"<p>اكتب: ما المفاجأة؟ متى كان يجب إظهار المعلومة؟ ما أثرها المحتمل؟</p>","why":"يربط المفاجأة بالتوقيت والأثر في موقف مألوف.","model":"<p>ظهور تكلفة إضافية (48 ريال) في اللحظة الأخيرة. الأفضل توضيح التكلفة قبل الإتمام النهائي (في صفحة المنتج أو السلة). الأثر: تراجع الثقة واحتمال الانسحاب.</p>","axis":"a11"},{"id":"a11e9","title":"غرفة تحسين الثقة","icon":"🏗️","mode":"group","format":"text","steps":["اقترحوا 3 عناصر لرفع الثقة.","اقترحوا عنصرين لتوضيح العملية.","حددوا مؤشرًا لقياس الأثر."],"scenario":"<p>20% من المستخدمين ينسحبون عند إدخال بيانات البطاقة.</p>","principle":"لحظة إدخال البطاقة هي ذروة الحساسية؛ الأمان الظاهر والوضوح فيها حاسمان.","task":"<p>اكتبوا: 3 عناصر لرفع الثقة، وعنصرين لتوضيح العملية، ومؤشرًا واحدًا لقياس الأثر.</p>","why":"يركّز التحسين على اللحظة الأعلى حساسية في الرحلة.","model":"<p>الثقة: إشارة تشفير قرب الحقول، شعارات طرق الدفع المعروفة فقط، خيار محفظة رقمية. التوضيح: المبلغ المخصوم فوق الحقول، سطر «لن يتم الخصم إلا بعد التأكيد». المؤشر: نسبة الانتقال من إدخال البطاقة إلى التأكيد.</p>","axis":"a11"},{"id":"a11e10","title":"تدقيق الثقة","icon":"🧾","mode":"group","format":"text","steps":["اختاروا تطبيقًا تعرفونه أو شاشة افتراضية.","مرّوا على العناصر الستة بالأسئلة الثلاثة.","اختاروا أكثر 3 عناصر تحتاج إلى تحسين."],"scenario":"<p>قائمة تدقيق لعناصر شاشة الدفع: السعر، الشحن، الدفع، الأمان، الإرجاع، النتيجة. لكل عنصر ثلاثة أسئلة: واضح؟ يطمئن؟ يحتاج تحسين؟</p>","principle":"التدقيق المنهجي يكشف الفجوات التي لا يلاحظها الفريق المعتاد على التطبيق.","task":"<p>اكتبوا نتيجة التدقيق للعناصر الستة، ثم أكثر 3 عناصر تحتاج إلى تحسين مع التبرير.</p>","why":"يمنحكم أداة تدقيق قابلة للاستخدام في عملكم مباشرة.","model":"<p>مثال: السعر: واضح/يطمئن. الشحن: غير واضح (يحتاج تحسين). الأمان: غير ظاهر (يحتاج تحسين). النتيجة: غامضة (يحتاج تحسين). الأولوية: الشحن ثم الأمان ثم النتيجة لأنها الأقرب لقرار الإتمام.</p>","axis":"a11"}],"highlights":["سهولة الاستخدام ≠ الشعور بالأمان","كيف نبني الثقة: وضوح وأمان وخيارات مفهومة","الثقة ليست شعارات","الشعور بالتحكم"],"unit":4,"icon":"shield","color":10,"scene":"trust","title":"سهل... لكن هل هو مطمئن؟","classic":"تعزيز الثقة داخل تجربة الدفع وتأثيرها على قرار الإتمام","duration":"90 دقيقة","desc":"<p>الثقة شعور المستخدم بأن العملية آمنة ويمكن الاعتماد عليها. وهي تختلف عن سهولة الاستخدام: الأولى تتعلق بالأمان تجاه النتيجة، والثانية بوضوح الإجراء وسرعته. التجربة المثالية تجمع الاثنين.</p>"},{"id":"a12","slides":[{"type":"opening","title":"كيف يخسر التطبيق عملية شراء في آخر 10 ثوانٍ؟","text":"<p>كل شيء سار جيدًا... ثم ظهرت: «رسوم إضافية: 35 ريال»، أو «يجب إنشاء حساب للمتابعة»، أو «حدث خطأ، حاول مرة أخرى».</p>","rule":"<p>ما الذي يحدث لقرار المستخدم في هذه اللحظة؟</p>","chart":{"kind":"flow","items":["اكتشاف","سلة","دفع","«رسوم إضافية: 35 ريال»!"]},"id":"a12s1"},{"type":"principle","title":"طبيعة المرحلة النهائية","points":["ترتفع حساسية المستخدم.","يقل تحمله للأخطاء.","تصبح الثقة أكثر تأثيرًا.","تؤثر التفاصيل الصغيرة بشكل أكبر."],"intro":"<p>المرحلة النهائية هي نقطة اتخاذ القرار، وفيها:</p>","id":"a12s2"},{"type":"principle","title":"لماذا ينسحب المستخدم في اللحظة الأخيرة؟","points":["عدم وضوح النتيجة.","تكلفة غير متوقعة.","زيادة عدد الخطوات.","بطء التنفيذ."],"intro":"<p>أربعة «مطبات» في طريق المستخدم نحو الإتمام:</p>","chart":{"kind":"flow","items":["عدم وضوح النتيجة ⚠️","تكلفة غير متوقعة ⚠️","زيادة الخطوات ⚠️","بطء التنفيذ ⚠️","الإتمام*"]},"id":"a12s3"},{"type":"principle","title":"مبدأ تقليل المفاجآت","points":["قلّت الثقة.","زاد التردد.","وقد يصل الأمر إلى الانسحاب."],"intro":"<p>المستخدم يحتاج إلى تجربة يمكن توقعها. كلما زادت المفاجآت:</p>","chart":{"kind":"vflow","items":["مفاجأة","ثقة أقل","تردد أكبر","انسحاب!"]},"id":"a12s4"},{"type":"examples","title":"أمثلة على المفاجآت","items":["سعر مختلف::رقم لا يطابق ما رآه في السلة.","رسوم جديدة::توصيل أو خدمة لم تُذكر.","وقت توصيل مختلف::موعد أبعد من المعلن.","خطوة تسجيل جديدة::حساب إجباري في آخر لحظة.","طلب بيانات إضافية::حقول غير متوقعة.","تغيير طريقة الدفع::الطريقة المفضلة غير متاحة فجأة.","خطأ غير مفهوم::رسالة تقنية بلا حل."],"id":"a12s5"},{"type":"principle","title":"لا تجعل المستخدم يتساءل","points":["بدل «هل تم الدفع؟»: اجعل النتيجة واضحة.","بدل «ماذا سيحدث الآن؟»: أظهر الخطوة التالية.","بدل «كم سأدفع؟»: أظهر التكلفة النهائية."],"intro":"<p>كل سؤال يطرحه المستخدم في الخطوة الأخيرة يمكن استباقه بمعلومة:</p>","chart":{"kind":"compare","items":["❓ ما يتساءل عنه :: هل تم الدفع؟ ; ماذا سيحدث الآن؟ ; كم سأدفع؟","✅ ما يجب أن يراه :: نتيجة واضحة ; الخطوة التالية ; التكلفة النهائية"]},"id":"a12s6"},{"type":"principle","title":"اللحظات الحرجة: ركّز على الأعلى تأثيرًا","points":["حدد: أين يحدث أكبر فقد؟","ثم: ما اللحظة التي يمكن أن تؤثر أكثر في النتيجة؟"],"intro":"<p>بعض مراحل الرحلة ذات تأثير أكبر على القرار، مثل: إضافة المنتج إلى السلة، وبدء الدفع، وإدخال البيانات. ليس كل تحسين له الأثر نفسه؛ لذلك بدل تحسين كل شيء في الوقت نفسه:</p>","chart":{"kind":"cards","items":["🛒 إضافة المنتج للسلة","💳 بدء الدفع","📝 إدخال البيانات"]},"id":"a12s7"},{"type":"principle","title":"من الإتمام إلى ما بعد الدفع","points":["الاطمئنان.","الثقة.","احتمالية الإتمام (وتكرار الشراء)."],"intro":"<p>قرار المستخدم لا ينتهي عند الدفع. وضوح ما سيحدث بعد الإتمام يزيد:</p>","chart":{"kind":"flow","items":["دفع","تأكيد","ماذا بعد؟","التوصيل","التحديثات*"]},"id":"a12s8"},{"type":"tools","title":"شاشة التأكيد: ما يجب أن تجيب عنه","items":["هل تمت العملية؟::«تم تأكيد طلبك بنجاح».","ما رقم الطلب؟::«رقم الطلب: #45821».","ماذا سي
