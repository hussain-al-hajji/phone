 الإتمام ← عرض ترويجي يغطي الشاشة.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":1},{"q":"مستخدم يستكشف فئة منتجات ← اقتراح منتجات من الفئة نفسها.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0}],"scenario":"<p>عشرة تدخلات تسويقية ظهرت لمستخدمين في مواقف مختلفة. صنّف كل تدخل حسب ارتباطه بسياق المستخدم.</p>","principle":"التدخل الفعّال مرتبط بما يفعله المستخدم الآن؛ الرسالة الصحيحة تجاريًا قد تكون خاطئة سياقيًا.","hint":"<p>اسأل: هل يخدم التدخل ما يحاول المستخدم فعله في هذه اللحظة؟</p>","why":"يدرّب عينك على الحكم بمعيار السياق قبل الحكم على جودة العرض.","model":"<p>مرتبط: 1، 3، 4، 6، 8، 10. غير مرتبط أو غير مناسب للسياق: 2، 5، 7، 9.</p>","axis":"a4"},{"id":"a4e2","title":"حوّل السلوك إلى تدخل","icon":"🔄","mode":"group","format":"text","steps":["اختاروا حالة واحدة أو أكثر.","املؤوا الخانات الخمس لكل حالة.","تأكدوا أن الرسالة مختلفة من حالة لأخرى."],"scenario":"<p>أمام مجموعتكم أربع حالات: (A) مستخدم شاهد منتجًا ولم يشتره. (B) مستخدم أضاف منتجًا للسلة ولم يكمل. (C) مستخدم يزور فئة معينة بشكل متكرر. (D) مستخدم اشترى منتجًا محددًا.</p>","principle":"التدخل الفعّال يُبنى بالاتجاه: سلوك ← حاجة ← هدف ← رسالة ← توقيت.","task":"<p>صمّموا تدخلًا تسويقيًا لكل حالة اخترتموها بجدول من خمس خانات: ماذا يفعل المستخدم؟ ماذا قد يحتاج؟ ما التدخل المناسب؟ ما الرسالة؟ متى تظهر؟</p>","why":"ينقلكم من التفكير في «العرض» إلى التفكير في «المستخدم وحالته».","model":"<p>مثال للحالة B: يفعل: أضاف للسلة وغادر. يحتاج: تذكيرًا أو طمأنة بشأن التكلفة. التدخل: رسالة داخل التطبيق عند العودة. الرسالة: «ما زال منتجك في السلة — التوصيل مجاني لهذا الطلب». التوقيت: عند الزيارة التالية. التقييم: ارتباط التدخل بالسلوك، وضوح الهدف، مناسبة التوقيت، وضوح الرسالة.</p>","axis":"a4"},{"id":"a4e3","title":"أرسل الآن أم انتظر؟","icon":"⏳","mode":"individual","format":"mcq","steps":[],"items":[{"q":"متى يكون التدخل أكثر ارتباطًا بسلوكه؟","options":["فور فتح التطبيق","قبل أن يرى أي منتج","بعد ظهور نمط واضح من اهتمامه","بعد مغادرته التطبيق مباشرة"],"answer":2},{"q":"ما الذي جعل هذا التوقيت أفضل؟","options":["أنه أسرع وقت ممكن","وجود دليل سلوكي على الاهتمام","أن الرسالة أطول","أن العرض أكبر"],"answer":1}],"scenario":"<p>مستخدم فتح التطبيق، ودخل فئة الأحذية، وشاهد 3 منتجات، ثم فتح منتجًا واحدًا وخرج منه، ثم فتح منتجًا ثانيًا.</p>","principle":"التدخل يصبح أكثر ارتباطًا بالسلوك عندما يظهر دليل على اهتمام المستخدم.","hint":"<p>ابحث عن اللحظة التي أصبح لدينا فيها دليل على الاهتمام.</p>","why":"يحوّل مبدأ «التوقيت» إلى قرار ملموس في موقف حقيقي.","model":"<p>الإجابة: بعد ظهور نمط واضح من اهتمامه. ما تغيّر هو أن لدينا دليلًا سلوكيًا (مشاهدات متكررة لفئة محددة) يجعل الرسالة مرتبطة لا عشوائية.</p>","axis":"a4"},{"id":"a4e4","title":"أصلح الرسالة","icon":"🛠️","mode":"individual","format":"text","steps":["حدد ما الغامض في الرسالة الأصلية.","اربطها بما يفعله المستخدم الآن.","اختصرها حتى تصل للفكرة مباشرة."],"scenario":"<p>الرسالة الأصلية التي تظهر لمستخدم يشاهد منتجًا: «لا تفوّت الفرصة! لدينا عروض كثيرة ومميزة جدًا لفترة محدودة، اضغط هنا لمعرفة المزيد.»</p>","principle":"المحتوى المؤثر واضح، مباشر، مرتبط باحتياج المستخدم، وداعم للقرار.","task":"<p>أعد كتابة الرسالة بحيث تكون أوضح، وأكثر ارتباطًا بالسياق، وأقل غموضًا، ومرتبطة بخطوة المستخدم.</p>","why":"يحوّل معايير «المحتوى المؤثر» إلى مهارة كتابة عملية.","model":"<p>إذا كان المستخدم يشاهد منتجًا: «خصم 20% على المنتج الذي تشاهده — العرض متاح حتى نهاية اليوم.» الإجابة ليست محفوظة؛ المهم تحقق المعايير الأربعة.</p>","axis":"a4"}],"highlights":["التدخل مقابل الإعلان التقليدي","ابدأ من سلوك المستخدم لا من العرض","التوقيت: مبكر جدًا، مناسب، متأخر جدًا","محتوى واضح ومباشر وداعم للقرار"],"unit":2,"icon":"megaphone","color":3,"scene":"megaphone","title":"رسالة في اللحظة المناسبة","classic":"فهم التسويق داخل التطبيق كأداة لتوجيه سلوك المستخدم","duration":"90 دقيقة","desc":"<p>التسويق داخل التطبيق ليس إعلانًا تقليديًا، بل تدخلات تظهر أثناء الاستخدام للتأثير في السلوك: عروض، إشعارات، رسائل، توصيات. نجاحها يرتبط بالسياق والتوقيت والمحتوى، لا بمجرد وجودها.</p>"},{"id":"a5","slides":[{"type":"opening","title":"رسالة واحدة للجميع أم رسائل حسب السلوك؟","text":"<p>الرسائل العامة تُعرض للجميع بالشكل نفسه، وقد يكون تأثيرها أقل لأنها لا تراعي سلوك المستخدم. أما الرسائل المخصصة فتُبنى على معلومات عن المستخدم وسلوكه: المنتجات التي شاهدها، ومرحلة الرحلة، والتفاعل السابق مع العروض.</p>","rule":"<p>كلما زادت دقة البيانات، زادت إمكانية تخصيص الرسالة.</p>","chart":{"kind":"compare","items":["📣 رسالة عامة :: نفس الرسالة ; تصل للجميع ; لا تراعي السلوك","🎯 رسالة مخصصة :: سلوك مختلف ; رسالة مختلفة ; ترتبط بالمرحلة"]},"id":"a5s1"},{"type":"principle","title":"التخصيص أعمق من «مرحبًا يا أحمد»","points":["السلوك: ماذا شاهد المستخدم؟","الاهتمام: ما الفئة التي يتفاعل معها؟","المرحلة: أين هو في رحلة الشراء؟","التفاعل السابق: كيف استجاب لعروض سابقة؟"],"intro":"<p>التخصيص يعني أن تتوافق الرسالة مع حالة المستخدم، وليس فقط أن تحمل اسمه. يمكن أن يرتبط بـ:</p>","rule":"<p>«مرحبًا أحمد 👋» تخصيص سطحي؛ «أكملت مشاهدة هذه الفئة — إليك خيارات مشابهة» تخصيص حقيقي.</p>","chart":{"kind":"compare","items":["👋 تخصيص سطحي :: «مرحبًا أحمد» ; يحمل الاسم فقط","🎯 تخصيص حقيقي :: «أكملت مشاهدة هذه الفئة — إليك خيارات مشابهة» ; يعتمد على السلوك والمرحلة"]},"id":"a5s2"},{"type":"tools","title":"مصادر التخصيص","items":["سلوك التصفح::ماذا يفتح المستخدم وكم مرة يعود إليه.","المنتجات التي تم عرضها::أساس التوصيات المرتبطة.","مرحلة المستخدم داخل رحلة الشراء::تحدد نوع الرسالة المناسبة.","التفاعل السابق مع العروض::يكشف ما يجذبه وما يتجاهله."],"id":"a5s3"},{"type":"principle","title":"كلما عرفنا أكثر... لا يعني أن نرسل أكثر","points":["في الوقت الخطأ.","بشكل متكرر.","في مرحلة لا تحتاج فيها إلى تدخل.","بطريقة تقطع رحلة المستخدم."],"intro":"<p>يمكن أن تكون الرسالة مخصصة جدًا، لكنها تظهر:</p>","rule":"<p>تخصيص + توقيت + سياق أهم من التخصيص وحده.</p>","chart":{"kind":"equation","items":["التخصيص","التوقيت","السياق","= تدخل أكثر ملاءمة"]},"id":"a5s4"},{"type":"principle","title":"عندما يتحول التسويق إلى ضوضاء","points":["لا نقيس جودة كل رسالة منفردة فقط.","ننظر إلى تجربة المستخدم مع جميع التدخلات مجتمعة."],"intro":"<p>تخيل مستخدمًا يتلقى إشعارًا، ثم نافذة داخل التطبيق، ثم عرضًا، ثم رسالة، ثم توصية — خلال دقائق قليلة. حتى لو كانت كل رسالة جيدة منفردة، قد تصبح التجربة ككل مزعجة.</p>","rule":"<p>رسالة واحدة في اللحظة المناسبة تتفوق على خمس رسائل متراكمة.</p>","chart":{"kind":"compare","items":["🔔 ضوضاء :: إشعار ; نافذة ; عرض ; رسالة ; توصية","✨ تدخل واحد :: رسالة واحدة في اللحظة المناسبة"]},"id":"a5s5"},{"type":"principle","title":"التسويق داخل التطبيق ليس طبقة منفصلة عن التجربة","points":["سلوك المستخدم ← فهم الحالة.","تحديد نقطة التدخل ← اختيار الرسالة.","التوقيت ← التفاعل ← التحويل."],"intro":"<p>المعادلة تسير في اتجاه واحد واضح يبدأ بالسلوك وينتهي بالتحويل. إذا بدأنا من الرسالة بدل السلوك، قد يصبح التدخل منفصلًا عن رحلة المستخدم.</p>","chart":{"kind":"flow","items":["سلوك المستخدم","فهم الحالة","نقطة التدخل","الرسالة","التوقيت","التفاعل","التحويل*"]},"id":"a5s6"},{"type":"examples","title":"من السلوك إلى الرسالة: مثال متكامل","items":["السيناريو::المستخدم شاهد منتجًا، وعاد إليه في زيارة أخرى، ولم يشترِ، وشاهد منتجات مشابهة، ثم غادر.","السلوك::اهتمام متكرر.","الحالة المحتملة::ما زال في مرحلة التقييم.","التدخل المحتمل::رسالة تساعد على المقارنة أو القرار.","التوقيت::بعد ظهور نمط واضح من الاهتمام.","المحتوى::مرتبط بالمنتج أو الفئة، وليس عرضًا عامًا."],"id":"a5s7"},{"type":"principle","title":"التدخل الناجح يربط أربعة عناصر","points":["من؟ من هو المستخدم؟","متى؟ أين يوجد في الرحلة؟","ماذا؟ ما الرسالة التي يحتاجها؟","لماذا؟ ما السلوك الذي نريد دعمه؟"],"intro":"<p>قبل تصميم أي تدخل، أجب عن أربعة أسئلة متصلة:</p>","chart":{"kind":"hub","items":["تدخل تسويقي مناسب","من؟","متى؟","ماذا؟","لماذا؟"]},"id":"a5s8"},{"type":"summary","title":"التخصيص فهم لا اسم","text":"<p>التخصيص يعتمد على فهم سلوك المستخدم لا على بياناته الأساسية. مصادره: التصفح، والمنتجات المعروضة، والمرحلة، والتفاعل السابق. ولا ينجح إلا مع توقيت وسياق مناسبين، ودون أن يتحول إلى ضوضاء.</p>","rule":"<p>اختلاف السلوك ← اختلاف التدخل المحتمل.</p>","id":"a5s9"}],"exercises":[{"id":"a5e1","title":"أي رسالة أكثر تخصيصًا؟","icon":"💌","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي رسالة أكثر ارتباطًا بسلوكه؟","options":["«مرحبًا بك في متجرنا.»","«لدينا عروض جديدة هذا الأسبوع.»","«خيارات مشابهة للمنتجات التي شاهدتها.»","«لا تفوّت عروضنا.»"],"answer":2},{"q":"ما البيانات التي سمحت بهذه الرسالة؟","options":["اسم المستخدم","سلوك التصفح والمنتجات التي شاهدها","موقعه الجغرافي فقط","تاريخ تسجيله"],"answer":1}],"scenario":"<p>المستخدم شاهد ثلاثة منتجات من فئة معينة.</p>","principle":"التخصيص الحقيقي يُبنى على بيانات السلوك لا على الاسم أو العبارات العامة.","hint":"<p>ابحث عن الرسالة التي لا يمكن كتابتها دون معرفة ما فعله المستخدم.</p>","why":"يميّز بين التخصيص السطحي والتخصيص السلوكي في مثال مباشر.","model":"<p>الرسالة الأكثر ارتباطًا: «خيارات مشابهة للمنتجات التي شاهدتها». والبيانات التي سمحت بها: سلوك التصفح والمنتجات التي شاهدها المستخدم.</p>","axis":"a5"},{"id":"a5e2","title":"أكمل الفراغ: لغة التخصيص","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"يمكن تخصيص الرسائل بناءً على سلوك ___.","answer":"التصفح"},{"text":"المنتجات التي شاهدها المستخدم تمثل مصدرًا من مصادر ___.","answer":"التخصيص"},{"text":"مرحلة المستخدم داخل ___ تساعد في تحديد الرسالة.","answer":"رحلة الشراء"},{"text":"التفاعل السابق مع ___ يمكن أن يساعد في التخصيص.","answer":"العروض"},{"text":"الرسالة العامة تُعرض بالشكل نفسه على جميع ___.","answer":"المستخدمين"},{"text":"الرسالة المخصصة ترتبط ببيانات عن ___.","answer":"سلوك المستخدم"},{"text":"الهدف من التخصيص زيادة ___ الرسالة للمستخدم.","answer":"ملاءمة"},{"text":"استخدام بيانات أكثر دقة يمكن أن يحسن ___.","answer":"فعالية التخصيص"},{"text":"التخصيص لا يعني فقط استخدام ___ المستخدم.","answer":"اسم"},{"text":"الرسالة الجيدة ترتبط بسياق ___.","answer":"المستخدم"}],"principle":"مصادر التخصيص ومعاييره هي المفردات الأساسية لأي خطة تسويق داخل التطبيق.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مصطلحات التخصيص بالتعاون والاتفاق داخل المجموعة.","model":"<p>التصفح، التخصيص، رحلة الشراء، العروض، المستخدمين، سلوك المستخدم، ملاءمة، فعالية التخصيص، اسم، المستخدم.</p>","axis":"a5"},{"id":"a5e3","title":"صح أم خطأ: التخصيص والتوقيت","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"الرسالة المخصصة تكون فعالة بالضرورة.","answer":false},{"q":"التوقيت يؤثر في نجاح الرسالة.","answer":true},{"q":"يمكن أن يكون التدخل المبكر جدًا مزعجًا.","answer":true},{"q":"الرسائل العامة مناسبة لكل المستخدمين بالدرجة نفسها.","answer":false},{"q":"التخصيص يمكن أن يعتمد على سلوك التصفح.","answer":true},{"q":"استخدام اسم المستخدم وحده يمثل كل أشكال التخصيص.","answer":false},{"q":"الرسالة يجب أن ترتبط بسياق المستخدم.","answer":true},{"q":"زيادة عدد الرسائل تعني بالضرورة زيادة التأثير.","answer":false},{"q":"مرحلة رحلة المستخدم تساعد في اختيار التدخل.","answer":true},{"q":"محتوى الرسالة يجب أن يقلل الغموض والتعقيد.","answer":true}],"principle":"التخصيص لا يكفي وحده؛ يحتاج إلى توقيت وسياق، وكثرة الرسائل لا تعني تأثيرًا أكبر.","hint":"<p>الكلمات المطلقة («بالضرورة»، «وحده»، «كل») غالبًا تستحق التدقيق.</p>","why":"يختبر فهم العلاقة بين التخصيص والتوقيت والسياق بسرعة.","model":"<p>خطأ، صح، صح، خطأ، صح، خطأ، صح، خطأ، صح، صح.</p>","axis":"a5"},{"id":"a5e4","title":"غرفة التحكم التسويقي","icon":"🎛️","mode":"group","format":"text","steps":["ضعوا أنفسكم مكان مستخدم يدفع الآن.","وزّعوا التدخلات الأربعة على ثلاث خانات.","برروا كل قرار بجملة."],"scenario":"<p>لديكم أربعة تدخلات جاهزة: عرض خصم، توصية بمنتج مشابه، تذكير بالسلة، رسالة تأكيد. والمستخدم حاليًا في مرحلة الدفع.</p>","principle":"في لحظة الإتمام، أي تدخل لا يخدم الإتمام نفسه قد يتحول إلى تشويش.","task":"<p>رتّبوا التدخلات إلى: مناسب الآن / ممكن لاحقًا / غير مناسب في هذه اللحظة، مع تبرير مختصر.</p>","why":"يدرّب على إدارة «مزيج» التدخلات حسب المرحلة لا على تقييم كل رسالة منفردة.","model":"<p>الرسالة المرتبطة بالإتمام أو توضيح العملية هي الأقرب لسياق المستخدم (رسالة التأكيد: مناسب الآن). التوصية والعرض: ممكن لاحقًا بعد الإتمام. أي عرض يقطع الدفع: غير مناسب في هذه اللحظة.</p>","axis":"a5"},{"id":"a5e5","title":"ابنِ التدخل","icon":"🧱","mode":"group","format":"text","steps":["اختاروا حالة (أو أكثر).","افصلوا ما تعرفونه عمّا لا تعرفونه.","صمّموا الرسالة وتوقيتها."],"scenario":"<p>لكل مجموعة حالة: (1) مستخدم شاهد منتجًا مرة واحدة. (2) شاهد المنتج ثلاث مرات. (3) أضاف المنتج للسلة ثم غادر. (4) اشترى منتجًا من فئة معينة. (5) يتصفح فئة معينة باستمرار.</p>","principle":"اختلاف السلوك يعني اختلاف التدخل المحتمل؛ لا رسالة واحدة تصلح للجميع.","task":"<p>لكل حالة اخترتموها: ما الذي نعرفه؟ ماذا لا نعرف؟ ما التدخل المحتمل؟ ما الرسالة؟ متى تظهر؟</p>","why":"يرسّخ أن التخصيص قرار مبني على قراءة السلوك وحدود ما نعرفه.","model":"<p>مثال للحالة 2: نعرف: اهتمام متكرر بالمنتج. لا نعرف: سبب عدم الشراء. التدخل: رسالة تساعد على القرار. الرسالة: «هل تحتاج مقارنة سريعة؟ إليك أهم الفروق». التوقيت: عند الزيارة الثالثة.</p>","axis":"a5"},{"id":"a5e6","title":"المقارنة النهائية","icon":"🆚","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"الجمهور: عام لجميع المستخدمين.","b":"الجمهور: مستخدمون بسلوك محدد.","answer":"b"},{"a":"التوقيت: بعد سلوك محدد.","b":"التوقيت: عند الدخول.","answer":"a"},{"a":"الهدف: ترويج عام.","b":"الهدف: دعم الإتمام.","answer":"b"},{"a":"التخصيص: أعلى.","b":"التخصيص: منخفض.","answer":"a"}],"scenario":"<p>التدخل (أ) يظهر لجميع المستخدمين فور فتح التطبيق: «خصم 30% على منتجاتنا! اشترِ الآن.» التدخل (ب) يظهر لمستخدم أضاف منتجًا إلى السلة ثم غادر: «ما زال المنتج في سلتك. يمكنك العودة لإكمال طلبك.» في كل زوج، اختاروا الوصف الذي ينطبق على التدخل (ب).</p>","principle":"التدخل المبني على سلوك محدد ومرحلة محددة أكثر ارتباطًا بالمستخدم من التدخل العام.","hint":"<p>قارنوا الجمهور والتوقيت والسياق والهدف والتخصيص.</p>","why":"يفكك الفرق بين تدخلين إلى عناصر قابلة للمقارنة.","model":"<p>التدخل (ب): جمهور بسلوك محدد، توقيت بعد سلوك محدد، سياق مرتبط بالسلة، هدف دعم الإتمام، تخصيص أعلى. لأنه بُني على سلوك محدد ومرحلة محددة من رحلة المستخدم.</p>","axis":"a5"}],"highlights":["الرسائل العامة مقابل المخصصة","مصادر التخصيص الأربعة","تخصيص + توقيت + سياق","من؟ متى؟ ماذا؟ لماذا؟"],"unit":2,"icon":"target","color":4,"scene":"target","title":"التخصيص أعمق من «مرحبًا يا أحمد»","classic":"تخصيص الرسائل التسويقية داخل التطبيق وربطها بسلوك المستخدم","duration":"75 دقيقة","desc":"<p>الرسائل العامة تُعرض للجميع بالشكل نفسه، أما المخصصة فتُبنى على السلوك والاهتمام والمرحلة والتفاعل السابق. نتعلم هنا مصادر التخصيص، والفرق بين التخصيص والإزعاج، وكيف نبني تدخلًا يربط أربعة عناصر.</p>"},{"id":"a6","slides":[{"type":"opening","title":"إذا تدخلنا... ماذا نراقب؟","text":"<p>لا يكفي أن نقول: «المستخدم شاهد الرسالة». نحتاج إلى معرفة ما حدث بعدها: هل تفاعل؟ هل انتقل للخطوة التالية؟ هل تغيّر سلوكه؟ هل ارتفع الإتمام أو التحويل؟</p>","rule":"<p>التفاعل ليس النتيجة النهائية.</p>","chart":{"kind":"flow","items":["رسالة","تفاعل","سلوك","نتيجة*"]},"id":"a6s1"},{"type":"principle","title":"الوصول ≠ التفاعل ≠ التحويل","points":["ظهرت الرسالة لـ 10,000 مستخدم: نعرف حجم الوصول فقط.","تفاعل معها 1,500: أضفنا التفاعل.","انتقل 500 إلى الخطوة التالية: أصبح لدينا أثر محتمل على السلوك.","ارتفعت نسبة الإتمام في المجموعة المستهدفة: اقتربنا من فهم الأثر على النتيجة التجارية."],"intro":"<p>كل رقم يضيف طبقة فهم جديدة، ولا يغني أحدها عن الآخر:</p>","chart":{"kind":"funnel","items":["الوصول::10000","التفاعل::1500","الخطوة التالية::500","الإتمام::؟"]},"id":"a6s2"},{"type":"principle","title":"لماذا لا تتفاعل الرسائل التسويقية؟","points":["هل الرسالة مرتبطة بسلوك المستخدم؟","هل التوقيت مناسب؟","هل المحتوى واضح؟","هل الرسالة تقدم قيمة؟","هل المستخدم في مرحلة تحتاج هذا التدخل؟","هل الرسائل متكررة؟","هل الرسالة تطلب إجراءً واضحًا؟"],"intro":"<p>تطبيق تجارة عبر الهاتف يطلق حملات داخل التطبيق، لكنه يلاحظ انخفاض التفاعل مع الرسائل، وتجاهل العروض، وضعف الاستجابة. قبل اقتراح أي حل نحلل السبب بسبعة أسئلة:</p>","id":"a6s3"},{"type":"mistakes","title":"عندما يصبح التدخل التسويقي جزءًا من المشكلة","items":["إرسال الرسالة نفسها للجميع::قسّم المستخدمين حسب السلوك وخصص الرسالة لكل شريحة.","التدخل قبل أن يتشكل اهتمام المستخدم::انتظر دليلًا سلوكيًا على الاهتمام.","التدخل بعد فوات اللحظة المناسبة::اربط الرسالة بالحدث الذي يسبقها مباشرة.","رسالة لا ترتبط بسياق المستخدم::ابدأ من ما يفعله المستخدم الآن.","محتوى طويل أو غامض::رسالة واضحة ومباشرة بإجراء واحد.","التركيز على فتح الرسالة بدل أثرها::قِس الانتقال والتحويل لا الفتح وحده.","إغراق المستخدم بالتدخلات::حدد سقفًا للتكرار وانظر للتجربة ككل."],"id":"a6s4"},{"type":"tools","title":"قبل أن نضغط «إرسال»: قائمة فحص","items":["هل الرسالة مرتبطة بالسلوك؟::اربطها بحدث فعلي قام به المستخدم.","هل التوقيت مناسب؟::ليست مبكرة جدًا ولا متأخرة جدًا.","هل المستخدم يحتاجها الآن؟::تناسب مرحلته في الرحلة.","هل المحتوى واضح؟::يُفهم من القراءة الأولى.","هل تقدم قيمة؟::فائدة محددة لا عبارة عامة.","هل الإجراء المطلوب واضح؟::زر واحد بفعل واضح.","هل قد تعطل رحلة المستخدم؟::لا تقطع خطوة حرجة كالدفع."],"id":"a6s5"},{"type":"principle","title":"الرسالة ليست الهدف","points":["التفاعل: هل انتبه المستخدم للرسالة؟","السلوك: هل تغيّر ما يفعله بعدها؟","التحويل: هل انعكس ذلك على النتيجة؟"],"intro":"<p>الهدف النهائي ليس فتح الرسالة، ولا الضغط عليها، بل دعم السلوك الذي يخدم رحلة المستخدم والنتيجة التجارية. لذلك نقرأ التأثير عبر ثلاث مراحل متتابعة:</p>","chart":{"kind":"flow","items":["التفاعل","السلوك","التحويل*"]},"id":"a6s6"},{"type":"examples","title":"لو كنت مسؤول التسويق داخل التطبيق... ماذا ستفعل؟","items":["المستخدم::شاهد المنتج مرتين، وأضافه للسلة، ولم يكمل الشراء.","الخيار A::إرسال خصم عام لجميع المستخدمين.","الخيار B::إرسال رسالة مرتبطة بالسلة.","الخيار C::إظهار إعلان لفئة منتجات مختلفة.","المنطق::الخيار المرتبط بسلوك السلة (B) هو الأقرب إلى سياق المستخدم، لكن فعاليته الفعلية تحتاج إلى اختبار وقياس."],"id":"a6s7"},{"type":"principle","title":"إطار إدارة التسويق داخل التطبيق","points":["افهم: ماذا يفعل المستخدم؟","حدّد: أين هو في الرحلة؟","شخّص: ما الذي يحتاجه؟","صمّم: ما التدخل المناسب؟","وقّت: متى يظهر؟","خصّص: كيف يرتبط بسلوكه؟","قِس: ماذا حدث بعد التدخل؟"],"intro":"<p>أهم إطار في الوحدة؛ حلقة مستمرة لأن القياس يعيدنا مرة أخرى إلى فهم السلوك:</p>","chart":{"kind":"cycle","items":["افهم","حدّد","شخّص","صمّم","وقّت","خصّص","قِس"]},"id":"a6s8"},{"type":"summary","title":"التسويق داخل التطبيق يبدأ من المستخدم","text":"<p>التسويق داخل التطبيق تدخل مرتبط بسلوك المستخدم. السياق يحدد ملاءمة الرسالة، والتوقيت عنصر أساسي في نجاحها، والمحتوى يجب أن يكون واضحًا ومباشرًا. التخصيص يعتمد على فهم السلوك، والتفاعل ليس النتيجة النهائية؛ القياس الحقيقي يمتد إلى أثر التدخل على السلوك والتحويل.</p>","rule":"<p>من فهم السلوك إلى التأثير في السلوك: سلوك ← فهم ← تدخل ← استجابة ← تحويل.</p>","id":"a6s9"}],"exercises":[{"id":"a6e1","title":"ما المؤشر الذي تبحث عنه؟","icon":"📈","mode":"individual","format":"mcq","steps":[],"items":[{"q":"الرسالة ظهرت لـ 10,000 مستخدم. ماذا نعرف؟","options":["حجم الوصول فقط","نجاح الحملة","ارتفاع المبيعات","تغيّر السلوك"],"answer":0},{"q":"1,500 مستخدم تفاعلوا معها. ماذا أضفنا؟","options":["التفاعل","التحويل المؤكد","الإيراد","الولاء"],"answer":0},{"q":"500 مستخدم انتقلوا إلى الخطوة التالية. ماذا أصبح لدينا؟","options":["حجم الوصول","أثر محتمل على السلوك","نتيجة تجارية مؤكدة","لا شيء جديد"],"answer":1},{"q":"ارتفعت نسبة الإتمام في المجموعة المستهدفة. ماذا أصبحنا أقرب لفهمه؟","options":["عدد من شاهد الرسالة","الأثر المحتمل للتدخل على النتيجة التجارية","تصميم الرسالة","عدد الإشعارات"],"answer":1}],"scenario":"<p>حملة داخل التطبيق مرّت بأربع مراحل من الأرقام. لكل رقم دلالة مختلفة.</p>","principle":"الوصول والتفاعل والسلوك والتحويل طبقات فهم متتالية، ولا يغني أحدها عن الآخر.","hint":"<p>اسأل: ماذا يضيف هذا الرقم تحديدًا إلى فهمنا؟</p>","why":"يمنع الخلط الشائع بين «شاهدها كثيرون» و«نجحت الحملة».","model":"<p>10,000 ظهور: حجم الوصول فقط. 1,500 تفاعل: التفاعل. 500 انتقلوا: أثر محتمل على السلوك. ارتفاع الإتمام: الأثر المحتمل على النتيجة التجارية.</p>","axis":"a6"},{"id":"a6e2","title":"تشخيص ضعف التفاعل","icon":"🩻","mode":"group","format":"text","steps":["مرّوا على الأسئلة السبعة (الارتباط، التوقيت، الوضوح، القيمة، المرحلة، التكرار، وضوح الإجراء).","اختاروا سببين محتملين فقط.","اقترحوا تحسينًا واحدًا لكل سبب."],"scenario":"<p>تطبيق تجارة عبر الهاتف يطلق حملات داخل التطبيق، ويلاحظ: انخفاض التفاعل مع الرسائل، وتجاهل العروض، وضعف الاستجابة.</p>","principle":"ضعف التفاعل عَرَض؛ الأسئلة السبعة تساعد على تحديد السبب قبل الحل.","task":"<p>اكتبوا سببين محتملين لضعف التفاعل، ولكل سبب تحسينًا واحدًا مقترحًا.</p>","why":"يدرّب على التشخيص المركّز بدل قوائم الأسباب الطويلة غير القابلة للتنفيذ.","model":"<p>مثال: السبب 1: الرسائل غير مرتبطة بالسلوك ← تقسيم المستخدمين وربط الرسائل بما شاهدوه. السبب 2: الرسائل متكررة ← وضع سقف للتكرار ودمج الرسائل المتشابهة.</p>","axis":"a6"},{"id":"a6e3","title":"قبل الإرسال","icon":"📨","mode":"individual","format":"mcq","steps":[],"items":[{"q":"مرتبطة بسلوك المستخدم؟","options":["✓ مناسب","⚠️ يحتاج مراجعة"],"answer":1},{"q":"التوقيت مناسب؟","options":["✓ مناسب","⚠️ يحتاج مراجعة"],"answer":1},{"q":"المحتوى واضح؟","options":["✓ مناسب","⚠️ يحتاج مراجعة"],"answer":1},{"q":"تقدم قيمة محددة؟","options":["✓ مناسب","⚠️ يحتاج مراجعة"],"answer":1},{"q":"الإجراء المطلوب واضح؟","options":["✓ مناسب","⚠️ يحتاج مراجعة"],"answer":1}],"scenario":"<p>أمامك الرسالة: «عرض حصري! لا تفوت الفرصة! اضغط الآن!» — قيّمها بالمعايير السبعة لقائمة الفحص.</p>","principle":"قائمة الفحص تحوّل الحدس إلى تقييم منهجي قبل الإطلاق.","hint":"<p>قيّم كل معيار بمعزل عن الانطباع العام للرسالة.</p>","why":"يجعل قائمة الفحص أداة عمل حقيقية تستخدمها قبل أي حملة.","model":"<p>الرسالة تفتقد غالبًا إلى: سياق واضح، قيمة محددة، سبب مناسب، وضوح الإجراء، تخصيص. أغلب المعايير: ⚠️ يحتاج مراجعة.</p>","axis":"a6"},{"id":"a6e4","title":"صحّح التفكير التسويقي","icon":"🧠","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"إذا فتح المستخدم الرسالة فالحملة ناجحة.","b":"فتح الرسالة مؤشر تفاعل، ويحتاج إلى النظر لما حدث بعدها.","answer":"b"},{"a":"التخصيص يعني استخدام اسم العميل.","b":"التخصيص يمكن أن يعتمد على سلوك المستخدم ومرحلة الرحلة.","answer":"b"},{"a":"أفضل وقت لإرسال الرسالة هو أسرع وقت ممكن.","b":"التوقيت يجب أن يرتبط بسياق المستخدم.","answer":"b"},{"a":"الرسالة الجيدة تصل إلى الجميع.","b":"الرسالة الجيدة ترتبط بالمستخدم وسياقه وهدف التدخل.","answer":"b"},{"a":"زيادة الرسائل تزيد التأثير.","b":"كثرة الرسائل قد تؤثر سلبًا على تجربة المستخدم.","answer":"b"}],"scenario":"<p>خمسة أزواج من العبارات حول قياس التسويق والتخصيص. اختاروا العبارة الأدق في كل زوج.</p>","principle":"فتح الرسالة مؤشر تفاعل، والتوقيت والتخصيص يرتبطان بسياق المستخدم لا بالسرعة أو الكمية.","hint":"<p>العبارة الأدق تربط الحكم بما حدث بعد الرسالة وبسياق المستخدم.</p>","why":"يصحح أكثر الافتراضات شيوعًا في فرق التسويق.","model":"<p>العبارة (ب) في كل الأزواج؛ لأنها تنظر إلى الأثر والسياق لا إلى الرقم السطحي أو الكمية.</p>","axis":"a6"},{"id":"a6e5","title":"صمّم حملة داخل التطبيق","icon":"🎨","mode":"group","format":"text","steps":["املؤوا لكل مستخدم: السلوك، التدخل، الرسالة، التوقيت، الهدف.","لا يجوز استخدام الرسالة نفسها للمستخدمين الثلاثة.","جهزوا عرض الاستراتيجية في 90 ثانية."],"scenario":"<p>متجر إلكتروني يريد زيادة إتمام الشراء داخل التطبيق. لديه ثلاثة أنماط من المستخدمين: (A) يتصفح المنتجات فقط. (B) شاهد منتجًا عدة مرات. (C) أضاف منتجًا للسلة ولم يكمل.</p>","principle":"الاستراتيجية الجيدة تصمم تدخلًا مختلفًا لكل نمط سلوكي.","task":"<p>صمّموا 3 تدخلات مختلفة (لكل مستخدم: السلوك، التدخل، الرسالة، التوقيت، الهدف).</p>","why":"يطبّق مفاهيم الوحدة كاملة في استراتيجية مصغّرة قابلة للعرض.","model":"<p>A: يتصفح ← توصيات من الفئة ← «اكتشف الأكثر مبيعًا في هذه الفئة» ← بعد تصفح 3 منتجات ← دعم الاستكشاف. B: شاهد مرارًا ← مساعدة على القرار ← «مقارنة سريعة بين الخيارات» ← الزيارة الثالثة ← تقليل التردد. C: سلة متروكة ← تذكير ← «ما زال منتجك في السلة» ← عند العودة ← دعم الإتمام.</p>","axis":"a6"},{"id":"a6e6","title":"غرفة عمليات التسويق","icon":"🏢","mode":"group","format":"text","steps":["اعملوا كفريق إدارة تسويق داخل التطبيق.","ابنوا خطة من 7 خطوات.","اختصروها في ورقة واحدة."],"scenario":"<p>تطبيق تجارة إلكترونية يرسل عددًا كبيرًا من الرسائل والعروض داخل التطبيق. نسبة التفاعل منخفضة، وبعض المستخدمين يشتكون من كثرة الإشعارات، والمستخدمون الذين يصلون إلى المنتجات لا يتفاعلون بالطريقة نفسها. الإدارة تريد «زيادة الحملات».</p>","principle":"إدارة التسويق داخل التطبيق دورة: سلوك ← تدخل ← توقيت ← رسالة ← سلوك متوقع ← قياس.","task":"<p>ابنوا خطة من 7 خطوات: ما السلوك الذي نحتاج إلى فهمه؟ كيف نقسّم المستخدمين حسب سلوكهم؟ ما نقاط التدخل؟ ما الرسالة المناسبة لكل حالة؟ ما التوقيت؟ كيف نخصص الرسائل؟ كيف نقيس أثرها؟</p>","why":"النشاط الختامي للوحدة؛ يربط الإطار العملي بحالة واقعية فيها ضغط إداري.","model":"<p>معايير التقييم (10 نقاط): فهم سلوك المستخدم (2)، تحديد نقطة التدخل (2)، مناسبة الرسالة (2)، مناسبة التوقيت والتخصيص (2)، وضوح القياس (2). المخرج: User Behavior ← Intervention ← Timing ← Message ← Expected Behavior ← Measurement.</p>","axis":"a6"}],"highlights":["الوصول ≠ التفاعل ≠ التحويل","تشخيص ضعف التفاعل بسبعة أسئلة","قائمة فحص قبل الإرسال","الإطار العملي بسبع خطوات"],"unit":2,"icon":"gauge","color":5,"scene":"measure","title":"ما بعد «تمت المشاهدة»","classic":"قياس أثر التسويق داخل التطبيق وتحسينه لرفع التحويل","duration":"90 دقيقة","desc":"<p>لا يكفي أن نقول «المستخدم شاهد الرسالة». نتعلم هنا التمييز بين الوصول والتفاعل والتحويل، وتشخيص ضعف التفاعل، وتجنّب الأخطاء الشائعة، وبناء إطار متكامل لإدارة التسويق داخل التطبيق.</p>"},{"id":"a7","slides":[{"type":"opening","title":"التطبيق الجميل... هل يعني تطبيقًا سهل الاستخدام؟","text":"<p>التطبيق A: تصميم بصري جذاب، صور كبيرة، ألوان متناسقة، تأثيرات وحركة — لكن الوصول للمنتج صعب، والخيارات كثيرة، والمسار غير واضح. التطبيق B: تصميم أبسط، عناصر أقل، مسار واضح، ووصول أسرع للمنتج.</p>","rule":"<p>لو كان الهدف إتمام عملية شراء، أيهما يحتاج إلى تحليل أعمق؟</p>","chart":{"kind":"compare","items":["🎨 التطبيق A :: تصميم جذاب ; صور كبيرة ; تأثيرات وحركة ; وصول صعب للمنتج ; مسار غير واضح","🧭 التطبيق B :: تصميم أبسط ; عناصر أقل ; مسار واضح ; وصول أسرع للمنتج"]},"id":"a7s1"},{"type":"principle","title":"ماذا نعني ببنية التطبيق؟","points":["أين أنا؟","أين أذهب؟","ماذا أفعل الآن؟","وما الخطوة التالية؟"],"intro":"<p>بنية التطبيق هي الطريقة التي يتم بها تنظيم الصفحات، والأقسام، والقوائم، والمنتجات، والمعلومات، والانتقالات، والمسارات، ونقاط الوصول إلى الإجراءات، بحيث يستطيع المستخدم فهم:</p>","chart":{"kind":"flow","items":["الرئيسية","التصنيف","المنتج","السلة","الدفع*"]},"id":"a7s2"},{"type":"principle","title":"الشكل مقابل البنية","points":["الشكل: يركز على الألوان، والصور، والخطوط، والجماليات، والانطباع الأول.","البنية: تركز على التنظيم، وترتيب المعلومات، وسهولة الوصول، ووضوح المسار، والانتقال بين المراحل."],"intro":"<p>التفريق بين الطبقتين أساس أي تحليل:</p>","rule":"<p>الشكل يجذب الانتباه، والبنية تساعد المستخدم على الاستمرار.</p>","chart":{"kind":"compare","items":["🎨 الشكل :: الألوان ; الصور ; الخطوط ; الجماليات ; الانطباع الأول","🏗️ البنية :: التنظيم ; ترتيب المعلومات ; سهولة الوصول ; وضوح المسار ; الانتقال بين المراحل"]},"id":"a7s3"},{"type":"principle","title":"لماذا تؤثر البنية على التحويل؟","points":["تقليل عدد الخطوات.","تسهيل الوصول للمعلومة.","توضيح المسار.","تسريع القرار."],"intro":"<p>كلما ارتفع الجهد المطلوب من المستخدم ارتفع احتمال التشتت والتردد والانقطاع. والبنية الجيدة تساعد على:</p>","chart":{"kind":"compare","items":["✅ جهد منخفض :: قرار أسرع ; تشتت أقل","⚠️ جهد مرتفع :: تردد أكبر ; انقطاع محتمل"]},"id":"a7s4"},{"type":"examples","title":"المشكلة ليست دائمًا في المنتج","items":["المستخدم::يريد شراء سماعة، فدخل التطبيق وبحث عن «سماعة».","ما ظهر له::عروض، تصنيفات، منتجات مقترحة، إعلانات، كوبونات، منتجات مشابهة.","ما حدث::بدأ يبحث من جديد عن المنتج الذي كان يريد شراءه أصلًا.","السؤال::أين المشكلة: المنتج؟ المحتوى؟ البنية؟ التنقل؟","الفكرة::قد يكون المنتج جيدًا، لكن طريقة الوصول إليه تخلق احتكاكًا."],"id":"a7s5"},{"type":"mistakes","title":"المشاكل الشائعة في بنية التطبيقات","items":["صعوبة الوصول::اختصر الطريق إلى المنتجات والإجراءات الأساسية.","عدم وضوح الخطوة التالية::زر إجراء واحد واضح في كل شاشة.","كثرة الخيارات دون ترتيب::جمّع الخيارات ورتّبها حسب الأهمية.","عدم وضوح المسار::مؤشرات تبين للمستخدم أين هو وإلى أين يذهب.","تكرار الصفحات أو المعلومات::ادمج المتشابه واحذف المكرر."],"id":"a7s6"},{"type":"principle","title":"عندما توجد خيارات كثيرة","points":["الخيارات بحد ذاتها ليست مشكلة.","المشكلة في طريقة تنظيمها وترتيب أولوياتها."],"intro":"<p>أمام المستخدم في شاشة واحدة: 12 تصنيفًا، و8 فلاتر، و6 طرق للفرز، و4 عروض، و3 توصيات. هل زيادة الخيارات تعني تجربة أفضل؟</p>","rule":"<p>المشكلة ليست في وجود الخيارات، وإنما في طريقة تنظيمها.</p>","chart":{"kind":"bars","items":["تصنيفات::12","فلاتر::8","طرق فرز::6","عروض::4","توصيات::3"]},"id":"a7s7"},{"type":"principle","title":"كل خطوة إضافية تحتاج إلى سبب","points":["ماذا تضيف؟","هل يحتاجها المستخدم؟","هل يمكن دمجها؟","هل يمكن تقديمها في مرحلة أخرى؟","هل تؤخر القرار؟"],"intro":"<p>قبل إضافة أي خطوة في رحلة المستخدم نسأل:</p>","rule":"<p>هل تستحق هذه الخطوة أن تبقى؟</p>","id":"a7s8"},{"type":"principle","title":"البنية والجهد الذهني","points":["ماذا يرى؟","ماذا يعني؟","أين يضغط؟","ماذا سيحدث؟","هل هو في المكان الصحيح؟"],"intro":"<p>المستخدم لا يبذل جهدًا جسديًا فقط؛ هناك أيضًا جهد ذهني لفهم:</p>","rule":"<p>كلما زاد هذا الجهد، أصبحت الاستمرارية أكثر صعوبة.</p>","id":"a7s9"},{"type":"tools","title":"اختبار الثواني العشر للبنية","items":["الأداة::اعرض شاشة تطبيق لمدة 10 ثوانٍ فقط، ثم اسأل.","أين أنت؟::هل يعرف المستخدم موقعه داخل التطبيق؟","ماذا تستطيع أن تفعل؟::هل الإجراءات المتاحة واضحة؟","أين ستضغط لو أردت الشراء؟::هل مسار الشراء ظاهر؟","أين تجد السلة؟ وأين تعود للخلف؟::هل عناصر التنقل الأساسية واضحة؟","الهدف::قياس الوضوح، وليس جمال التصميم."],"id":"a7s10"},{"type":"principle","title":"من البنية إلى التحويل","points":["بنية واضحة ← تنقل أسهل.","تنقل أسهل ← جهد أقل.","جهد أقل ← قرار أسرع ← احتمال إتمام أعلى."],"intro":"<p>البنية الواضحة تطلق سلسلة إيجابية حتى الإتمام، أما البنية المربكة فتدفع المسار في الاتجاه الآخر.</p>","chart":{"kind":"vflow","items":["بنية واضحة","تنقل أسهل","جهد أقل","قرار أسرع","احتمال إتمام أعلى*"]},"id":"a7s11"},{"type":"summary","title":"حالة: جميل لكنه لا يبيع","text":"<p>تطبيق تجاري يتميز بتصميم جذاب جدًا، لكن البيانات تظهر انخفاضًا في معدل الإتمام، وتشتتًا داخل التطبيق، وصعوبة في الوصول إلى مرحلة الدفع. قبل اقتراح أي تغيير بصري: ما الذي يجب تحليله أولًا؟</p>","rule":"<p>الإجابة: تحليل بنية التطبيق ومسار المستخدم، وتحديد نقاط الضعف وتأثيرها على المستخدم.</p>","id":"a7s12"}],"exercises":[{"id":"a7e1","title":"جميل أم فعّال؟","icon":"💎","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ألوان متناسقة وصور احترافية كبيرة وحركة انتقال أنيقة بين الشاشات.","options":["جمال بصري","بنية جيدة","الاثنان","لا يمكن الحكم"],"answer":0},{"q":"تصميم بسيط، والوصول لأي منتج خلال خطوتين، وزر السلة ظاهر دائمًا.","options":["جمال بصري","بنية جيدة","الاثنان","لا يمكن الحكم"],"answer":1},{"q":"واجهة أنيقة جدًا، ومسار شراء واضح من الرئيسية حتى الدفع بلا تشتت.","options":["جمال بصري","بنية جيدة","الاثنان","لا يمكن الحكم"],"answer":2},{"q":"التطبيق حصل على تقييم 4.8 في المتجر.","options":["جمال بصري","بنية جيدة","الاثنان","لا يمكن الحكم"],"answer":3},{"q":"شعار مميز وخط عصري، لكن القوائم متداخلة والخيارات كثيرة.","options":["جمال بصري","بنية جيدة","الاثنان","لا يمكن الحكم"],"answer":0}],"scenario":"<p>خمسة أوصاف مختصرة لتطبيقات تجارية. حدد لكل وصف ما الذي يمكن الحكم عليه.</p>","principle":"الجمال البصري وحده لا يكفي للحكم على جودة البنية؛ مؤشرات البنية الجيدة هي وضوح الوصول والتنقل.","hint":"<p>ابحث عن كلمات تصف الوصول والمسار، لا الألوان والصور فقط.</p>","why":"يفصل عينك بين الانطباع البصري ومؤشرات البنية الفعلية.","model":"<p>1: جمال بصري. 2: بنية جيدة. 3: الاثنان. 4: لا يمكن الحكم. 5: جمال بصري.</p>","axis":"a7"},{"id":"a7e2","title":"أكمل الفراغات: البنية","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"البنية الجيدة تساعد على تقليل ___.","answer":"الجهد"},{"text":"وضوح المسار يساعد على تسريع ___.","answer":"القرار"},{"text":"كثرة الخيارات دون ترتيب قد تسبب ___.","answer":"التشتت"},{"text":"التصميم البصري يركز على ___.","answer":"الانطباع البصري"},{"text":"البنية تركز على ___.","answer":"التنظيم والمسار"},{"text":"كل خطوة إضافية يجب أن يكون لها ___.","answer":"سبب واضح"},{"text":"صعوبة الوصول قد تؤدي إلى ___.","answer":"الانسحاب"},{"text":"عدم وضوح المسار يزيد ___.","answer":"التردد"},{"text":"الهدف من تحليل البنية هو تحسين ___.","answer":"تجربة المستخدم والتحويل"},{"text":"المستخدم يحتاج إلى معرفة ___ التالية.","answer":"الخطوة"}],"principle":"البنية الجيدة تقلل الجهد وتوضح المسار وتسرّع القرار.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت الفرق بين الشكل والبنية بلغة المجموعة المشتركة.","model":"<p>الجهد، القرار، التشتت، الانطباع البصري، التنظيم والمسار، سبب واضح، الانسحاب، التردد، تجربة المستخدم والتحويل، الخطوة.</p>","axis":"a7"},{"id":"a7e3","title":"اختيار من متعدد: البنية","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي عنصر يرتبط مباشرة بالبنية؟","options":["لون الشعار","ترتيب الأقسام","نوع الخط فقط","الصورة الرئيسية"],"answer":1},{"q":"ما المشكلة الأساسية في كثرة الخيارات دون تنظيم؟","options":["زيادة الجمال","زيادة سرعة القرار","زيادة التشتت","تحسين الثقة"],"answer":2},{"q":"الهدف من تقليل الخطوات هو:","options":["حذف المحتوى","تقليل الجهد","تقليل المنتجات","تقليل الصور"],"answer":1},{"q":"البنية الجيدة تساعد المستخدم على:","options":["فهم المسار","زيادة عدد الإعلانات","مشاهدة المزيد من الصفحات","تغيير المنتج"],"answer":0},{"q":"التصميم الجذاب وحده:","options":["يضمن التحويل","لا يكفي للحكم على البنية","يلغي الحاجة للمحتوى","يلغي الحاجة للتنقل"],"answer":1}],"principle":"البنية تتعلق بترتيب الأقسام وفهم المسار وتقليل الجهد، لا بالألوان والصور.","hint":"<p>ميّز بين ما يخص الشكل وما يخص التنظيم.</p>","why":"يختبر الفهم النظري للبنية قبل الانتقال لتطبيقه على الحالات.","model":"<p>ب، ج، ب، أ، ب.</p>","axis":"a7"},{"id":"a7e4","title":"صح أم خطأ: البنية","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"البنية الجيدة تعني التصميم الجميل فقط.","answer":false},{"q":"وضوح المسار يقلل التردد.","answer":true},{"q":"كلما زادت الخيارات تحسنت التجربة بالضرورة.","answer":false},{"q":"تكرار المعلومات قد يربك المستخدم.","answer":true},{"q":"يمكن أن يكون التطبيق جذابًا بصريًا وبنيته ضعيفة.","answer":true},{"q":"تقليل الخطوات قد يرفع سهولة التنقل.","answer":true},{"q":"البنية لا علاقة لها بالتحويل.","answer":false},{"q":"يجب أن تكون الخطوة التالية واضحة.","answer":true},{"q":"كثرة الخيارات تحتاج إلى تنظيم.","answer":true},{"q":"جمال الواجهة يغني عن تحليل سلوك المستخدم.","answer":false}],"principle":"البنية والتحويل مرتبطان؛ والجمال لا يغني عن تحليل السلوك.","hint":"<p>انتبه للتعميمات مثل «فقط» و«بالضرورة».</p>","why":"يكشف المفاهيم الخاطئة حول العلاقة بين الشكل والبنية.","model":"<p>خطأ، صح، خطأ، صح، صح، صح، خطأ، صح، صح، خطأ.</p>","axis":"a7"},{"id":"a7e5","title":"أيهما أدق؟ التطبيق الجيد","icon":"⚖️","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"التطبيق الجيد هو التطبيق الجميل.","b":"التطبيق الجيد يحتاج إلى بنية تساعد المستخدم على الوصول واتخاذ القرار.","answer":"b"},{"a":"زيادة الأقسام والقوائم تعني خدمة أفضل.","b":"تنظيم الأقسام حسب أولوية المستخدم يعني خدمة أفضل.","answer":"b"},{"a":"الخطوة الإضافية تحتاج إلى سبب واضح قبل إضافتها.","b":"كل خطوة إضافية مقبولة ما دام التطبيق سريعًا.","answer":"a"}],"scenario":"<p>أزواج من العبارات حول ما يجعل التطبيق «جيدًا». اختاروا الأدق في كل زوج.</p>","principle":"التطبيق الجيد يحتاج إلى بنية تساعد المستخدم على الوصول واتخاذ القرار.","hint":"<p>الأدق هو ما يربط الجودة بقدرة المستخدم على الوصول والقرار.</p>","why":"يثبّت معيار «البنية» في الحكم على جودة التطبيق.","model":"<p>الأدق في كل زوج: (ب)، ثم (أ) في الزوج الثالث؛ لأنها تربط الجودة بالوصول والقرار لا بالشكل وحده.</p>","axis":"a7"},{"id":"a7e6","title":"غرفة تشخيص التطبيق","icon":"🏥","mode":"group","format":"text","steps":["فكّروا في المسار والوصول والوضوح والتنقل.","حددوا البيانات التي تحتاجونها.","اختاروا تغييرًا واحدًا ومؤشرًا لقياسه."],"scenario":"<p>«المستخدمون يصلون إلى صفحة المنتج بأعداد كبيرة، لكن نسبة كبيرة منهم لا تنتقل إلى السلة.»</p>","principle":"قبل أي تغيير، نحدد الاحتمالات المرتبطة بالبنية والبيانات التي تؤكدها أو تنفيها.","task":"<p>حددوا: 3 احتمالات مرتبطة بالبنية، والبيانات التي تريدون رؤيتها، وتغييرًا واحدًا مقترحًا، وما ستقيسونه بعد التغيير.</p>","why":"يطبّق التفكير البنيوي على مشكلة تحويل حقيقية.","model":"<p>لا توجد إجابة واحدة. مثال: زر الإضافة غير ظاهر دون تمرير؛ معلومات التوصيل في صفحة أخرى؛ خيارات المقاسات مربكة. البيانات: خرائط التمرير والنقر. التغيير: تثبيت زر الإضافة أسفل الشاشة. القياس: نسبة الانتقال من صفحة المنتج إلى السلة.</p>","axis":"a7"},{"id":"a7e7","title":"رتّب المسار","icon":"🗺️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما الترتيب المنطقي للمسار؟","options":["الرئيسية ← التصنيف ← اختيار المنتج ← صفحة المنتج ← السلة ← الدفع","الرئيسية ← السلة ← التصنيف ← صفحة المنتج ← اختيار المنتج ← الدفع","التصنيف ← الرئيسية ← صفحة المنتج ← اختيار المنتج ← الدفع ← السلة","الرئيسية ← صفحة المنتج ← التصنيف ← السلة ← اختيار المنتج ← الدفع"],"answer":0},{"q":"ما الخطوة التي تسبق «السلة» مباشرة؟","options":["التصنيف","صفحة المنتج","الرئيسية","الدفع"],"answer":1}],"scenario":"<p>بطاقات مبعثرة: الدفع، الرئيسية، اختيار المنتج، التصنيف، السلة، صفحة المنتج.</p>","principle":"المسار المنطقي ينقل المستخدم من العام إلى الخاص ثم إلى الإجراء.","hint":"<p>ابدأ من نقطة الدخول وانتهِ بالإجراء النهائي.</p>","why":"يبني صورة ذهنية للمسار الأساسي الذي تقاس عليه كل انحرافات البنية.","model":"<p>الرئيسية ← التصنيف ← اختيار المنتج ← صفحة المنتج ← السلة ← الدفع.</p>","axis":"a7"},{"id":"a7e8","title":"اكتشف الخطأ في المسار","icon":"🐞","mode":"individual","format":"text","steps":["امشِ في المسار خطوة خطوة كمستخدم جديد.","حدد الخطوات التي تطلب جهدًا قبل أن يرى المستخدم أي قيمة.","اقترح ترتيبًا بديلًا."],"scenario":"<p>المسار الحالي: الرئيسية ← عرض ← تسجيل حساب ← معلومات شخصية ← اختيار التصنيف ← المنتج ← السلة ← الدفع.</p>","principle":"الخطوة التي تسبق ظهور القيمة تطلب جهدًا قبل أن يقتنع المستخدم بدفعه.","task":"<p>اكتشف أكبر نقاط الاحتكاك في هذا المسار، واقترح ترتيبًا أفضل.</p>","why":"يدرّب على رصد الخطوات المبكرة في غير موضعها، وهي من أكثر أخطاء البنية شيوعًا.","model":"<p>التسجيل المبكر، وطلب معلومات شخصية قبل ظهور القيمة، وطول المسار. ترتيب أفضل: الرئيسية ← التصنيف ← المنتج ← السلة ← (تسجيل مختصر أو شراء كضيف) ← الدفع.</p>","axis":"a7"},{"id":"a7e9","title":"قرار سريع","icon":"⏱️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي تغيير يحتاج إلى فحص أولًا من زاوية تقليل الجهد؟","options":["إضافة صفحة جديدة للمعلومات","دمج خطوتين متشابهتين","إضافة ثلاثة خيارات جديدة"],"answer":1}],"scenario":"<p>فريق التطبيق يدرس ثلاثة تغييرات: (A) إضافة صفحة جديدة للمعلومات. (B) دمج خطوتين متشابهتين. (C) إضافة ثلاثة خيارات جديدة.</p>","principle":"دمج الخطوات المتشابهة من أوضح أساليب تقليل الجهد.","hint":"<p>أي تغيير يقلل عدد القرارات المطلوبة من المستخدم؟</p>","why":"يربط مبدأ «كل خطوة تحتاج إلى سبب» بقرار أولوية سريع.","model":"<p>B — دمج خطوتين متشابهتين هو التغيير المرتبط مباشرة بتقليل الجهد، ويحتاج إلى فحص أولًا.</p>","axis":"a7"},{"id":"a7e10","title":"تدقيق سريع لتطبيق تعرفه","icon":"🔬","mode":"individual","format":"text","steps":["افتح التطبيق وجرّب مسار شراء قصيرًا.","لاحظ أين كان الأمر سهلًا وأين تعثرت.","اكتب ملاحظاتك في خمس نقاط."],"scenario":"<p>اختر تطبيقًا تجاريًا تستخدمه فعلًا (متجر، توصيل، حجز...).</p>","principle":"التدقيق البنيوي يبدأ من ملاحظة الوصول والخطوات والمعلومات في تطبيق حقيقي.","task":"<p>اكتب: نقطة وصول سهلة، نقطة وصول صعبة، خطوة يمكن حذفها، خطوة يمكن دمجها، معلومة يصعب العثور عليها.</p>","why":"ينقل المفاهيم من القاعة إلى تجربتك اليومية كمستخدم.","model":"<p>المخرج: خريطة أولية لمشكلات البنية. مثال: وصول سهل: البحث في الأعلى. وصول صعب: سياسة الإرجاع. خطوة للحذف: تأكيد البريد قبل التصفح. خطوة للدمج: الشحن والعنوان. معلومة صعبة: رسوم التوصيل.</p>","axis":"a7"}],"highlights":["الشكل مقابل البنية","المشكلات الشائعة في بنية التطبيقات","كل خطوة إضافية تحتاج إلى سبب","البنية والجهد الذهني"],"unit":3,"icon":"layers","color":6,"scene":"architecture","title":"الجميل ليس دائمًا سهلًا","classic":"فهم بنية التطبيق وتأثيرها على تجربة المستخدم والتحويل","duration":"90 دقيقة","desc":"<p>تصميم التطبيق لا يُقاس بالشكل الجمالي فقط، بل بقدرة بنيته على مساعدة المستخدم في الوصول للمعلومة واتخاذ القرار والانتقال للخطوة التالية. الشكل يجذب الانتباه، والبنية تساعد على الاستمرار.</p>"},{"id":"a8","slides":[{"type":"opening","title":"هل كثرة المعلومات تساعد المستخدم؟","text":"<p>صفحة منتج تحتوي على: 20 سطرًا، و15 خاصية، و8 صور، و6 شارات، و4 ؟","هل يُرجع؟","هل أثق به؟","ماذا أفعل الآن؟"]},"id":"a8s11"},{"type":"tools","title":"اختبار حذف المحتوى","items":["الأداة::خذ صفحة منتج، واسأل عن كل عنصر.","السؤال::لو حذفناه، هل سيتأثر قرار المستخدم؟","إذا كانت الإجابة «لا»::العنصر يحتاج إلى إعادة تقييم (حذف أو نقل لمستوى ثانوي).","إذا كانت «نعم»::العنصر يبقى، ونسأل: هل موضعه مناسب لمرحلة القرار؟"],"id":"a8s12"},{"type":"summary","title":"من المعلومات إلى القرار","text":"<p>تطبيق يبيع الأجهزة الإلكترونية، وصفحة المنتج تحتوي على معلومات كثيرة جدًا، لكن المستخدمين يرسلون أسئلة متكررة: كم مدة الشحن؟ هل يوجد ضمان؟ هل السعر شامل الضريبة؟ هل يمكن الإرجاع؟ المعلومات قد تكون موجودة، لكنها غير منظمة أو غير ظاهرة في اللحظة المناسبة.</p>","rule":"<p>معلومة واضحة ← فهم ← مقارنة ← ثقة ← قرار.</p>","chart":{"kind":"flow","items":["معلومة واضحة","فهم","مقارنة","ثقة","قرار*"]},"id":"a8s13"}],"exercises":[{"id":"a8e1","title":"ماذا يحتاج المستخدم أولًا؟","icon":"🥇","mode":"individual","format":"mcq","steps":[],"items":[{"q":"السعر النهائي","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":0},{"q":"الفائدة الأساسية (عزل الضوضاء لساعات طويلة)","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":0},{"q":"موعد التوصيل","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":0},{"q":"تقييمات المستخدمين","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":1},{"q":"المواصفات الأساسية (عمر البطارية، الاتصال)","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":1},{"q":"سياسة الإرجاع","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":1},{"q":"الضمان","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":1},{"q":"تاريخ إطلاق الطراز","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":2},{"q":"أبعاد العلبة","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":2},{"q":"قصة العلامة التجارية","options":["ضرورية للقرار","داعمة","ثانوية"],"answer":2}],"scenario":"<p>عشر معلومات لسماعة لاسلكية في صفحة المنتج. صنّف كل معلومة حسب طبقة الأولوية.</p>","principle":"الأولوية ثلاث طبقات: ضرورية للقرار، داعمة للتحقق، ثانوية يُرجع إليها عند
