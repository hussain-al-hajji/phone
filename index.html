رجة؟","options":["إضافة المنتج للسلة","بدء الدفع","إدخال البيانات","جميع ما سبق"],"answer":3},{"q":"بعد الدفع من المفيد إظهار:","options":["لا شيء","تأكيد واضح وما سيحدث لاحقًا","إعلان فقط","صفحة رئيسية جديدة"],"answer":1}],"principle":"المفاجأة تهدم الثقة، والتحكم يعني فهم الخطوات والنتيجة، وما بعد الدفع جزء من التجربة.","hint":"<p>فكّر في ما يطمئن المستخدم في آخر لحظة.</p>","why":"يختبر مفاهيم المرحلة النهائية.","model":"<p>ب، ب، د، ب.</p>","axis":"a12"},{"id":"a12e4","title":"صح أم خطأ: الإتمام","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"المرحلة النهائية أقل حساسية من المراحل السابقة.","answer":false},{"q":"التكلفة غير المتوقعة قد تسبب الانسحاب.","answer":true},{"q":"تقليل المفاجآت يساعد على بناء الثقة.","answer":true},{"q":"يجب أن يعرف المستخدم ما سيحدث بعد الدفع.","answer":true},{"q":"كل خطوات الرحلة لها التأثير نفسه.","answer":false},{"q":"بطء التنفيذ قد يؤثر على الإتمام.","answer":true},{"q":"زيادة الخطوات دائمًا تحسن التجربة.","answer":false},{"q":"الشعور بالتحكم مهم في المرحلة النهائية.","answer":true},{"q":"لا حاجة لقياس أثر التحسين.","answer":false},{"q":"قد يكون تحسين لحظة واحدة أهم من تعديل تفاصيل كثيرة منخفضة التأثير.","answer":true}],"principle":"التحسين يستهدف اللحظات الأعلى تأثيرًا، ولا يكتمل دون قياس.","hint":"<p>ليس كل الخطوات متساوية في التأثير.</p>","why":"يراجع مفاهيم المحور بسرعة.","model":"<p>خطأ، صح، صح، صح، خطأ، صح، خطأ، صح، خطأ، صح.</p>","axis":"a12"},{"id":"a12e5","title":"اختر التفسير الأدق","icon":"🎯","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي تفسير أدق؟","options":["المستخدم لم يعد مهتمًا بالمنتج بالضرورة.","ظهور تكلفة غير متوقعة قد يؤثر على الثقة والقرار.","المشكلة بالتأكيد في السعر الأصلي.","المشكلة بالتأكيد في طريقة الدفع."],"answer":1}],"scenario":"<p>المستخدم وصل إلى الدفع، ثم ظهرت تكلفة إضافية لم تكن واضحة، فانسحب.</p>","principle":"التفسير الأدق يربط الانسحاب بالمفاجأة وأثرها على الثقة، دون جزم غير مدعوم.","hint":"<p>احذر التفسيرات التي تستخدم «بالتأكيد».</p>","why":"يدرّب على اختيار التفسير الحذر المرتبط بالسلوك.","model":"<p>(ب) ظهور تكلفة غير متوقعة قد يؤثر على الثقة والقرار.</p>","axis":"a12"},{"id":"a12e6","title":"غرفة إنقاذ الإتمام","icon":"🚑","mode":"group","format":"text","steps":["اختاروا أكبر 3 أسباب محتملة.","حددوا أهم تغييرين.","اختاروا مؤشرًا رئيسيًا ومؤشرًا مساعدًا."],"scenario":"<p>30% من المستخدمين ينسحبون في آخر خطوة.</p>","principle":"خطة التدخل القصيرة تحدد الأسباب والتغييرات والمؤشرات في صفحة واحدة.","task":"<p>اكتبوا خطة تدخل قصيرة: 3 أسباب محتملة، تغييران، مؤشر رئيسي، مؤشر مساعد.</p>","why":"يدرّب على صياغة خطة مركّزة قابلة للتنفيذ.","model":"<p>مثال: الأسباب: رسوم مفاجئة، تسجيل إجباري، بطء التأكيد. التغييران: إجمالي شامل في السلة، الشراء كضيف. المؤشر الرئيسي: معدل الإتمام. المساعد: زمن الإتمام.</p>","axis":"a12"},{"id":"a12e7","title":"رتّب الأولويات","icon":"📌","mode":"group","format":"text","steps":["اقرؤوا الحالة والشكاوى.","اختاروا 3 تغييرات للتحليل أولًا.","برروا الاختيار."],"scenario":"<p>أمام الفريق 6 تغييرات: تحسين لون الزر، توضيح السعر النهائي، تقليل خطوة، تحسين سرعة الصفحة، إضافة صورة، توضيح ما بعد الدفع. والحالة: انسحاب في آخر خطوة مع شكاوى من التكلفة والبطء.</p>","principle":"الأولوية ترتبط بالمشكلات الموجودة في الحالة، وليس بجمال التغيير.","task":"<p>اكتبوا التغييرات الثلاثة التي ستبدؤون بها مع تبرير كل منها.</p>","why":"يدرّب على ترتيب الأولويات حسب الأثر المتوقع لا حسب سهولة التنفيذ أو المظهر.","model":"<p>توضيح السعر النهائي (مرتبط بشكاوى التكلفة)، تحسين سرعة الصفحة (مرتبط بالبطء)، توضيح ما بعد الدفع (يدعم الثقة). لون الزر والصورة أولوية منخفضة.</p>","axis":"a12"},{"id":"a12e8","title":"أصلح المفاجأة","icon":"🔧","mode":"individual","format":"text","steps":["حدد مكونات الفرق المحتملة.","حدد المكان المناسب لإظهارها.","صِف التجربة بعد الإصلاح."],"scenario":"<p>المنتج 180 ريال، وعند الدفع يظهر 215 ريال.</p>","principle":"الإجمالي ومكوناته يجب أن يظهرا بوضوح قبل اللحظة النهائية.","task":"<p>اكتب: أين يجب توضيح التكلفة؟ ماذا يجب أن يرى المستخدم؟ ما الذي يجب أن يتغير في التجربة؟</p>","why":"يحوّل مبدأ تقليل المفاجآت إلى إصلاح محدد.","model":"<p>إظهار التكلفة الإجمالية والرسوم بوضوح قبل اللحظة النهائية (في صفحة المنتج تقديرًا، وفي السلة تفصيلًا)، مع توضيح مكونات السعر: 180 + توصيل + ضريبة = 215.</p>","axis":"a12"},{"id":"a12e9","title":"صمّم شاشة ما بعد الدفع","icon":"📬","mode":"group","format":"text","steps":["اكتبوا محتوى الشاشة بالكامل.","تأكدوا من العناصر الخمسة الإلزامية.","راجعوا النبرة: مطمئنة وواضحة."],"scenario":"<p>الفريق يعيد تصميم شاشة التأكيد التي تظهر حاليًا كلمة «تم» فقط.</p>","principle":"شاشة التأكيد تغلق الحلقة: نتيجة، رقم، حالة، موعد، خطوة تالية.","task":"<p>صمّموا محتوى شاشة التأكيد متضمنًا على الأقل: تأكيد العملية، رقم الطلب، الحالة، الموعد المتوقع، الخطوة التالية.</p>","why":"التقييم من 5: وضوح النتيجة، المعلومات، الطمأنينة، الخطوة التالية، سهولة الفهم.","model":"<p>«✅ تم تأكيد طلبك بنجاح. رقم الطلب: #45821. الحالة: قيد التجهيز. التوصيل المتوقع: الثلاثاء. ستصلك رسالة عند الشحن، ويمكنك تتبع الطلب من (طلباتي).»</p>","axis":"a12"},{"id":"a12e10","title":"مشروع الوحدة: خطة تحسين الدفع","icon":"🏁","mode":"group","format":"text","steps":["اعملوا بالترتيب على العناصر السبعة.","اربطوا كل عنصر بالحالة المعطاة.","جهزوا عرضًا مختصرًا."],"scenario":"<p>تطبيق تجارة إلكترونية لديه زيارات جيدة، وتفاعل جيد مع المنتجات، وإضافة جيدة للسلة، لكن الإتمام منخفض، مع شكاوى من تعقيد الدفع وعدم وضوح التكلفة النهائية.</p>","principle":"التحسين المتكامل للدفع: تشخيص ← أسباب ← تجربة ← ثقة ← مفاجآت ← ما بعد الدفع ← قياس.","task":"<p>ابنوا خطة تحسين تتضمن: (1) التشخيص (2) الأسباب المحتملة (3) تحسين التجربة (4) تحسين الثقة (5) تقليل المفاجآت (6) ما بعد الدفع (7) القياس.</p>","why":"المشروع الختامي للوحدة الرابعة: تحليل ← تشخيص ← تحسين ← اختبار ← قياس.","model":"<p>مثال مختصر: التشخيص: الفقد بين بدء الدفع والإتمام. الأسباب: خطوات كثيرة، رسوم غير واضحة. التجربة: دفع في شاشتين. الثقة: إشارات أمان قرب البطاقة. المفاجآت: إجمالي شامل في السلة. ما بعد الدفع: تأكيد برقم وموعد. القياس: معدل الإتمام وزمنه.</p>","axis":"a12"}],"highlights":["طبيعة المرحلة النهائية","مبدأ تقليل المفاجآت","اللحظات الحرجة الأعلى تأثيرًا","شاشة التأكيد وما بعد الدفع"],"unit":4,"icon":"check","color":11,"scene":"complete","title":"آخر عشر ثوانٍ","classic":"تحسين الإتمام وتقليل الانسحاب في المرحلة النهائية من الشراء","duration":"120 دقيقة","desc":"<p>المرحلة النهائية نقطة اتخاذ القرار؛ فيها ترتفع الحساسية ويقل التحمل للأخطاء. نتعلم هنا أسباب الانسحاب في اللحظة الأخيرة، وتقليل المفاجآت، وتعزيز التحكم، وتصميم ما بعد الدفع، وقياس الإتمام.</p>"},{"id":"a13","slides":[{"type":"opening","title":"ماذا تقول لنا أرقام التطبيق؟","text":"<p>قد يكون لدى التطبيق آلاف المستخدمين، وعدد كبير من الزيارات، ومنتجات كثيرة، وعمليات تصفح مستمرة — ومع ذلك يكون هناك خلل في الأداء التجاري. السؤال الحقيقي: هل نعرف ماذا يحدث داخل التطبيق؟</p>","rule":"<p>لو كان لديك رقم واحد فقط لتقييم أداء تطبيق تجارة إلكترونية، ماذا تختار؟</p>","chart":{"kind":"funnel","items":["مستخدمون::10000","زيارة منتج::4200","إضافة للسلة::1100","بدأوا الدفع::620","عملية مكتملة::380"]},"id":"a13s1"},{"type":"principle","title":"البيانات ليست القرار","points":["أين حدث الانخفاض؟","متى بدأ؟","مع أي نوع من المستخدمين؟","في أي مرحلة؟","ما الذي تغيّر في تلك الفترة؟"],"intro":"<p>البيانات قد تخبرنا كم مستخدمًا دخل، وشاهد المنتج، وأضاف للسلة، وبدأ الدفع، وأكمل. لكن القرار يحتاج إلى سؤال أعمق: ماذا تعني هذه الأرقام؟ فإذا انخفض الإتمام من 70% إلى 55% — فهذا رقم، والإدارة تحتاج إلى معرفة:</p>","chart":{"kind":"compare","items":["🔢 البيانات :: أرقام ; نسب ; زيارات ; عمليات","💡 المعلومة :: تفسير ; نمط ; مشكلة ; فرصة"]},"id":"a13s2"},{"type":"principle","title":"الفرق بين البيانات والمعلومة","points":["20,000 زيارة: الزيارات ارتفعت.","3,000 إضافة للسلة: نسبة الإضافة منخفضة مقارنة بالزيارات.","800 بدأوا الدفع: هناك تسرب قبل الدفع.","400 عملية مكتملة: نصف من بدأوا الدفع لم يكملوا."],"intro":"<p>الرقم يصبح مفيدًا عندما يساعد على فهم ما يحدث واتخاذ قرار؛ أي عندما يتحول من رقم إلى معنى إلى قرار.</p>","chart":{"kind":"table","items":["البيانات ; المعلومة","20,000 زيارة ; الزيارات ارتفعت","3,000 إضافة للسلة ; نسبة الإضافة منخفضة مقارنة بالزيارات","800 بدأوا الدفع ; هناك تسرب قبل الدفع","400 عملية مكتملة ; نصف من بدأوا الدفع لم يكملوا"]},"id":"a13s3"},{"type":"principle","title":"لماذا كثرة البيانات لا تعني وضوحًا أكبر؟","points":["كثرة المؤشرات قد تشتت الانتباه.","المؤشر المفيد هو المرتبط بالقرار الحالي."],"intro":"<p>قد تمتلك المؤسسة عشرات المؤشرات: المستخدمين، الجلسات، المشاهدات، النقرات، الإضافات للسلة، بدء الدفع، الإتمام، الانسحاب، متوسط قيمة الطلب، تكرار الشراء. لكن وجود البيانات وحده لا يجيب عن السؤال.</p>","rule":"<p>السؤال الإداري الأهم: ما المؤشرات التي نحتاجها الآن لاتخاذ القرار الذي أمامنا؟</p>","id":"a13s4"},{"type":"tools","title":"أنواع البيانات داخل التطبيق","items":["بيانات التفاعل::النقر، التمرير، المشاهدة، البحث، التفاعل مع العناصر.","بيانات التنقل::الصفحة التي دخل منها المستخدم، الصفحة التالية، نقاط التوقف، مسار الانتقال.","بيانات الشراء::الإضافة للسلة، بدء الدفع، الإتمام، قيمة الطلب.","بيانات الانسحاب::أين خرج المستخدم؟ في أي مرحلة؟ بعد أي إجراء؟"],"id":"a13s5"},{"type":"principle","title":"البيانات داخل رحلة المستخدم","points":["ماذا فعل المستخدم؟","كم عدد المستخدمين الذين انتقلوا؟","كم عدد الذين توقفوا؟","ما النسبة التي أكملت؟"],"intro":"<p>بدلًا من قراءة المؤشرات منفصلة، نربطها بالرحلة: اكتشاف ← استكشاف ← تقييم ← إجراء ← إتمام. وفي كل مرحلة نطرح:</p>","chart":{"kind":"steps","items":["اكتشاف::الداخلون","استكشاف::المنتقلون","تقييم::نسبة الانتقال","إجراء::المتوقفون","إتمام::نسبة الإكمال"]},"id":"a13s6"},{"type":"principle","title":"لا تقرأ الرقم وحده","points":["مقارنة بماذا؟","خلال أي فترة؟","لأي مستخدمين؟","في أي مرحلة؟","ماذا تغيّر؟","ما السلوك الذي يعكسه الرقم؟"],"intro":"<p>عند ظهور أي رقم غير طبيعي (مثل: التحويل = 4.2%)، اسأل ستة أسئلة:</p>","rule":"<p>انخفاض التحويل قد يكون عامًا، أو مرتبطًا بصفحة محددة، أو بنوع جهاز، أو بمصدر دخول، أو بفئة مستخدمين.</p>","chart":{"kind":"hub","items":["التحويل = 4.2%","مقارنة بماذا؟","خلال أي فترة؟","لأي مستخدمين؟","في أي مرحلة؟","ماذا تغيّر؟","أي سلوك يعكسه؟"]},"id":"a13s7"},{"type":"examples","title":"من الرقم إلى السلوك","items":["الملاحظة::انخفاض نسبة الإتمام.","السلوك::عدد كبير من المستخدمين يصل إلى الدفع ثم يغادر.","السؤال::ما الذي يحدث في تلك المرحلة؟","القرار المحتمل::تحليل تجربة الدفع قبل إجراء تغييرات عامة في التطبيق.","الرسالة::الهدف من تحليل البيانات هو الاقتراب من سلوك المستخدم الحقيقي."],"id":"a13s8"},{"type":"principle","title":"مؤشرات الأداء لا تعمل منفردة","points":["الزيارات: ارتفاع.","الإضافة للسلة: ثبات.","الإتمام: انخفاض."],"intro":"<p>ارتفعت الزيارات بنسبة 30%. هل هذا جيد؟ لا يمكن الإجابة من هذا الرقم وحده؛ فإذا ارتفعت الزيارات 30% بينما انخفض الإتمام 20%، فالصورة تحتاج إلى قراءة مختلفة.</p>","rule":"<p>هل انعكس النمو في الزيارات على النتيجة التجارية؟</p>","chart":{"kind":"bars","items":["الزيارات::30","الإضافة للسلة::0","الإتمام::-20"]},"id":"a13s9"},{"type":"principle","title":"مثال تطبيقي: أي مرحلة تستحق التحقيق؟","points":["الانتقال من بدء الدفع إلى الإتمام يحتاج إلى تحليل.","لأن هناك فرقًا واضحًا بين من بدأوا الدفع ومن أكملوا العملية."],"intro":"<p>تطبيق تجارة إلكترونية سجّل خلال شهر: 50,000 زيارة، و12,000 زيارة لصفحات المنتجات، و5,000 إضافة للسلة، و3,000 بدأوا الدفع، و1,800 عملية مكتملة.</p>","chart":{"kind":"funnel","items":["زيارات::50000","صفحات المنتجات::12000","إضافة للسلة::5000","بدأوا الدفع::3000","مكتملة::1800"]},"id":"a13s10"},{"type":"principle","title":"ماذا نريد أن نعرف من البيانات؟","points":["ماذا حدث؟","أين حدث؟","متى حدث؟","ما السلوك المرتبط به؟"],"intro":"<p>البيانات الجيدة تساعد على الإجابة عن أربعة أسئلة، ثم ننتقل إلى السؤال الأصعب:</p>","rule":"<p>ثم السؤال الأصعب: لماذا حدث؟</p>","chart":{"kind":"flow","items":["ماذا؟","أين؟","متى؟","أي سلوك؟","لماذا؟*"]},"id":"a13s11"},{"type":"summary","title":"من التحليل إلى القرار","text":"<p>التسلسل الصحيح: بيانات ← ملاحظة ← تحديد مشكلة ← تفسير ← قرار. مثال: ارتفاع الانسحاب ← يحدث في خطوة محددة ← الخطوة تتطلب بيانات كثيرة ← قد يكون التعقيد سببًا محتملًا ← اختبار تبسيط الخطوة.</p>","rule":"<p>البيانات تساعد على بناء القرار، لكنها ليست القرار.</p>","chart":{"kind":"vflow","items":["بيانات","ملاحظة","تحديد مشكلة","تفسير","قرار*"]},"id":"a13s12"}],"exercises":[{"id":"a13e1","title":"ماذا تقول الأرقام؟","icon":"🔢","mode":"individual","format":"text","steps":["احسب نسب الانتقال بين المراحل.","اكتب ما تلاحظه دون تفسير.","حوّل كل ملاحظة إلى سؤال."],"scenario":"<p>تطبيق لديه: 20,000 زيارة، و8,000 مشاهدة منتج، و2,000 إضافة للسلة، و1,000 بدأوا الدفع، و450 عملية مكتملة.</p>","principle":"الرقم الإجمالي لا يكفي لمعرفة السبب؛ الملاحظات تقود إلى أسئلة قبل القرار.","chart":{"kind":"funnel","items":["زيارات::20000","مشاهدة منتج::8000","إضافة للسلة::2000","بدأوا الدفع::1000","مكتملة::450"]},"task":"<p>اكتب ثلاث ملاحظات يمكن استخلاصها من الأرقام، وثلاثة أسئلة تحتاج إلى إجابة قبل اتخاذ قرار.</p>","why":"يدرّب على الفصل بين الملاحظة والسؤال والقرار.","model":"<p>ملاحظات: انخفاض الانتقال من مشاهدة المنتج إلى الإضافة للسلة (25%)، وانخفاض بين بدء الدفع والإتمام (45%)، والرقم الإجمالي لا يكفي لمعرفة السبب. أسئلة: لماذا لا يضيف عدد أكبر المنتج؟ أين ينسحبون أثناء الدفع؟ هل المشكلة عامة أم مرتبطة بفئة معينة؟</p>","axis":"a13"},{"id":"a13e2","title":"أكمل الفراغ: لغة البيانات","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"البيانات هي ___ ومؤشرات يتم جمعها.","answer":"أرقام"},{"text":"المعلومة تساعد على ___ البيانات.","answer":"فهم"},{"text":"تحليل البيانات يجب أن يرتبط بسلوك ___.","answer":"المستخدم"},{"text":"ارتفاع الزيارات لا يعني بالضرورة ارتفاع ___.","answer":"الإتمام"},{"text":"رحلة المستخدم يمكن تقسيمها إلى عدة ___.","answer":"مراحل"},{"text":"الانسحاب في مرحلة محددة قد يشير إلى وجود ___.","answer":"احتكاك"},{"text":"الرقم المنفرد يحتاج إلى ___ حتى يصبح قابلًا للتفسير.","answer":"سياق"},{"text":"الهدف من التحليل هو دعم عملية ___.","answer":"اتخاذ القرار"},{"text":"يجب ربط البيانات بما يفعله ___ داخل التطبيق.","answer":"العميل"},{"text":"من الأسئلة الأساسية: ماذا حدث، وأين حدث، و___ حدث؟","answer":"متى"}],"principle":"البيانات أرقام، والمعلومة فهم لها، والتحليل يخدم القرار عبر السياق والسلوك.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفردات التحليل الأساسية لدى المجموعة.","model":"<p>أرقام، فهم، المستخدم، الإتمام، مراحل، احتكاك، سياق، اتخاذ القرار، العميل، متى.</p>","axis":"a13"},{"id":"a13e3","title":"اختيار من متعدد: البيانات","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما الفرق الأساسي بين البيانات والمعلومة؟","options":["البيانات أكثر دقة دائمًا","المعلومة تفسر ما تعنيه البيانات","المعلومة عبارة عن أرقام","لا يوجد فرق"],"answer":1},{"q":"ارتفاع عدد الزيارات يعني:","options":["ارتفاع المبيعات حتمًا","ارتفاع التحويل حتمًا","ارتفاع الزيارات فقط","نجاح التطبيق"],"answer":2},{"q":"عند انخفاض الإتمام، أول ما نحتاجه:","options":["تغيير التطبيق بالكامل","معرفة أين يحدث الانخفاض","زيادة الإعلانات","حذف المنتجات"],"answer":1},{"q":"أفضل قراءة للمؤشر تكون:","options":["منفردة","في سياق الرحلة","دون مقارنة","دون فترة زمنية"],"answer":1},{"q":"بيانات الانسحاب تساعد على:","options":["معرفة نقاط التوقف","تصميم الشعار","اختيار الألوان","كتابة الإعلانات"],"answer":0},{"q":"المؤشر المفيد للقرار يجب أن يكون:","options":["كثيرًا","مرتبطًا بالسؤال","معقدًا","جديدًا دائمًا"],"answer":1},{"q":"قراءة السلوك تعني التركيز على:","options":["ما يقوله المستخدم فقط","ما يفعله المستخدم داخل التطبيق","آراء الإدارة فقط","عدد المنتجات"],"answer":1},{"q":"عند وجود آلاف البيانات، الخطوة الأولى:","options":["تحليلها كلها","تحديد سؤال القرار","حذفها","تغيير النظام"],"answer":1},{"q":"انخفاض الإتمام في مرحلة محددة قد يشير إلى:","options":["نقطة تحتاج إلى التحقيق","نجاح كامل","زيادة الطلب","عدم أهمية البيانات"],"answer":0},{"q":"الهدف النهائي من تحليل البيانات:","options":["جمع أرقام أكثر","اتخاذ قرارات أفضل","زيادة التقارير","زيادة عدد الرسوم"],"answer":1}],"principle":"المعلومة تفسر البيانات، والمؤشر المفيد مرتبط بسؤال القرار، والتحليل يبدأ بمعرفة أين يحدث الانخفاض.","hint":"<p>ابحث عن الإجابة التي تربط الرقم بسياق وقرار.</p>","why":"يختبر أساسيات قراءة البيانات بعشرة أسئلة.","model":"<p>ب، ج، ب، ب، أ، ب، ب، ب، أ، ب.</p>","axis":"a13"},{"id":"a13e4","title":"صح أم خطأ: البيانات","icon":"✅","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"كثرة البيانات تعني بالضرورة وضوحًا أكبر.","answer":false},{"q":"يجب قراءة البيانات في سياق رحلة المستخدم.","answer":true},{"q":"ارتفاع الزيارات يعني حتمًا ارتفاع المبيعات.","answer":false},{"q":"الانسحاب مؤشر يمكن تحليله.","answer":true},{"q":"الرقم لا يحتاج إلى سياق لتفسيره.","answer":false},{"q":"البيانات يمكن أن تساعد في تحديد نقاط الاحتكاك.","answer":true},{"q":"كل المؤشرات لها الأهمية نفسها في كل قرار.","answer":false},{"q":"من المهم معرفة متى حدث التغيّر.","answer":true},{"q":"الهدف من التحليل هو جمع أكبر عدد ممكن من الأرقام.","answer":false},{"q":"البيانات تصبح أكثر قيمة عندما تساعد في اتخاذ قرار.","answer":true}],"principle":"البيانات تكتسب قيمتها من السياق ومن ارتباطها بالقرار.","hint":"<p>الأرقام بلا سياق مضللة غالبًا.</p>","why":"يراجع مبادئ قراءة البيانات بسرعة.","model":"<p>خطأ، صح، خطأ، صح، خطأ، صح، خطأ، صح، خطأ، صح.</p>","axis":"a13"},{"id":"a13e5","title":"أيهما أدق؟ قراءة البيانات","icon":"⚖️","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"ارتفعت الزيارات، إذن التطبيق ناجح.","b":"ارتفعت الزيارات، ونحتاج لمعرفة أثر ذلك على بقية الرحلة.","answer":"b"},{"a":"انخفض التحويل، إذن المنتج ضعيف.","b":"انخفض التحويل، ونحتاج لتحديد المرحلة التي حدث فيها الانخفاض.","answer":"b"},{"a":"البيانات هي القرار.","b":"البيانات تساعد على بناء القرار.","answer":"b"},{"a":"كل رقم مهم.","b":"أهمية الرقم تعتمد على السؤال والسياق.","answer":"b"},{"a":"عدد المستخدمين يكفي لتقييم التطبيق.","b":"نحتاج إلى قراءة سلوك المستخدم داخل الرحلة.","answer":"b"},{"a":"الانسحاب مشكلة في كل الحالات.","b":"الانسحاب إشارة تحتاج إلى تفسير.","answer":"b"},{"a":"تحليل البيانات ينتهي عند معرفة ماذا حدث.","b":"التحليل الجيد يمهد لفهم السبب واتخاذ قرار.","answer":"b"},{"a":"زيادة المؤشرات تحسن القرار.","b":"المؤشرات المناسبة تحسن القرار.","answer":"b"},{"a":"نبدأ بالتغيير قبل التحليل.","b":"نحلل المشكلة قبل اختيار التغيير.","answer":"b"},{"a":"البيانات منفصلة عن تجربة المستخدم.","b":"البيانات تعكس أجزاء من تجربة المستخدم.","answer":"b"}],"scenario":"<p>عشرة أزواج من العبارات حول قراءة البيانات. اختاروا العبارة الأدق في كل زوج.</p>","principle":"البيانات تساعد على بناء القرار، وأهمية الرقم تعتمد على السؤال والسياق.","hint":"<p>الأدق هو ما يدعو إلى التحليل لا إلى الاستنتاج الفوري.</p>","why":"يصحح أنماط الاستنتاج المتسرع من الأرقام.","model":"<p>(ب) في كل الأزواج؛ لأنها تربط الرقم بالسياق وبسلوك المستخدم وبخطوة التحليل التالية.</p>","axis":"a13"},{"id":"a13e6","title":"صنّف البيانات","icon":"🗂️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"مشاهدة المنتج","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":0},{"q":"الإضافة للسلة","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":2},{"q":"الخروج من صفحة الدفع","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":3},{"q":"الانتقال من الصفحة الرئيسية للمنتجات","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":1},{"q":"النقر على صورة المنتج","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":0},{"q":"بدء الدفع","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":2},{"q":"التوقف في صفحة المنتج","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":3},{"q":"البحث عن منتج","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":0},{"q":"الانتقال للسلة","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":1},{"q":"إتمام الطلب","options":["تفاعل","تنقل","شراء","انسحاب"],"answer":2}],"scenario":"<p>عشرة مؤشرات من لوحة تحليلات تطبيق تجاري. صنّف كل مؤشر إلى أحد الأنواع الأربعة.</p>","principle":"أنواع البيانات الأربعة: تفاعل، تنقل، شراء، انسحاب — ولكل نوع سؤال يجيب عنه.","hint":"<p>اسأل: هل المؤشر يصف تفاعلًا مع عنصر، أم انتقالًا، أم شراءً، أم خروجًا؟</p>","why":"يجعل تصنيف البيانات عادة سريعة عند قراءة أي لوحة تحليلات.","model":"<p>تفاعل، شراء، انسحاب، تنقل، تفاعل، شراء، انسحاب، تفاعل، تنقل، شراء.</p>","axis":"a13"},{"id":"a13e7","title":"اكتشف السؤال الناقص","icon":"❓","mode":"group","format":"text","steps":["لا تقترحوا أي حل.","اكتبوا أسئلة تحدد: أين، متى، من، ماذا تغيّر.","رتّبوها حسب الأولوية."],"scenario":"<p>يعرض مدير التطبيق في الاجتماع: «التحويل انخفض هذا الشهر».</p>","principle":"قبل الحل نحتاج أسئلة تحدد المكان والزمن والشريحة والتغيّر.","task":"<p>اكتبوا 5 أسئلة يجب طرحها قبل اقتراح أي حل.</p>","why":"يبني عادة «السؤال قبل الحل» في مواجهة التقارير الإدارية المختصرة.","model":"<p>أين حدث الانخفاض؟ متى بدأ؟ هل يشمل جميع المستخدمين؟ هل حدث تغيير في التطبيق؟ هل يرتبط بجهاز أو قناة أو مرحلة معينة؟</p>","axis":"a13"},{"id":"a13e8","title":"اقرأ الـFunnel","icon":"🔻","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أي انتقال يحتاج إلى تحقيق أولًا؟","options":["من 10,000 إلى 6,000","من 6,000 إلى 3,000","من 3,000 إلى 2,500","من 2,500 إلى 900"],"answer":3},{"q":"لماذا؟","options":["لأنه أكبر فرق مطلق","لأنه أدنى نسبة انتقال بين مرحلتين (36%)","لأنه أول مرحلة","لأن الأرقام فيه أصغر"],"answer":1}],"scenario":"<p>قمع تحويل لتطبيق تجاري: 10,000 ← 6,000 ← 3,000 ← 2,500 ← 900.</p>","principle":"أكبر انتقال يحتاج إلى تحقيق يُحدَّد بالانخفاض النسبي بين مرحلتين متتاليتين.","hint":"<p>احسب نسبة الانتقال بين كل مرحلتين لا الفرق المطلق فقط.</p>","why":"يدرّب على قراءة الـFunnel بالنسب لا بالانطباع.","model":"<p>الانتقال من 2,500 إلى 900 (انتقال 36% فقط) يحتاج إلى التحقيق أولًا بسبب الانخفاض الكبير في المرحلة الأخيرة.</p>","chart":{"kind":"funnel","items":["المرحلة 1::10000","المرحلة 2::6000","المرحلة 3::3000","المرحلة 4::2500","المرحلة 5::900"]},"axis":"a13"},{"id":"a13e9","title":"الرقم المخادع","icon":"🎭","mode":"group","format":"text","steps":["قارنوا الرقمين ببعضهما.","احسبوا ما حدث للتحويل تقريبيًا.","حددوا ما تحتاجون تحليله."],"scenario":"<p>ارتفعت الزيارات +40%، وارتفع عدد الطلبات +5%.</p>","principle":"مؤشرات الأداء لا تعمل منفردة؛ النمو في الزيارات قد يخفي تراجعًا في التحويل.","task":"<p>هل يكفي هذا للحكم على تحسن الأداء؟ برروا، وحددوا ما ينبغي تحليله.</p>","why":"يكشف فخ «الرقم الجميل» الذي يخفي تراجعًا حقيقيًا.","model":"<p>لا. التحويل انخفض فعليًا (الطلبات نمت أقل بكثير من الزيارات). ينبغي تحليل التحويل، ومراحل الرحلة، ومصدر الزيارات، وجودة المستخدمين.</p>","axis":"a13"},{"id":"a13e10","title":"بطاقة المحلل","icon":"🪪","mode":"group","format":"text","steps":["ابنوا السلسلة الخماسية بالترتيب.","اجعلوا الفرضية قابلة للاختبار.","حددوا البيانات التي تؤكدها أو تنفيها."],"scenario":"<p>بطاقة حالة: «عدد كبير من المستخدمين يدخلون صفحة المنتج، لكن الإضافة للسلة منخفضة.»</p>","principle":"سلسلة التحليل: البيانات ← الملاحظة ← السؤال ← فرضية أولية ← البيانات المطلوبة.","task":"<p>ابنوا السلسلة: البيانات ← الملاحظة ← السؤال ← فرضية أولية ← البيانات المطلوبة.</p>","why":"التقييم من 10: وضوح الملاحظة (2)، جودة السؤال (2)، منطق الفرضية (2)، البيانات المطلوبة (2)، ترابط التفكير (2).","model":"<p>البيانات: 8,000 مشاهدة و600 إضافة. الملاحظة: انتقال 7.5% فقط. السؤال: ما الذي يمنع الإضافة؟ الفرضية: معلومات التوصيل غير ظاهرة في صفحة المنتج. البيانات المطلوبة: التمرير في الصفحة، والنقر على «التوصيل»، وأسئلة خدمة العملاء.</p>","axis":"a13"}],"highlights":["البيانات ليست القرار","أنواع البيانات الأربعة داخل التطبيق","لا تقرأ الرقم وحده","من الرقم إلى السلوك إلى القرار"],"unit":5,"icon":"chart","color":12,"scene":"data","title":"ماذا تقول الأرقام؟","classic":"فهم البيانات كمصدر لاتخاذ القرار داخل التطبيق","duration":"90 دقيقة","desc":"<p>الانتقال من «التطبيق يعمل» إلى «نعرف كيف يعمل وأين المشكلة». نفرّق هنا بين البيانات والمعلومة، ونحدد أنواع البيانات المهمة، ونربط الأرقام بسلوك المستخدم داخل رحلة الشراء.</p>"},{"id":"a14","slides":[{"type":"opening","title":"من قراءة الأرقام إلى اكتشاف الانحراف","text":"<p>الانحراف يعني وجود فرق بين الأداء المتوقع والأداء الفعلي. المتوقع: انتقال 70% من صفحة المنتج إلى السلة. الفعلي: 45%. هنا توجد إشارة تحتاج إلى تفسير.</p>","rule":"<p>الفجوة 25 نقطة — والسؤال: لماذا؟</p>","chart":{"kind":"gap","items":["المتوقع 70%","الفجوة 25 نقطة","الفعلي 45%","إشارة تحتاج إلى تفسير"]},"id":"a14s1"},{"type":"principle","title":"ما الذي يجعل الانحراف مهمًا؟","points":["انخفاض مفاجئ.","ارتفاع غير متوقع في الانسحاب.","ضعف واضح في التفاعل.","انخفاض الإتمام في مرحلة محددة.","تغير مستمر وليس عابرًا."],"intro":"<p>ليس كل تغير يحتاج إلى تدخل فوري. نبحث عن:</p>","rule":"<p>المشكلة ليست في وجود تغير فقط، وإنما في معرفة ما إذا كان التغير يستحق التحقيق.</p>","chart":{"kind":"cards","items":["📉 انخفاض مفاجئ","🚪 ارتفاع الانسحاب","💤 ضعف التفاعل","🧱 انخفاض الإتمام في مرحلة"]},"id":"a14s2"},{"type":"principle","title":"تحديد نقطة الانحراف","points":["المراحل المستقرة لا تحتاج تدخلًا الآن.","الانتقال المنحرف هو موضع البحث."],"intro":"<p>في الرحلة: دخول ← استكشاف ← تقييم ← سلة ← دفع ← إتمام، إذا كانت جميع المراحل مستقرة باستثناء الانتقال من السلة إلى الدفع، فهذه نقطة تستحق التحقيق.</p>","rule":"<p>السؤال: ما الذي تغيّر في هذه النقطة؟</p>","chart":{"kind":"flow","items":["دخول","استكشاف","تقييم","سلة","دفع!","إتمام"]},"id":"a14s3"},{"type":"principle","title":"لا تخلط بين الانحراف والسبب","points":["الانحراف: ماذا وأين.","التفسير: لماذا (محتمل حتى يُختبر)."],"intro":"<p>إذا انخفض التحويل: هذا انحراف. وإذا وجدنا أن الانخفاض حدث بعد إضافة رسوم لم تكن واضحة: هذا تفسير محتمل.</p>","rule":"<p>المؤشر يخبرنا أين نبحث، ولا يخبرنا دائمًا لماذا حدثت المشكلة.</p>","chart":{"kind":"compare","items":["📍 الانحراف :: التحويل انخفض ; ماذا وأين","🔍 التفسير المحتمل :: رسوم غير واضحة ; لماذا (يحتاج اختبارًا)"]},"id":"a14s4"},{"type":"tools","title":"المقارنة تساعد على كشف الانحراف","items":["الزمن::هذا الشهر مقابل الشهر السابق.","نوع المستخدم::مستخدمون جدد مقابل عائدين.","الجهاز::أجهزة مختلفة (iOS / Android).","المصدر::مصادر دخول مختلفة (إعلان، بحث، رابط مباشر).","المرحلة::مراحل مختلفة من الرحلة."],"id":"a14s5"},{"type":"principle","title":"مثال على المقارنة: جديد مقابل عائد","points":["مشاهدة المنتج: 70% مقابل 82%.","الإضافة للسلة: 18% مقابل 31%.","بدء الدفع: 10% مقابل 21%.","الإتمام: 6% مقابل 15%."],"intro":"<p>عند المقارنة بين المستخدمين الجدد والعائدين تظهر فجوة في كل مرحلة. هل المشكلة في التطبيق كله؟ لا يمكن الجزم بذلك؛ البيانات تشير إلى اختلاف في السلوك بين الفئتين، ويحتاج الأمر إلى تحليل أعمق.</p>","chart":{"kind":"table","items":["المؤشر ; مستخدم جديد ; مستخدم عائد","مشاهدة المنتج ; 70% ; 82%","الإضافة للسلة ; 18% ; 31%","بدء الدفع ; 10% ; 21%","الإتمام ; 6% ; 15%"]},"id":"a14s6"},{"type":"principle","title":"اربط الانحراف بالسلوك","points":["أين حدث؟","من تأثر به؟","ماذا كان يفعل المستخدم؟","ما الذي تغيّر؟"],"intro":"<p>عند اكتشاف الانحراف نسير بأربعة أسئلة متتابعة:</p>","chart":{"kind":"steps","items":["أين حدث؟","من تأثر؟","ماذا كان يفعل؟","ما الذي تغيّر؟"]},"id":"a14s7"},{"type":"principle","title":"المتوسط قد يخفي التفاصيل","points":["مرحلة معينة.","فئة معينة.","جهاز معين.","سيناريو معين."],"intro":"<p>قد يكون الأداء العام مستقرًا (التحويل العام = مستقر)، لكن توجد شكاوى متكررة. هذا يعني أن المتوسط العام قد يخفي مشكلة في:</p>","rule":"<p>مثال: التحويل العام 5%، لكن عند التقسيم: iOS = 7% وAndroid = 3%. التقسيم كشف اختلافًا يستحق التحقيق.</p>","chart":{"kind":"bars","items":["التحويل العام::5","iOS::7","Android::3"]},"id":"a14s8"},{"type":"principle","title":"الانحراف يحتاج إلى سؤال دقيق","points":["وصف عام: يقود إلى حلول عامة.","وصف محدد: يقود إلى بحث دقيق عن السبب."],"intro":"<p>بدلًا من: «هناك انخفاض»، نقول: «حدث انخفاض في مرحلة محددة لدى فئة محددة خلال فترة محددة».</p>","rule":"<p>كلما أصبح وصف المشكلة أكثر تحديدًا، أصبح البحث عن السبب أكثر دقة.</p>","chart":{"kind":"compare","items":["🌫️ وصف عام :: «هناك انخفاض»","🎯 وصف محدد :: مرحلة محددة ; فئة محددة ; فترة محددة"]},"id":"a14s9"},{"type":"summary","title":"ورشة: المؤشر العام مستقر لكن الشكاوى ترتفع","text":"<p>تطبيق تجاري: الأداء العام مستقر، ومعدل التحويل مقبول، لكن شكاوى المستخدمين ارتفعت، وتتركز حول إتمام الطلب. المطلوب تحديد: المؤشر الذي يحتاج إلى تحليل، والمرحلة التي تحتاج إلى تحقيق، والبيانات الإضافية المطلوبة، وأول فرضية للتحقق.</p>","rule":"<p>اكتشاف الانحراف بداية التحقيق، لا نهايته.</p>","id":"a14s10"}],"exercises":[{"id":"a14e1","title":"حدد الانحراف","icon":"📍","mode":"individual","format":"mcq","steps":[],"items":[{"q":"أين يظهر الانحراف الأوضح؟","options":["الزيارات","مشاهدة المنتج","بدء الدفع","الإتمام"],"answer":3},{"q":"الفرق بين 25% و24% في الإضافة للسلة يُعد:","options":["انحرافًا يستحق تدخلًا فوريًا","تغيرًا طفيفًا لا يستحق التحقيق الآن","سببًا مؤكدًا للمشكلة","دليلًا على فشل التطبيق"],"answer":1}],"scenario":"<p>المتوقع والفعلي لخمسة مؤشرات: الزيارات 50,000/51,000 — مشاهدة المنتج 60%/59% — الإضافة للسلة 25%/24% — بدء الدفع 15%/14% — الإتمام 10%/5%.</p>","principle":"الانحراف المهم هو الفجوة الكبيرة بين المتوقع والفعلي، لا التذبذب الطفيف.","hint":"<p>قارن حجم الفجوة النسبية لكل مؤشر.</p>","why":"يدرّب على التمييز بين الضوضاء والإشارة.","model":"<p>الإتمام — المتوقع 10% والفعلي 5%، أي نصف المتوقع، بينما بقية المؤشرات قريبة من المتوقع.</p>","chart":{"kind":"table","items":["المؤشر ; المتوقع ; الفعلي","الزيارات ; 50,000 ; 51,000","مشاهدة المنتج ; 60% ; 59%","الإضافة للسلة ; 25% ; 24%","بدء الدفع ; 15% ; 14%","الإتمام ; 10% ; 5%"]},"axis":"a14"},{"id":"a14e2","title":"أكمل: لغة الانحراف","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"الانحراف هو الفرق بين الأداء ___ والأداء الفعلي.","answer":"المتوقع"},{"text":"الانخفاض المفاجئ قد يمثل ___.","answer":"انحراف"},{"text":"ارتفاع الانسحاب قد يشير إلى وجود ___.","answer":"احتكاك"},{"text":"المقارنة تساعد على كشف ___.","answer":"الفجوات"},{"text":"يجب ربط الانحراف بـ ___ المستخدم.","answer":"سلوك"},{"text":"الرقم العام قد يخفي اختلافات بين ___.","answer":"الفئات"},{"text":"الانحراف لا يعني بالضرورة معرفة ___.","answer":"السبب"},{"text":"بعد اكتشاف الانحراف نحتاج إلى ___ السبب.","answer":"تفسير"},{"text":"التقسيم إلى شرائح يساعد على كشف ___.","answer":"اختلافات"},{"text":"القرار الجيد يحتاج إلى بيانات و___.","answer":"تحليل"}],"principle":"الانحراف فرق بين المتوقع والفعلي، والمقارنة والتقسيم تكشفانه، والتفسير يأتي بعده.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفردات تحليل الانحرافات.","model":"<p>المتوقع، انحراف، احتكاك، الفجوات، سلوك، الفئات، السبب، تفسير، اختلافات، تحليل.</p>","axis":"a14"},{"id":"a14e3","title":"اختيار من متعدد: الانحرافات","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"الانحراف يعني:","opt ":false},{"q":"ارتفاع الشكاوى قد يستحق التحقيق حتى لو كان المتوسط مستقرًا.","answer":true},{"q":"المقارنة بين الأجهزة قد تكشف مشكلة مخفية.","answer":true},{"q":"لا حاجة لمعرفة الفترة الزمنية.","answer":false},{"q":"وصف المشكلة بدقة يساعد على تحسين القرار.","answer":true}],"principle":"الانحراف إشارة للبحث لا حكم بالفشل، والمتوسط لا يكشف كل التفاصيل.","hint":"<p>الانحراف ≠ السبب ≠ الفشل.</p>","why":"يراجع مفاهيم المحور بسرعة.","model":"<p>خطأ، صح، خطأ، صح، صح، خطأ، صح، صح، خطأ، صح.</p>","axis":"a14"},{"id":"a14e5","title":"أيهما أدق؟ وصف المشكلة","icon":"🎯","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"التحويل سيئ.","b":"التحويل انخفض في مرحلة محددة.","answer":"b"},{"a":"التطبيق فيه مشكلة.","b":"توجد إشارة تحتاج إلى تحديد موقعها وسببها.","answer":"b"},{"a":"المتوسط يكفي.","b":"المتوسط قد يحتاج إلى تقسيم.","answer":"b"},{"a":"الانحراف هو السبب.","b":"الانحراف إشارة للبحث عن السبب.","answer":"b"},{"a":"الشكاوى غير مهمة مع استقرار المؤشر العام.","b":"الشكاوى قد تكشف مشكلة مخفية.","answer":"b"},{"a":"نغير التصميم فورًا.","b":"نحدد المشكلة أولًا.","answer":"b"},{"a":"كل المستخدمين يتصرفون بالطريقة نفسها.","b":"قد تختلف السلوكيات حسب الشريحة.","answer":"b"},{"a":"الانخفاض العام يحدد السبب.","b":"الانخفاض العام يحتاج إلى تفكيك.","answer":"b"},{"a":"البيانات المتوسطة دائمًا كافية.","b":"بعض المشكلات تظهر عند التقسيم.","answer":"b"},{"a":"اكتشاف الانحراف نهاية التحليل.","b":"اكتشاف الانحراف بداية التحقيق.","answer":"b"}],"scenario":"<p>عشرة أزواج من العبارات حول الانحرافات. اختاروا العبارة الأدق في كل زوج.</p>","principle":"الانحراف بداية التحقيق، والوصف الدقيق يقود إلى بحث دقيق.","hint":"<p>الأدق هو ما يدعو إلى التحديد والتفكيك.</p>","why":"يدرّب على لغة تحليلية دقيقة داخل الفريق.","model":"<p>(ب) في كل الأزواج.</p>","axis":"a14"},{"id":"a14e6","title":"رتّب رحلة التشخيص","icon":"🪜","mode":"group","format":"fillblank","steps":[],"items":[{"text":"الخطوة 1: ___","answer":"اكتشاف الانحراف"},{"text":"الخطوة 2: ___","answer":"تحديد المرحلة"},{"text":"الخطوة 3: ___","answer":"تحديد البيانات المطلوبة"},{"text":"الخطوة 4: ___","answer":"البحث عن السبب"},{"text":"الخطوة 5: ___","answer":"اقتراح حل"},{"text":"الخطوة 6: ___","answer":"قياس النتيجة"}],"scenario":"<p>ست بطاقات مبعثرة: اقتراح حل، اكتشاف الانحراف، قياس النتيجة، تحديد المرحلة، البحث عن السبب، تحديد البيانات المطلوبة. ضعوا كل بطاقة في ترتيبها الصحيح.</p>","principle":"رحلة التشخيص تبدأ بالانحراف وتنتهي بالقياس، والحل لا يسبق البحث عن السبب.","hint":"<p>ضعوا كل بطاقة في خانة الخطوة المناسبة. اضغط خانة ممتلئة لإعادة بطاقتها.</p>","why":"يرسّخ تسلسل التشخيص بطريقة ترتيب تفاعلية.","model":"<p>اكتشاف الانحراف ← تحديد المرحلة ← تحديد البيانات المطلوبة ← البحث عن السبب ← اقتراح حل ← قياس النتيجة.</p>","axis":"a14"},{"id":"a14e7","title":"أين المشكلة؟","icon":"🧭","mode":"group","format":"text","steps":["حددوا نقطة الانحراف.","حددوا البيانات التي تحتاجونها.","اكتبوا أسئلة التحقيق."],"scenario":"<p>المعطيات: الزيارات مستقرة، مشاهدة المنتجات مستقرة، الإضافة للسلة مستقرة، بدء الدفع مستقر، الإتمام انخفض 25%.</p>","principle":"عندما تستقر كل المراحل إلا واحدة، تصبح تلك المرحلة نقطة الانحراف وموضع التحقيق.","task":"<p>حددوا: نقطة الانحراف، والبيانات التي تحتاجونها، وثلاثة أسئلة للتحقيق.</p>","why":"يطبّق تحديد نقطة الانحراف على حالة واضحة المعالم.","model":"<p>نقطة الانحراف: الإتمام. الأسئلة: هل الانخفاض مرتبط بالدفع؟ هل حدث تغيير في طريقة الدفع؟ هل ظهرت رسوم أو خطوات جديدة؟</p>","axis":"a14"},{"id":"a14e8","title":"افصل الملاحظة عن التفسير","icon":"🔬","mode":"individual","format":"mcq","steps":[],"items":[{"q":"التحويل انخفض 10%.","options":["ملاحظة","تفسير"],"answer":0},{"q":"السبب هو ارتفاع السعر.","options":["ملاحظة","تفسير"],"answer":1},{"q":"الانسحاب ارتفع في صفحة الدفع.","options":["ملاحظة","تفسير"],"answer":0},{"q":"المستخدمون يخافون من الدفع.","options":["ملاحظة","تفسير"],"answer":1},{"q":"مدة الجلسة انخفضت.","options":["ملاحظة","تفسير"],"answer":0},{"q":"الصفحة أصبحت أكثر تعقيدًا.","options":["ملاحظة","تفسير"],"answer":1},{"q":"الإتمام أقل لدى مستخدمي Android.","options":["ملاحظة","تفسير"],"answer":0},{"q":"هناك خلل تقني في Android.","options":["ملاحظة","تفسير"],"answer":1},{"q":"الشكاوى ارتفعت.","options":["ملاحظة","تفسير"],"answer":0},{"q":"السبب هو ضعف الثقة.","options":["ملاحظة","تفسير"],"answer":1}],"scenario":"<p>عشر جمل من تقرير أداء. حدد لكل جملة: هل هي ملاحظة (ما رأيناه) أم تفسير (لماذا حدث)؟</p>","principle":"الملاحظة تصف ما حدث، والتفسير يقترح سببًا؛ الخلط بينهما يقود إلى قرارات متسرعة.","hint":"<p>هل الجملة تصف رقمًا أو سلوكًا، أم تنسب له سببًا؟</p>","why":"مهارة جوهرية في قراءة التقارير وكتابتها.","model":"<p>ملاحظة: 1، 3، 5، 7، 9. تفسير (محتمل): 2، 4، 6، 8، 10.</p>","axis":"a14"},{"id":"a14e9","title":"تحدي المتوسط","icon":"📊","mode":"group","format":"text","steps":["فسّروا ما يخفيه المتوسط.","اقترحوا تقسيمات إضافية.","حددوا ما سيكشفه كل تقسيم."],"scenario":"<p>التحويل العام = 5%. لكن: المستخدم الجديد = 2%، والمستخدم العائد = 9%.</p>","principle":"المتوسط قد يخفي اختلافًا واضحًا بين شرائح المستخدمين.","task":"<p>ما الذي قد يخفيه المتوسط؟ ثم اقترحوا ثلاثة تحليلات إضافية.</p>","why":"يدرّب على التفكير بالشرائح بدل الأرقام الإجمالية.","model":"<p>اختلافًا واضحًا بين شرائح المستخدمين؛ الجدد يواجهون عائقًا لا يواجهه العائدون. تحليلات إضافية: التقسيم حسب مصدر الدخول، وحسب الجهاز، وحسب المرحلة التي يتوقف فيها الجدد (مثل التسجيل الإجباري).</p>","chart":{"kind":"bars","items":["التحويل العام::5","مستخدم جديد::2","مستخدم عائد::9"]},"axis":"a14"},{"id":"a14e10","title":"بطاقة التحقيق","icon":"🗃️","mode":"group","format":"text","steps":["اكتبوا الملاحظة بدقة.","حددوا نقطة الانحراف والأسئلة والبيانات.","صوغوا فرضيتين وطريقة التحقق."],"scenario":"<p>حالة: «ارتفاع الانسحاب في مرحلة الدفع لدى مستخدمي الجوال».</p>","principle":"التحقيق المنظم: ملاحظة ← نقطة انحراف ← أسئلة ← بيانات ← فرضيات ← طريقة تحقق.","task":"<p>أنتجوا: الملاحظة، ونقطة الانحراف، و3 أسئلة، و3 بيانات تحتاجونها، وفرضيتين، وطريقة التحقق.</p>","why":"التقييم: كل عنصر درجتان، والمجموع 12.","model":"<p>مثال: الملاحظة: الانسحاب في الدفع أعلى لدى الجوال بـ 15 نقطة. الأسئلة: متى بدأ؟ أي نظام تشغيل؟ أي خطوة تحديدًا؟ البيانات: الانسحاب حسب الخطوة والجهاز، وزمن التحميل، وسجل الأخطاء. الفرضيات: حقول البطاقة غير مهيأة للجوال؛ بطء بوابة الدفع على الشبكات المتنقلة. التحقق: اختبار نسخة مبسطة للجوال ومقارنة الانسحاب.</p>","axis":"a14"}],"highlights":["المتوقع مقابل الفعلي","الانحراف يخبرنا أين نبحث لا لماذا","المتوسط قد يخفي التفاصيل","وصف المشكلة بدقة"],"unit":5,"icon":"radar","color":13,"scene":"anomaly","title":"رادار الانحرافات","classic":"تحليل الأداء واكتشاف الانحرافات داخل التطبيق","duration":"90 دقيقة","desc":"<p>الانحراف فرق بين الأداء المتوقع والأداء الفعلي. نتعلم هنا متى يستحق الانحراف التحقيق، وكيف نحدد نقطته، ولماذا لا نخلط بينه وبين السبب، وكيف تكشف المقارنة والتقسيم ما يخفيه المتوسط.</p>"},{"id":"a15","slides":[{"type":"opening","title":"لماذا نحتاج إلى التحسين المستمر؟","text":"<p>التطبيق التجاري يتغير باستمرار: المستخدم يتغير، والسلوك يتغير، والمنتجات والعروض تتغير، والمنافسة والتقنية تتغيران. لذلك لا يكفي إجراء تحسين واحد ثم التوقف.</p>","rule":"<p>التحسين عملية مستمرة مبنية على التعلم.</p>","chart":{"kind":"cycle","items":["حل","قياس","تعلم","تعديل","قياس من جديد"]},"id":"a15s1"},{"type":"principle","title":"مفهوم التحسين المستمر","points":["ليس تغييرًا عشوائيًا.","ليس حدثًا لمرة واحدة.","بل دورة منظمة: حل ← قياس ← تعلم ← تعديل ← قياس من جديد."],"intro":"<p>التحسين المستمر يعني تطوير الأداء بشكل تدريجي بناءً على البيانات والملاحظات ونتائج الاختبارات.</p>","id":"a15s2"},{"type":"mistakes","title":"لا تغيّر كل شيء مرة واحدة","items":["تعديل الصفحة والرسالة والسعر والدفع والمحتوى معًا::غيّر عنصرًا محددًا في كل مرة.","لن نعرف أي تغيير أحدث النتيجة::صمّم الاختبار بحيث يُنسب الأثر إلى تغيير واحد.","الحكم على التغيير فور إطلاقه::حدد فترة قياس كافية مسبقًا."],"id":"a15s3"},{"type":"principle","title":"من المشكلة إلى فرضية","points":["اختبار.","قياس.","نتيجة."],"intro":"<p>بدلًا من: «نحتاج تحسين صفحة الدفع»، نصوغ فرضية: «إذا تم تقليل عدد الحقول المطلوبة في صفحة الدفع، فقد ينخفض الانسحاب في هذه المرحلة». ثم:</p>","chart":{"kind":"flow","items":["مشكلة","فرضية «إذا... فقد...»","اختبار","قياس","نتيجة*"]},"id":"a15s4"},{"type":"tools","title":"عناصر خطة التحسين","items":["المشكلة::ما الذي نراه؟","الدليل::ما البيانات التي تثبته؟","الفرضية::ما التفسير القابل للاختبار؟","التغيير المقترح::ما الذي سنعدله تحديدًا؟","المؤشر المستهدف::ما الرقم الذي نتوقع تحركه؟","طريقة القياس::كيف سنقارن؟","الفترة الزمنية::كم مدة الاختبار؟","القرار بعد ظهور النتيجة::اعتماد، تعديل، أو إلغاء."],"id":"a15s5"},{"type":"principle","title":"ترتيب الأولويات","points":["الأثر المتوقع.","حجم المشكلة.","سهولة التنفيذ.","وضوح الدليل."],"intro":"<p>ليست كل المشكلات متساوية؛ يمكن ترتيبها حسب:</p>","rule":"<p>مشكلة تؤثر على 40% من المستخدمين قد تحصل على أولوية أعلى من مشكلة تؤثر على 2% فقط، مع مراعاة أثرها وإمكانية معالجتها.</p>","id":"a15s6"},{"type":"principle","title":"مصفوفة الأولويات","points":["أثر مرتفع / تنفيذ سهل: مرشحة قوية للبدء.","أثر مرتفع / تنفيذ صعب: تُدرس حسب الموارد.","أثر منخفض / تنفيذ سهل: مكاسب سريعة صغيرة.","أثر منخفض / تنفيذ صعب: تؤجل غالبًا."],"intro":"<p>نضع المشكلات على محورين: سهولة التنفيذ (أفقيًا) والأثر المتوقع (رأسيًا)، فتظهر أربع مناطق:</p>","chart":{"kind":"matrix","items":["سهولة التنفيذ","الأثر المتوقع","أثر مرتفع / تنفيذ صعب","أثر مرتفع / تنفيذ سهل ✓","أثر منخفض / تنفيذ صعب","أثر منخفض / تنفيذ سهل"]},"id":"a15s7"},{"type":"principle","title":"القرار لا ينتهي عند إطلاق التغيير","points":["هل تحسّن المؤشر؟","هل تحسّن بسبب التغيير؟","هل ظهرت آثار جانبية؟","هل نثبت التغيير أم نعدله أم نلغيه؟"],"intro":"<p>إطلاق التغيير ليس نهاية العمل. بعد التنفيذ نسأل بالتتابع:</p>","chart":{"kind":"vflow","items":["هل تحسّن المؤشر؟","بسبب التغيير؟","آثار جانبية؟","نثبت أم نعدل أم نلغي؟*"]},"id":"a15s8"},{"type":"principle","title":"ماذا نتعلم من نتيجة ضعيفة؟","points":["الفرضية غير صحيحة.","التغيير غير كافٍ.","المشكلة في مكان آخر.","التوقيت غير مناسب.","المؤشر المختار لا يقيس النتيجة المطلوبة."],"intro":"<p>نتيجة ضعيفة لا تعني أن التحليل كله فشل. قد تعني:</p>","rule":"<p>كل تجربة يجب أن تنتج تعلمًا.</p>","id":"a15s9"},{"type":"examples","title":"مثال كامل لدورة تحسين","items":["الملاحظة::ارتفاع الانسحاب أثناء الدفع.","البيانات::عدد الخطوات مرتفع.","الفرضية::التعقيد يزيد الانسحاب.","التغيير::تقليل الخطوات والحقول.","المؤشر::معدل الإتمام.","القياس::مقارنة الأداء قبل وبعد التغيير."],"id":"a15s10"},{"type":"principle","title":"القرار المبني على التعلم","points":["تحسن واضح: اعتماد التغيير ومتابعته.","تحسن محدود: تعديل الفرضية أو التغيير.","لا تحسن: العودة للتحليل والبحث عن سبب آخر."],"intro":"<p>بعد الاختبار توجد ثلاثة مسارات:</p>","chart":{"kind":"tree","items":["نتيجة الاختبار","تحسن واضح::اعتماد التغيير ومتابعته","تحسن محدود::تعديل الفرضية أو التغيير","لا تحسن::العودة للتحليل"]},"id":"a15s11"},{"type":"principle","title":"لوحة التحسين المستمر","points":["انسحاب الدفع: بيانات الرحلة ← الخطوات كثيرة ← تبسيط الدفع ← الإتمام (اختبار).","ضعف الإضافة للسلة: بيانات المنتج ← المعلومات غير واضحة ← تحسين العرض ← الإضافة (مخطط).","انخفاض التفاعل: بيانات الرسائل ← التوقيت غير مناسب ← تعديل التوقيت ← التفاعل (اختبار)."],"intro":"<p>يمكن أن تحتوي لوحة الفريق (بأسلوب Kanban) على المشكلة والدليل والفرضية والتغيير والمؤشر والحالة:</p>","chart":{"kind":"table","items":["المشكلة ; الفرضية ; التغيير ; المؤشر ; الحالة","انسحاب الدفع ; الخطوات كثيرة ; تبسيط الدفع ; الإتمام ; اختبار","ضعف الإضافة للسلة ; المعلومات غير واضحة ; تحسين العرض ; الإضافة ; مخطط","انخفاض التفاعل ; التوقيت غير مناسب ; تعديل التوقيت ; التفاعل ; اختبار"]},"id":"a15s12"},{"type":"summary","title":"التطبيق التجاري لا يتحسن بالحدس وحده","text":"<p>لا نريد تطبيقًا نعتقد أنه جيد، بل تطبيقًا نراقب أداءه، ونفهم سلوك مستخدميه، ونكتشف الانحرافات، ونختبر التحسينات، ونقيس النتائج، ونتعلم، ثم نكرر الدورة. التحول التجاري عبر الهاتف المحمول منظومة مترابطة: سلوك المستخدم يؤثر في التجربة، والتجربة في التحويل، والدفع والثقة في الإتمام، والبيانات تكشف أين تحتاج المنظومة إلى التحسين.</p>","rule":"<p>راقب ← حلل ← اكتشف الانحراف ← فسّر ← اختبر ← قِس ← تعلّم ← حسّن... ثم تعود الدورة من جديد.</p>","chart":{"kind":"cycle","items":["راقب","حلّل","اكتشف الانحراف","فسّر","اختبر","قِس","تعلّم"]},"id":"a15s13"}],"exercises":[{"id":"a15e1","title":"حوّل المشكلة إلى فرضية","icon":"💡","mode":"individual","format":"text","steps":["حدد تغييرًا واحدًا محددًا.","حدد المؤشر الذي تتوقع تحركه.","صُغ الجملة بصيغة «إذا... فقد...»."],"scenario":"<p>«المستخدمون ينسحبون من الدفع.»</p>","principle":"الفرضية الجيدة تصاغ بصيغة «إذا... فقد...»، وتكون قابلة للاختبار والقياس.","task":"<p>اكتب فرضية واحدة قابلة للاختبار.</p>","why":"الفرضية هي الجسر بين التشخيص والتجربة؛ بدونها يصبح التغيير عشوائيًا.","model":"<p>إذا تم تقليل عدد الخطوات المطلوبة في الدفع، فقد يرتفع معدل الإتمام وتنخفض نسبة الانسحاب.</p>","axis":"a15"},{"id":"a15e2","title":"أكمل: لغة التحسين","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"التحسين المستمر يعتمد على البيانات و___.","answer":"التعلم"},{"text":"الفرضية يجب أن تكون قابلة لـ ___.","answer":"الاختبار"},{"text":"بعد التغيير نحتاج إلى ___ النتيجة.","answer":"قياس"},{"text":"لا يُفضل تغيير عدة عناصر دون معرفة ___ كل تغيير.","answer":"أثر"},{"text":"خطة التحسين تبدأ بتحديد ___.","answer":"المشكلة"},{"text":"المؤشر يساعد على قياس ___.","answer":"النتيجة"},{"text":"النتيجة الضعيفة قد تنتج ___ جديدًا.","answer":"تعلمًا"},{"text":"ترتيب الأولويات يعتمد على الأثر و___ التنفيذ.","answer":"سهولة"},{"text":"التحسين المستمر عملية ___.","answer":"مستمرة"},{"text":"بعد القياس نحتاج إلى اتخاذ ___.","answer":"قرار"}],"principle":"التحسين المستمر يعتمد على البيانات والتعلم، والفرضية قابلة للاختبار، والقياس يتبع كل تغيير.","hint":"<p>كل كلمة تُستخدم مرة واحدة. اضغط فراغًا ممتلئًا لإعادة كلمته إلى البنك.</p>","why":"يثبّت مفردات منهجية التحسين المستمر.","model":"<p>التعلم، الاختبار، قياس، أثر، المشكلة، النتيجة، تعلمًا، سهولة، مستمرة، قرار.</p>","axis":"a15"},{"id":"a15e3","title":"اختيار من متعدد: التحسين","icon":"🔘","mode":"individual","format":"mcq","steps":[],"items":[{"q":"التحسين المستمر يعني:","options":["تغيير التطبيق يوميًا","تطوير الأداء بناءً على التعلم والقياس","تغيير التصميم فقط","زيادة الخصائص"] "نتيجة الاختبار تساعد على القرار التالي.","answer":true},{"q":"التحسين المستمر مرتبط بدورة تعلم متكررة.","answer":true}],"principle":"التحسين دورة تعلم متكررة، والفشل فيها مصدر تعلم لا نهاية.","hint":"<p>هل العبارة تقطع دورة التعلم أم تحافظ عليها؟</p>","why":"يراجع مبادئ المحور بسرعة.","model":"<p>خطأ، صح، خطأ، صح، خطأ، صح، صح، خطأ، صح، صح.</p>","axis":"a15"},{"id":"a15e5","title":"أيهما أكثر دقة؟ التحسين","icon":"⚖️","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"نحتاج تغيير صفحة الدفع.","b":"نحتاج اختبار فرضية حول سبب الانسحاب في صفحة الدفع.","answer":"b"},{"a":"أطلقنا التغيير وانتهى العمل.","b":"نحتاج قياس أثر التغيير بعد إطلاقه.","answer":"b"},{"a":"النتيجة الضعيفة تعني فشل الفريق.","b":"النتيجة الضعيفة قد تكشف أن الفرضية تحتاج مراجعة.","answer":"b"},{"a":"نغير عدة عناصر لمعرفة ما يحدث.","b":"نحدد التغيير قدر الإمكان حتى نتمكن من التعلم.","answer":"b"},{"a":"كل المشكلات لها الأولوية نفسها.","b":"الأولوية تعتمد على الأثر والدليل وإمكانية التنفيذ.","answer":"b"},{"a":"التحسين عملية تقنية فقط.","b":"التحسين عملية تحليل وقرار وقياس وتعلم.","answer":"b"},{"a":"المؤشر مهم لأنه رقم.","b":"المؤشر مهم لأنه يساعد على تقييم النتيجة.","answer":"b"},{"a":"الفرضية رأي.","b":"الفرضية تفسير يمكن اختباره.","answer":"b"},{"a":"الاختبار نهاية العملية.","b":"نتيجة الاختبار بداية قرار جديد.","answer":"b"},{"a":"التحسين المستمر يعني تغييرات عشوائية.","b":"التحسين المستمر يعني تغييرات منظمة مبنية على التعلم.","answer":"b"}],"scenario":"<p>عشرة أزواج من العبارات حول التحسين المستمر. اختاروا الأدق في كل زوج.</p>","principle":"التحسين عملية منظمة: فرضية، اختبار، قياس، تعلم.","hint":"<p>الأدق يحافظ على منطق الاختبار والتعلم.</p>","why":"يصحح التصورات الشائعة عن «التحسين» داخل الفرق.","model":"<p>(ب) في كل الأزواج.</p>","axis":"a15"},{"id":"a15e6","title":"ابنِ خطة تحسين","icon":"📝","mode":"group","format":"text","steps":["املؤوا العناصر الثمانية بالترتيب.","تأكدوا من ارتباط المؤشر بالمشكلة.","حددوا القرار لكل نتيجة محتملة."],"scenario":"<p>التطبيق يعاني من انخفاض الإتمام في الدفع.</p>","principle":"خطة التحسين الكاملة ثمانية عناصر: المشكلة، الدليل، الفرضية، التغيير، المؤشر، طريقة القياس، مدة الاختبار، القرار بعد النتيجة.","task":"<p>أكملوا الجدول: المشكلة، الدليل، الفرضية، التغيير، المؤشر، طريقة القياس، مدة الاختبار، القرار بعد النتيجة.</p>","why":"التقييم: كل عنصر درجة (8 درجات).","model":"<p>المشكلة: انخفاض الإتمام. الدليل: 45% ينسحبون بعد بدء الدفع. الفرضية: 9 حقول تزيد الانسحاب. التغيير: 5 حقول فقط. المؤشر: معدل الإتمام. القياس: اختبار A/B. المدة: أسبوعان. القرار: اعتماد إن تحسن بوضوح، تعديل إن كان محدودًا، عودة للتحليل إن لم يتحسن.</p>","axis":"a15"},{"id":"a15e7","title":"مصفوفة الأولويات","icon":"🟩","mode":"individual","format":"mcq","steps":[],"items":[{"q":"بأي مشكلة تبدأ المجموعة غالبًا؟","options":["A — أثر مرتفع / تنفيذ سهل","B — أثر مرتفع / تنفيذ صعب","C — أثر منخفض / تنفيذ سهل","D — أثر منخفض / تنفيذ صعب"],"answer":0},{"q":"أي مشكلة تُدرس حسب الموارد والاستراتيجية؟","options":["A","B","C","D"],"answer":1},{"q":"أي مشكلة تؤجل غالبًا؟","options":["A","B","C","D"],"answer":3}],"scenario":"<p>أمام المجموعة أربع مشكلات: (A) أثر مرتفع / تنفيذ سهل. (B) أثر مرتفع / تنفيذ صعب. (C) أثر منخفض / تنفيذ سهل. (D) أثر منخفض / تنفيذ صعب.</p>","principle":"الأثر المرتفع مع سهولة التنفيذ مرشح قوي للبدء، والأثر المرتفع الصعب يُدرس حسب الموارد.","hint":"<p>ابدأ بما يجمع أكبر أثر بأقل جهد.</p>","why":"يدرّب على استخدام المصفوفة كأداة قرار.","model":"<p>A مرشحة قوية للبدء، مع إمكانية دراسة B حسب الموارد والاستراتيجية، وD تؤجل غالبًا.</p>","chart":{"kind":"matrix","items":["سهولة التنفيذ","الأثر المتوقع","B","A ✓","D","C"]},"axis":"a15"},{"id":"a15e8","title":"قرار بعد الاختبار","icon":"🧮","mode":"group","format":"text","steps":["قيّموا حجم التحسن.","حللوا المشكلة الجديدة.","اختاروا القرار وبرروه."],"scenario":"<p>تم تبسيط الدفع. النتيجة: الانسحاب انخفض قليلًا، والإتمام تحسن بنسبة محدودة، وظهرت شكاوى جديدة حول خيارات الدفع.</p>","principle":"التحسن المحدود مع أثر جانبي يستدعي التعديل ومواصلة الاختبار، لا الاعتماد الكامل ولا الإلغاء.","task":"<p>هل نعتمد التغيير بالكامل؟ نلغيه؟ أم نعدله ونواصل الاختبار؟ اكتبوا قراركم مع التبرير.</p>","why":"يدرّب على اتخاذ القرار في منطقة رمادية، وهي الحالة الأكثر شيوعًا فعليًا.","model":"<p>الخيار الثالث (تعديل ومواصلة الاختبار)، مع تحليل أثر التغيير والمشكلة الجديدة (خيارات الدفع) قبل اتخاذ قرار نهائي.</p>","axis":"a15"},{"id":"a15e9","title":"لعبة «مدير التحسين»","icon":"🎮","mode":"group","format":"text","steps":["اختاروا مشكلتين فقط.","لكل واحدة: لماذا؟ الدليل؟ الفرضية؟ المؤشر؟","استعدوا للدفاع عن اختياركم."],"scenario":"<p>أمامكم 5 مشكلات: بطء صفحة المنتج، ضعف الإضافة للسلة، ارتفاع الانسحاب في الدفع، انخفاض التفاعل مع الرسائل، انخفاض تكرار الشراء.</p>","principle":"ترتيب الأولويات يعني اختيار ما نبدأ به بدل محاولة معالجة كل شيء في الوقت نفسه.","task":"<p>اكتبوا المشكلتين اللتين ستبدؤون بهما، ولكل واحدة: لماذا؟ ما الدليل الذي تحتاجونه؟ ما الفرضية؟ ما المؤشر؟</p>","why":"يدرّب على الاختيار وترتيب الأولويات تحت قيد الموارد.","model":"<p>مثال: (1) ارتفاع الانسحاب في الدفع — الأقرب للإيراد؛ الدليل: الانسحاب حسب الخطوة؛ الفرضية: الرسوم تظهر متأخرة؛ المؤشر: الإتمام. (2) بطء صفحة المنتج — يؤثر على كل ما بعده؛ الدليل: زمن التحميل؛ الفرضية: الصور ثقيلة؛ المؤشر: الانتقال للسلة.</p>","axis":"a15"},{"id":"a15e10","title":"غرفة عمليات التطبيق","icon":"🛰️","mode":"group","format":"text","steps":["ابنوا خطة من 7 خطوات.","اربطوا كل خطوة بالمعطيات.","جهزوا عرضًا في 5 دقائق."],"scenario":"<p>تطبيق افتراضي: الزيارات مستقرة، مشاهدة المنتجات جيدة، الإضافة للسلة أقل من المتوقع، بدء الدفع جيد، الإتمام منخفض، شكاوى المستخدمين ترتفع، بعضهم يذكر عدم وضوح الرسوم، وبعضهم يواجه بطئًا في الخطوة الأخيرة.</p>","principle":"الخطة المتكاملة تربط تحديد المشكلة بالبيانات والانحراف والفرضية والتحسين والمؤشر والقرار.","task":"<p>ابنوا خطة من 7 خطوات: تحديد المشكلة الأساسية، تحديد البيانات المطلوبة، تحديد نقطة الانحراف، صياغة فرضية، اقتراح تحسين، تحديد مؤشر القياس، تحديد القرار المحتمل بعد الاختبار.</p>","why":"المشروع الختامي للوحدة (16 درجة): المشكلة، قراءة البيانات، الانحراف، الفرضية، منطق التحسين، المؤشر، ترابط الخطة، وضوح العرض.","model":"<p>مثال: المشكلة: الإتمام منخفض رغم بدء دفع جيد. البيانات: الانسحاب حسب الخطوة وزمن التحميل. الانحراف: بين بدء الدفع والإتمام. الفرضية: الرسوم غير الواضحة والبطء في الخطوة الأخيرة. التحسين: إجمالي شامل مبكر وتسريع التأكيد. المؤشر: الإتمام. القرار: اعتماد/تعديل/عودة للتحليل حسب النتيجة.</p>","axis":"a15"},{"id":"a15e11","title":"من الرقم إلى القرار","icon":"🔗","mode":"group","format":"text","steps":["اقرؤوا الأرقام كقصة واحدة.","حوّلوها إلى سلسلة من ستة أسئلة.","انتهوا بطريقة قياس."],"scenario":"<p>Dashboard مختصر: الزيارات +12%، مشاهدة المنتج +8%، الإضافة للسلة -4%، بدء الدفع -6%، الإتمام -18%، الانسحاب في الدفع +21%.</p>","principle":"البيانات لا تنتهي عند التقرير: البيانات ← قرار ← تغيير ← قياس ← تعلم.","chart":{"kind":"bars","items":["الزيارات::12","مشاهدة المنتج::8","الإضافة للسلة::-4","بدء الدفع::-6","الإتمام::-18","الانسحاب في الدفع::21"]},"task":"<p>حوّلوا الأرقام إلى سلسلة: ماذا نرى؟ ← أين المشكلة؟ ← ما الذي نحتاج إلى معرفته؟ ← ما الفرضية؟ ← ما التحسين المقترح؟ ← كيف نقيسه؟</p>","why":"النشاط الختامي للوحدة الخامسة؛ يربط المحاور الثلاثة في نشاط واحد.","model":"<p>نرى: نموًا في أعلى القمع وتراجعًا متزايدًا في أسفله. المشكلة: الدفع (انسحاب +21%). نحتاج: الانسحاب حسب الخطوة والجهاز. الفرضية: تغيير حديث في الدفع (رسوم أو خطوات). التحسين: إعادة تبسيط الدفع وإظهار الرسوم مبكرًا. القياس: الإتمام والانسحاب في الدفع خلال أسبوعين.</p>","axis":"a15"}],"highlights":["من المشكلة إلى فرضية قابلة للاختبار","عناصر خطة التحسين الثمانية","مصفوفة الأولويات","القرار المبني على التعلم"],"unit":5,"icon":"loop","color":14,"scene":"loop","title":"دورة لا تتوقف","classic":"بناء منهجية تحسين مستمر واتخاذ قرارات تطوير داخل التطبيق","duration":"120 دقيقة","desc":"<p>التطبيق التجاري يتغير باستمرار؛ المستخدم والسلوك والمنتجات والعروض والمنافسة والتقنية. لذلك لا يكفي تحسين واحد ثم التوقف. نبني هنا منهجية: فرضية، خطة تحسين، أولويات، قرار بعد الاختبار، وتعلّم مستمر.</p>"},{"id":"a16","slides":[{"type":"opening","title":"مساعد ذكي... لا مدير بديل","text":"<p>كل ما تعلمناه في الوحدات الخمس — فهم السلوك، والتدخل التسويقي، والبنية، والدفع، والتحسين المستمر — يمكن أن يتسارع بالذكاء الاصطناعي. لكنه يسرّع الطريق ولا يختاره؛ يقترح ولا يقرر.</p>","rule":"<p>الذكاء الاصطناعي يوسّع قدرة الفريق على الرؤية والتجربة، والإنسان يبقى مسؤولًا عن الحكم والقرار.</p>","chart":{"kind":"compare","items":["🤖 الذكاء الاصطناعي :: يحلل كميات ضخمة ; يقترح أنماطًا ; يولّد مسودات ; يتنبأ باحتمالات","🧑‍💼 المتخصص البشري :: يفهم السياق ; يوازن القيم والمخاطر ; يتخذ القرار ; يتحمل المسؤولية"]},"id":"a16s1"},{"type":"principle","title":"أين يضيف الذكاء الاصطناعي قيمة في رحلة الشراء؟","points":["الاكتشاف: بحث ذكي يفهم نية المستخدم والأخطاء الإملائية والبحث بالصورة.","التقييم: توصيات مرتبطة بالسلوك وملخصات للتقييمات.","التسويق: تخصيص الرسائل واختيار التوقيت الأنسب لكل مستخدم.","الدفع: رصد الاحتيال وتقليل الرفض الخاطئ للمعاملات.","ما بعد الشراء: مساعد محادثة للرد على الأسئلة المتكررة وتتبع الطلب.","التحليل: اكتشاف الانحرافات وتلخيص جلسات المستخدمين والتنبؤ بالانسحاب."],"intro":"<p>يمكن توظيف الذكاء الاصطناعي في كل مرحلة من مراحل الرحلة التي درسناها:</p>","chart":{"kind":"steps","items":["الاكتشاف::بحث ذكي","التقييم::توصيات وملخصات","التسويق::تخصيص وتوقيت","الدفع::رصد الاحتيال","ما بعد الشراء::مساعد محادثة","التحليل::انحرافات وتنبؤ"]},"id":"a16s2"},{"type":"tools","title":"أدوات ومنصات الذكاء الاصطناعي وتطبيقاتها","items":["مساعدات النماذج اللغوية (Claude، ChatGPT، Gemini)::صياغة رسائل داخل التطبيق بنسخ متعددة، تلخيص تقييمات العملاء وشكاواهم، كتابة أوصاف منتجات، وتوليد فرضيات للاختبار.","Google Analytics 4 وFirebase::مؤشرات تنبؤية (مثل احتمال الشراء أو الانقطاع) واكتشاف تلقائي للتغيرات غير المعتادة في البيانات.","Firebase A/B Testing وRemote Config::اختبار نسخ مختلفة من الشاشات والرسائل وقياس أثرها على التحويل.","Microsoft Clarity وHotjar::تسجيلات جلسات وخرائط حرارية مع ملخصات آلية تكشف مواضع الارتباك والنقرات الغاضبة.","Amplitude وMixpanel::تحليل رحلات المستخدمين والقمع مع مساعدات تجيب عن أسئلة البيانات بلغة طبيعية.","منصات التفاعل (Braze، CleverTap، OneSignal)::تقسيم المستخدمين واختيار التوقيت الذكي للإشعارات والرسائل داخل التطبيق.","البحث والتوصيات (Algolia، Google Vertex AI Search for Commerce)::بحث يفهم النية وتوصيات مخصصة حسب السلوك."],"id":"a16s3"},{"type":"examples","title":"اقتراحات استخدام عملية","items":["صياغة الرسائل::اطلب من النموذج 5 صيغ لرسالة سلة متروكة، ثم اختبر أفضل صيغتين فعليًا بدل الاختيار بالذوق.","تحليل الشكاوى::ألصق 200 تعليق من المتجر واطلب تصنيفها حسب مرحلة الرحلة (بحث، منتج، دفع، توصيل).","توليد الفرضيات::اعرض أرقام القمع واطلب 5 فرضيات قابلة للاختبار، ثم رتبها أنت بمصفوفة الأولويات.","مراجعة الشاشات::صِف شاشة الدفع واطلب نقاط الاحتكاك المحتملة وفق قائمة الفحص التي درسناها.","المحتوى::حوّل المواصفات التقنية إلى عبارة قيمة واضحة («بطارية تكفي يومين»)، ثم راجع دقتها بشريًا."],"id":"a16s4"},{"type":"mistakes","title":"متى لا يصح الاعتماد الكلي على الذكاء الاصطناعي؟","items":["اعتماد أرقام أو حقائق يولّدها النموذج دون تحقق::تحقق دائمًا من البيانات الفعلية؛ النماذج قد «تهلوس» أرقامًا مقنعة.","ترك التخصيص يعمل بلا ضوابط::ضع سقفًا للتكرار وحدودًا للخصوصية؛ الإفراط يتحول إلى ضوضاء أو اختراق للثقة.","إدخال بيانات العملاء الحساسة في أدوات عامة::أخفِ الهوية والبيانات المالية، والتزم بسياسات الخصوصية والأنظمة المحلية.","قرارات تسعير أو رفض مدفوعات آلية بالكامل::يلزم إشراف بشري ومراجعة للحالات الحدية وأثرها على العدالة والسمعة.","مساعد محادثة بلا مخرج بشري::وفّر دائمًا طريقًا واضحًا للتواصل مع موظف في الحالات المعقدة أو الحساسة.","تفسير الانحرافات آليًا كأسباب مؤكدة::الأداة تكشف أين؛ والمحلل البشري يختبر لماذا."],"id":"a16s5"},{"type":"principle","title":"متى يأتي دور المتخصص البشري؟","points":["تحديد الأهداف والأولويات التجارية للتطبيق.","الحكم على الفرضيات واختيار ما يُختبر.","تقدير الأثر على الثقة والسمعة وتجربة العميل.","الالتزام بالخصوصية والأنظمة والقيم.","التعامل مع العملاء في الحالات الحساسة أو الاستثنائية.","اعتماد القرار النهائي بعد قراءة نتائج الاختبار."],"intro":"<p>هناك قرارات لا يجوز تفويضها للآلة بالكامل، لأنها تتطلب فهم السياق أو تحمّل المسؤولية:</p>","rule":"<p>القاعدة: الآلة تقترح وتسرّع، والمتخصص يتحقق ويقرر ويتحمل المسؤولية.</p>","chart":{"kind":"balance","items":["سرعة الآلة وقدرتها","حكم الإنسان ومسؤوليته"]},"id":"a16s6"},{"type":"summary","title":"الذكاء الاصطناعي في منظومة التحول","text":"<p>الذكاء الاصطناعي ليس وحدة سادسة منفصلة، بل طبقة تعمل فوق المنظومة كلها: يقرأ السلوك أسرع، ويقترح تدخلات أدق، ويكشف الانحرافات مبكرًا، ويقترح فرضيات أكثر. لكن قيمته تتضاعف فقط عندما يوجهه فريق يعرف ماذا يسأل، ويتحقق مما يحصل عليه، ويقيس الأثر قبل الاعتماد.</p>","rule":"<p>اسأل بذكاء، تحقّق بدقة، اختبر قبل الاعتماد، والقرار لك.</p>","chart":{"kind":"cycle","items":["اسأل","ولّد","تحقّق","اختبر","قِس","قرّر"]},"id":"a16s7"}],"exercises":[{"id":"a16e1","title":"مساعدك الذكي في غرفة العمليات","icon":"🤖","mode":"individual","format":"text","steps":["حدد مهمتين تفوضهما للمساعد الذكي.","اكتب الطلب (Prompt) لكل مهمة بوضوح.","حدد كيف ستتحقق من المخرجات قبل استخدامها."],"scenario":"<p>أنت مسؤول تحسين تطبيق تجاري. لديك أرقام قمع تحويل تُظهر انسحابًا مرتفعًا في الدفع، و150 تعليقًا من متجر التطبيقات، ومساعد ذكاء اصطناعي متاح.</p>","principle":"قيمة الذكاء الاصطناعي تعتمد على جودة السؤال، وعلى التحقق البشري من المخرجات قبل استخدامها.","task":"<p>اكتب: مهمتين تفوضهما للذكاء الاصطناعي، ونص الطلب لكل منهما، وطريقة تحققك من النتائج، وقرارًا واحدًا لن تفوضه أبدًا ولماذا.</p>","why":"ينقل الذكاء الاصطناعي من فكرة عامة إلى استخدام عملي مسؤول في سياق التحليل.","model":"<p>مثال: (1) «صنّف هذه التعليقات حسب مرحلة الرحلة واذكر أكثر 3 شكاوى تكرارًا مع عدد كل منها» — التحقق: مراجعة عينة من 20 تعليقًا يدويًا. (2) «اقترح 5 فرضيات قابلة للاختبار لارتفاع الانسحاب في الدفع» — التحقق: مطابقتها مع بيانات الانسحاب حسب الخطوة. قرار لا أفوضه: اعتماد التغيير النهائي بعد الاختبار، لأنه يتطلب موازنة الأثر على الثقة والإيراد.</p>","axis":"a16"},{"id":"a16e2","title":"اختر الأداة المناسبة","icon":"🧰","mode":"individual","format":"mcq","steps":[],"items":[{"q":"كتابة 5 صيغ مختلفة لرسالة سلة متروكة.","options":["مساعد نموذج لغوي","منصة اختبار A/B","خرائط حرارية","منصة رصد احتيال"],"answer":0},{"q":"فهم أين يرتبك المستخدمون في شاشة الدفع بصريًا.","options":["مساعد نموذج لغوي","تسجيلات الجلسات والخرائط الحرارية","منصة إشعارات","بحث ذكي"],"answer":1},{"q":"التأكد من أن الصيغة الجديدة للزر ترفع التحويل فعلًا.","options":["مساعد نموذج لغوي","خرائط حرارية","منصة اختبار A/B","منصة إشعارات"],"answer":2},{"q":"إرسال الإشعار في التوقيت الأنسب لكل مستخدم.","options":["خرائط حرارية","منصة التفاعل والإشعارات","منصة اختبار A/B","مساعد نموذج لغوي"],"answer":1},{"q":"معرفة المستخدمين الأكثر احتمالًا للانقطاع خلال الأسبوع القادم.","options":["المؤشرات التنبؤية في منصة التحليلات","خرائط حرارية","منصة اختبار A/B","بحث ذكي"],"answer":0}],"scenario":"<p>خمسة احتياجات لفريق تطبيق تجاري. اختر فئة الأداة الأنسب لكل احتياج.</p>","principle":"لكل احتياج فئة أدوات؛ اختيار الأداة يبدأ من السؤال لا من شهرة الأداة.","hint":"<p>فكّر في طبيعة المهمة: كتابة؟ اختبار؟ تحليل سلوك؟ تواصل؟</p>","why":"يربط خريطة الأدوات باحتياجات عملية واضحة.","model":"<p>1: نموذج لغوي. 2: تسجيلات الجلسات والخرائط الحرارية. 3: منصة اختبار A/B. 4: منصة التفاعل والإشعارات. 5: المؤشرات التنبؤية في منصة التحليلات.</p>","axis":"a16"},{"id":"a16e3","title":"صح أم خطأ: حدود الذكاء الاصطناعي","icon":"⚠️","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"الأرقام التي يقدمها النموذج اللغوي دقيقة دائمًا ولا تحتاج إلى تحقق.","answer":false},{"q":"يمكن للذكاء الاصطناعي تسريع تصنيف آلاف التعليقات حسب مرحلة الرحلة.","answer":true},{"q":"كلما زاد التخصيص الآلي زادت الثقة بالضرورة.","answer":false},{"q":"مساعد المحادثة يجب أن يوفّر طريقًا للتواصل مع موظف بشري.","answer":true},{"q":"يمكن إدخال بيانات بطاقات العملاء في أي أداة ذكاء اصطناعي عامة للتحليل.","answer":false},{"q":"اكتشاف الانحراف آليًا لا يعني معرفة سببه.","answer":true},{"q":"اختبار A/B يبقى ضروريًا حتى للرسائل التي اقترحها الذكاء الاصطناعي.","answer":true},{"q":"القرار النهائي في التسعير يمكن تركه للآلة دون أي مراجعة.","answer":false}],"principle":"الذكاء الاصطناعي أداة قوية تحتاج إلى تحقق وضوابط وإشراف بشري.","hint":"<p>احذر العبارات التي تم   // ---------- compare (عمودان متقابلان) ----------
  function compare(items, c) {

    });

    body += fo(W / 2 - 24, cy - 16, 48, 32, 'مقابل', { fs: 11.5, weight: 700, align: 'center', pad: '0', color: c.dark });

  // ---------- hub (عنصر مركزي + عمودان يمين ويسار) ----------

  // ---------- cycle (مسار حلقي بعمودين بدل التوزيع الدائري) ----------

  // ---------- steps (قائمة خطوات مرقّمة) ----------

  // ---------- bars (أعمدة أفقية تدعم القيم السالبة) ----------

  // ---------- balance (ميزان) ----------
  function balance(items, c) {
    const a = parseItem(items[0]), b = parseItem(items[1] || ''); let body = '';

    body += '<path d="M110 62 L490 62" stroke="#15122B" stroke-width="5" stroke-linecap="round"/><circle cx="300" cy="40" r="12" fill="' + c.color + '"/>';
    body += '<path d="M150 62 L100 130 M150 62 L200 130 M450 62 L400 130 M450 62 L500 130" stroke="#8A85A3" stroke-width="2"/>';

const Progress = {

  forUser(uid) {

      const exs = Content.exercisesOf(a.id); const done = exs.filter(e => Progress.exDone(e, uid)).length;

    });

  let sel = null; if (actKey && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd];
  root.innerHTML = html;
  $$('[data-keep]', root).forEach(el => { const k = keep[el.getAttribute('data-keep')]; if (!k) return; if (k.html != null) el.innerHTML = k.html; else if (el.type !== 'file') el.value = k.v; });
  if (actKey) { const el = $('[data-keep="' + actKey + '"]', root); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}

// ---------- تنسيق نصوص الشرائح تلقائيًا ----------
function boldTerm(text) { // يبرز المصطلح قبل ":" أو "—" تلقائيًا
  const t = String(text || ''); const m = t.match(/^(.{2,70}?)(\s*[:：]\s*|\s+—\s+|\s+-\s+)(.+)$/);
  return m ? '<b>' + h(m[1]) + '</b>' + h(m[2]) + h(m[3]) : h(t);
}
function withLede(html) { // أول جملة من الفقرة بخط عريض
  if (!html) return '';
  const d = document.createElement('div'); d.innerHTML = html; const p = d.querySelector('p') || d;
  const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT); const tn = walker.nextNode();
  if (!tn) return html;
  const m = tn.nodeValue.match(/^(.*?[.؟?!:،](?=\s|$))(\s*)([\s\S]*)$/);
  if (!m || m[1].length < 8) { if (p.firstChild === tn || true) { const b = document.createElement('span'); b.className = 'lede'; tn.parentNode.insertBefore(b, tn); b.appendChild(tn); } return d.innerHTML; }
  const b = document.createElement('span'); b.className = 'lede'; b.textContent = m[1];
  tn.parentNode.insertBefore(b, tn); tn.nodeValue = m[2] + m[3];
  return d.innerHTML;
}
function richHtml(v) { if (!v) return ''; return /<[a-z][\s\S]*>/i.test(v) ? sanitize(v) : h(v).replace(/\n/g, '<br>'); }
function sanitize(html) { // تنظيف بسيط لمحتوى المحرر
  const d = document.createElement('div'); d.innerHTML = html;
  $$('script,style,iframe,object,embed', d).forEach(x => x.remove());
  $$('*', d).forEach(el => { [...el.attributes].forEach(a => { if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name); }); });
  return d.innerHTML;
}

// ---------- الفيديو المضمَّن ----------
function toEmbed(url) {
  if (!url) return null; const u = String(url).trim(); let m;
  if ((m = u.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/))) return 'https://www.youtube.com/embed/' + m[1];
  if ((m = u.match(/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]+)/))) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  if ((m = u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([A-Za-z0-9_-]+)/))) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return null;
}
function mediaHtml(s) {
  let out = '';
  if (s.videoUrl) { const em = toEmbed(s.videoUrl); out += em ? '<div class="video-box"><iframe src="' + h(em) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' : '<div class="slide-links"><a class="btn btn-ghost btn-sm" href="' + h(s.videoUrl) + '" target="_blank" rel="noopener">' + iconSvg('play', 16) + ' مشاهدة الفيديو</a></div>'; }
  if (s.srcUrl) out += '<div class="slide-links"><a class="btn btn-soft btn-sm" href="' + h(/^https?:/.test(s.srcUrl) ? s.srcUrl : 'https://' + s.srcUrl) + '" target="_blank" rel="noopener">' + iconSvg('link', 15) + ' ' + h(s.srcLabel || 'مصدر للتوسع') + '</a></div>';
  return out;
}

// ---------- عرض شريحة ----------
function renderSlide(s, a, i, n) {
  const col = Content.color(a); const type = SLIDE_TYPES[s.type] ? s.type : 'principle';
  let text = '', visual = '';
  const chart = s.chart ? Charts.render(s.chart, col) : '';
  const rule = s.rule ? '<div class="rule-box"><span class="lbl">' + (type === 'opening' || type === 'summary' ? '📌 قاعدة تذكّرها' : '💡 الرسالة') + '</span>' + richHtml(s.rule) + '</div>' : '';
  if (type === 'opening' || type === 'summary') {
    text = '<div class="slide-text">' + withLede(richHtml(s.text)) + '</div>' + rule;
    const sc = Scenes.render(a.scene || 'idea', col, type === 'summary' ? { style: 'max-width:300px;margin:0 auto' } : {});
    visual = sc + (chart ? '<div style="margin-top:14px">' + chart + '</div>' : '');
  } else if (type === 'principle') {
    text = '<div class="slide-text">' + richHtml(s.intro) + '</div>' + (s.points && s.points.length ? '<ul class="points">' + s.points.map((p, k) => '<li><span class="n num">' + (k + 1) + '</span><span>' + boldTerm(p) + '</span></li>').join('') + '</ul>' : '') + rule;
    visual = chart || Scenes.render('idea', col);
  } else {
    const cls = type === 'mistakes' ? 'mis' : type === 'tools' ? 'tool' : '';
    text = '<div class="pairs">' + (s.items || []).map(it => { const k = String(it).indexOf('::'); const hd = k > -1 ? it.slice(0, k) : it, bd = k > -1 ? it.slice(k + 2) : ''; return '<div class="pair ' + cls + '"><div class="h">' + h(hd.trim()) + '</div>' + (bd ? '<div class="b">' + h(bd.trim()) + '</div>' : '') + '</div>'; }).join('') + '</div>' + rule;
    visual = chart || Scenes.render(type === 'mistakes' ? 'mistakes' : type === 'tools' ? 'tools' : (a.scene || 'idea'), col);
  }
  return '<div class="slide" style="--ac:' + col + ';--acg:' + tint(col, .1) + '">' +
    '<span class="slide-type">' + h(SLIDE_TYPES[type]) + ' · <span class="num">' + (i + 1) + '/' + n + '</span></span>' +
    (s.image ? '<img class="slide-img" src="' + s.image + '" alt="">' : '') +
    '<h2>' + h(s.title) + '</h2>' +
    '<div class="slide-grid"><div>' + text + mediaHtml(s) + '</div><div class="slide-visual">' + visual + '</div></div></div>';
}

// ---------- محرر النص المنسّق (contenteditable) ----------
// نمط ثابت: تتبّع آخر نطاق تحديد داخل المحرر واستعادته عند استخدام أي أداة،
// دون أي preventDefault على عناصر التحكم الأصلية (القوائم المنسدلة، منتقي اللون...).
const RTE = {
  ranges: {},
  html(key, value, ph = '') {
    return '<div class="rte" data-rte="' + h(key) + '"><div class="rte-bar">' +
      '<select data-rte-cmd="fontSize" title="حجم الخط"><option value="">الحجم</option><option value="2">صغير</option><option value="3">عادي</option><option value="4">متوسط</option><option value="5">كبير</option><option value="6">كبير جدًا</option></select>' +
      '<input type="color" data-rte-cmd="foreColor" value="#5B3DF5" title="لون النص">' +
      '<span class="sep"></span><button type="button" data-rte-btn="bold" title="عريض"><b>B</b></button><button type="button" data-rte-btn="italic" title="مائل"><i>I</i></button><button type="button" data-rte-btn="underline" title="تسطير"><u>U</u></button>' +
      '<span class="sep"></span><button type="button" data-rte-btn="justifyRight" title="محاذاة يمين">⇥</button><button type="button" data-rte-btn="justifyCenter" title="توسيط">≡</button><button type="button" data-rte-btn="justifyLeft" title="محاذاة يسار">⇤</button>' +
      '<span class="sep"></span><button type="button" data-rte-btn="insertUnorderedList" title="قائمة نقطية">•</button><button type="button" data-rte-btn="insertOrderedList" title="قائمة رقمية">1.</button>' +
      '<span class="sep"></span><button type="button" data-rte-btn="removeFormat" title="مسح التنسيق">⌫</button>' +
      '</div><div class="rte-area" contenteditable="true" dir="rtl" data-rte-area="' + h(key) + '" data-ph="' + h(ph) + '">' + (value ? sanitize(richHtml(value)) : '') + '</div></div>';
  },
  track(area) { try { const sel = window.getSelection(); if (sel.rangeCount && area.contains(sel.anchorNode)) RTE.ranges[area.getAttribute('data-rte-area')] = sel.getRangeAt(0).cloneRange(); } catch (e) {} },
  restore(key, area) {
    const r = RTE.ranges[key]; area.focus();
    try { const sel = window.getSelection(); sel.removeAllRanges(); if (r) sel.addRange(r); else { const rr = document.createRange(); rr.selectNodeContents(area); rr.collapse(false); sel.addRange(rr); } } catch (e) {}
  },
  mount(root) {
    $$('[data-rte-area]', root).forEach(area => { ['keyup', 'mouseup', 'input', 'focus', 'touchend'].forEach(ev => area.addEventListener(ev, () => RTE.track(area))); });
    $$('[data-rte]', root).forEach(box => {
      const key = box.getAttribute('data-rte'); const area = $('[data-rte-area]', box);
      $$('[data-rte-btn]', box).forEach(b => b.addEventListener('click', () => { RTE.restore(key, area); try { document.execCommand(b.getAttribute('data-rte-btn'), false, null); if (b.getAttribute('data-rte-btn') === 'removeFormat') document.execCommand('unlink', false, null); } catch (e) {} RTE.track(area); }));
      $$('[data-rte-cmd]', box).forEach(ctrl => ctrl.addEventListener('change', () => { const v = ctrl.value; if (!v) return; RTE.restore(key, area); try { document.execCommand('styleWithCSS', false, ctrl.getAttribute('data-rte-cmd') === 'foreColor'); document.execCommand(ctrl.getAttribute('data-rte-cmd'), false, v); } catch (e) {} RTE.track(area); if (ctrl.tagName === 'SELECT') ctrl.value = ''; }));
    });
  },
  val(root, key) { const a = $('[data-rte-area="' + key + '"]', root); if (!a) return ''; const v = sanitize(a.innerHTML).trim(); return stripHtml(v) ? v : ''; }
};

// ---------- رفع الصور (Base64 داخل قاعدة البيانات) — البيانات في متغيّر JS لا في خاصية HTML ----------
const ImgPick = {
  data: {},
  html(key, current) {
    ImgPick.data[key] = current || '';
    return '<div class="img-pick" data-img="' + h(key) + '"><img class="thumb" data-img-thumb alt=""><label class="btn btn-ghost btn-sm">📷 اختيار صورة<input type="file" accept="image/*" hidden data-img-file></label><button type="button" class="btn btn-danger btn-xs" data-img-clear>إزالة</button><span class="err" data-img-err></span></div>';
  },
  mount(root) {
    $$('[data-img]', root).forEach(box => {
      const key = box.getAttribute('data-img'); const th = $('[data-img-thumb]', box), err = $('[data-img-err]', box);
      const show = () => { const v = ImgPick.data[key]; if (v) { th.src = v; th.style.display = ''; } else { th.removeAttribute('src'); th.style.display = 'none'; } };
      show();
      $('[data-img-file]', box).addEventListener('change', e => {
        const f = e.target.files && e.target.files[0]; err.textContent = ''; if (!f) return;
        if (!/^image\//.test(f.type)) { err.textContent = 'نوع الملف غير صالح — الصور فقط.'; e.target.value = ''; return; }
        if (f.size > MAX_IMG_MB * 1024 * 1024) { err.textContent = 'تجاوز الحجم المسموح (' + MAX_IMG_MB + ' ميجابايت كحد أقصى).'; e.target.value = ''; return; }
        const rd = new FileReader(); rd.onload = () => { ImgPick.data[key] = rd.result; show(); }; rd.readAsDataURL(f);
      });
      $('[data-img-clear]', box).addEventListener('click', () => { ImgPick.data[key] = ''; show(); });
    });
  },
  val(key) { return ImgPick.data[key] || ''; }
};

function decorShapes(seed, op = .16) {

  let out = '<svg class="decor" viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">';
  for (let i = 0; i < 7; i++) { const x = rnd() * 300, y = rnd() * 150, r = 10 + rnd() * 34; out += rnd() > .5 ? '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + r.toFixed(0) + '" fill="#fff" opacity="' + (op * (0.5 + rnd())).toFixed(2) + '"/>' : '<rect x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + (r * 1.4).toFixed(0) + '" height="' + (r * 1.4).toFixed(0) + '" rx="' + (r * .35).toFixed(0) + '" fill="#fff" opacity="' + (op * (0.5 + rnd())).toFixed(2) + '" transform="rotate(' + (rnd() * 40 - 20).toFixed(0) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')"/>'; }

}

  after(root) {

    vp.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) Deck.move(id, dx > 0 ? 1 : -1); }, { passive: true });
    let mx = null; vp.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') mx = e.clientX; });
    vp.addEventListener('pointerup', e => { if (mx == null) return; const dx = e.clientX - mx; mx = null; if (Math.abs(dx) > 80) Deck.move(id, dx > 0 ? 1 : -1); });
  }
};
const Deck = {
  move(id, d) { const a = Content.axis(id); if (!a) return; const n = a.slides.length; Deck.to(id, Math.max(0, Math.min(n - 1, (UIState.deck[id] || 0) + d))); },

  fitHeight(id) { const deck = $('[data-deck="' + id + '"]'); if (!deck) return; const s = $$('.slide', deck)[UIState.deck[id] || 0]; if (s) $('.deck-viewport', deck).style.height = s.offsetHeight + 'px'; }
};

  mcq: ['اقرأ كل سؤال بتمعّن.', 'اختر إجابة واحدة لكل سؤال.', 'اضغط «حفظ الإجابات» ثم تابع إجابات زملائك مباشرة.'],
  truefalse: ['اقرأ كل عبارة بدقة.', 'حدد «صح» أو «خطأ» لكل عبارة.', 'اضغط «حفظ الإجابات» ثم تابع إجابات زملائك مباشرة.'],
  fillblank: ['اختر مجموعتك أولًا من البطاقة أعلاه.', 'اضغط كلمة من البنك ثم اضغط الفراغ المناسب لها.', 'لتصحيح فراغ ممتلئ، اضغط عليه فيُفرَغ وتعود كلمته إلى البنك.', 'اضغط «حفظ وإرسال إجابات المجموعة».'],
  comparePairs: ['اختر مجموعتك أولًا من البطاقة أعلاه.', 'في كل زوج اختر العبارة الأدق: (أ) أو (ب).', 'اضغط «حفظ وإرسال إجابات المجموعة».'],
  text: ['اقرأ الموقف جيدًا.', 'اكتب إجابتك في الصندوق.', 'اضغط «حفظ» وتابع مشاركات زملائك مباشرة.']
};
function exColor(e) { const ax = Content.axisOfEx(e.id); const a = ax && Content.axis(ax); return a ? Content.color(a) : (e.kind === 'survey' ? '#FF3D8B' : '#FF7A1A'); }
function postKey(e) { if (e.mode === 'group') { const g = Me.group(); return g ? 'g' + g : null; } return Me.uid(); }
function isRevealed(e) { return !!(Store.reveal && Store.reveal[e.id]); }
function bankOf(e) { // بنك كلمات بترتيب ثابت مخلوط حسب معرّف التمرين
  const words = e.items.map(i => i.answer); let s = 0; for (const ch of e.id) s = (s * 33 + ch.charCodeAt(0)) % 100003;
  const out = words.slice(); for (let i = out.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; } return out;
}
const LETTERS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];
