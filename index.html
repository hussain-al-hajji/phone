<!DOCTYPE html>
<!--
  التحول التجاري عبر الهاتف المحمول — ورشة تفاعلية مباشرة
  ملف HTML واحد قائم بذاته (Vanilla JS) + Firebase Realtime Database
  الاتصال الحقيقي يعتمد على databaseURL في firebaseConfig (أسفل الملف).
  لمعاينة محلية دون لمس قاعدة البيانات الحقيقية أضف ?demo=1 إلى الرابط.
  يُستضاف كملف HTML عادي (Netlify Drop مثلًا، أو Google Sites بخيار Embed URL).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B3DF5">
<title>التحول التجاري عبر الهاتف المحمول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F5F3FB;
  --bg-dots:#E6E1F5;
  --surface:#FFFFFF;
  --surface-2:#FAF9FE;
  --ink:#15122B;
  --ink-2:#4A4566;
  --ink-3:#8A85A3;
  --line:#E7E3F3;
  --brand:#5B3DF5;
  --brand-2:#FF3D8B;
  --brand-3:#FFB23F;
  --mint:#10C9A4;
  --danger:#E5484D;
  --ok:#17A864;
  --ok-bg:#E6F7EE;
  --bad-bg:#FDECEC;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(30,20,80,.05),0 4px 14px rgba(40,25,110,.06);
  --sh-2:0 18px 44px rgba(40,25,110,.14);
  --f-display:'Alexandria',sans-serif;
  --f-ui:'IBM Plex Sans Arabic',sans-serif;
  --f-body:'Noto Sans Arabic','IBM Plex Sans Arabic',sans-serif;
  --grad:linear-gradient(120deg,#5B3DF5 0%,#B23CF0 45%,#FF3D8B 75%,#FFB23F 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dots) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-weight:400;line-height:1.85;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.35;color:var(--ink)}
p{margin:0 0 .5em}
p:last-child{margin-bottom:0}
button,input,select,textarea{font-family:var(--f-ui);font-size:15px}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--brand)}
ul,ol{margin:.3em 0;padding-inline-start:1.3em}
.hidden{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-3)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}

/* ---------- Buttons ---------- */
.btn{font-family:var(--f-ui);font-weight:600;font-size:15px;padding:11px 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s;white-space:nowrap;line-height:1.3;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(91,61,245,.28)}
.btn-primary:hover{box-shadow:0 10px 28px rgba(91,61,245,.38)}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:#EFEBFF;color:var(--brand)}
.btn-soft:hover{background:#E4DEFF}
.btn-ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#CFC8EA}
.btn-mint{background:#0E9F83;color:#fff}
.btn-danger{background:#FDECEC;color:#C62F35}
.btn-danger:hover{background:#FBDADB}
.btn-sm{padding:7px 13px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px;font-weight:600}
.btn-block{width:100%}
.icon-btn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);position:relative}
.icon-btn:hover{border-color:#CFC8EA}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:64px;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;flex:1}
.brand-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(91,61,245,.3)}
.brand-text{min-width:0}
.brand-title{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-size:13px;font-weight:600;max-width:220px}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.user-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:720px){.brand-sub{display:none}.user-chip .nm{display:none}.user-chip{padding:3px}.top-actions .lbl{display:none}.brand-title{font-size:14px}}

.crumbs{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:14px;color:var(--ink-2)}
.back-btn:hover{border-color:#CFC8EA}
.crumb-tag{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}

/* ---------- Banners ---------- */
.banner{padding:10px 16px;font-family:var(--f-ui);font-size:14px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;text-align:center}
.banner-iframe{background:#1F1A3D;color:#fff}
.banner-broadcast{background:var(--grad);color:#fff;font-weight:600}
.banner .x{background:rgba(255,255,255,.2);color:#fff;border-radius:999px;width:28px;height:28px}

/* ---------- Cards & sections ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.pad{padding:22px}
.section{margin:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-title{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.sec-kicker{font-family:var(--f-ui);font-size:12px;letter-spacing:.5px;font-weight:700;color:var(--brand);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-family:var(--f-ui);font-size:12.5px;font-weight:600;background:#F1EEFB;color:var(--ink-2);white-space:nowrap}

/* ---------- Hero ---------- */
.hero{position:relative;margin:22px 0 10px;border-radius:var(--r-xl);overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-2)}
.hero-cover{position:relative;background:linear-gradient(135deg,#EFEAFF,#FFE9F2 55%,#FFF4DF);line-height:0}
.hero-cover svg,.hero-cover img{width:100%;height:auto;display:block;max-height:380px;object-fit:cover}
.hero-body{padding:26px 28px 28px}
.hero h1{font-size:clamp(26px,4.4vw,42px);font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hero-desc{color:var(--ink-2);font-size:16.5px;max-width:760px;margin-top:8px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--ink)}
.stat span{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

/* ---------- Axis grid ---------- */
.axis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.axis-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;box-shadow:var(--sh-1);text-align:start}
.axis-card:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.axis-art{position:relative;height:150px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.axis-art img{width:100%;height:100%;object-fit:cover}
.axis-art .decor{position:absolute;inset:0}
.axis-art .axis-icon{position:relative;width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.axis-no{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.axis-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.axis-title{font-size:18px;font-weight:800}
.axis-classic{font-family:var(--f-ui);font-size:13px;color:var(--ink-3);line-height:1.6}
.axis-desc{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.axis-desc p{margin:0}
.axis-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.axis-card.disabled{filter:grayscale(.85);opacity:.62}
.soon-badge{position:absolute;top:12px;inset-inline-end:12px;background:#15122B;color:#fff;font-family:var(--f-ui);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;z-index:2}

/* Activities */
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;box-shadow:var(--sh-1);transition:transform .15s}
.act-card:hover{transform:translateY(-2px)}
.act-ico{font-size:26px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#FFF1D6,#FFE0EC);display:flex;align-items:center;justify-content:center;flex:none}
.act-card h3{font-size:16px}
.lab-banner{display:flex;gap:20px;align-items:center;padding:22px;border-radius:26px;background:#15122B;color:#fff;cursor:pointer;overflow:hidden;position:relative}
.lab-banner h3{color:#fff;font-size:22px}
.lab-banner p{color:#CFCBE6}
.lab-banner .lab-ico{width:74px;height:74px;border-radius:22px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}

/* ---------- Deck ---------- */
.axis-hero{display:flex;gap:18px;align-items:center;padding:20px;border-radius:26px;color:#fff;position:relative;overflow:hidden;margin-top:8px}
.axis-hero h1{color:#fff;font-size:clamp(22px,3.4vw,32px)}
.axis-hero .sub{opacity:.9;font-family:var(--f-ui);font-size:14px}
.axis-hero .big-ico{width:70px;height:70px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.deck{margin-top:18px;background:var(--surface);border-radius:28px;border:1px solid var(--line);box-shadow:var(--sh-2);overflow:hidden;position:relative}
.deck-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.deck-dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.deck-dot{height:6px;flex:1;min-width:8px;max-width:40px;border-radius:6px;background:#E5E1F2;cursor:pointer;transition:background .2s}
.deck-dot.on{background:var(--ac,var(--brand))}
.deck-count{font-family:var(--f-ui);font-weight:700;font-size:13px;color:var(--ink-3)}
.deck-viewport{overflow:hidden;touch-action:pan-y;transition:height .35s ease}
.deck-track{display:flex;align-items:flex-start;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.slide{flex:0 0 100%;min-width:0;padding:26px 28px 30px}
.slide-type{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff;background:var(--ac,var(--brand));margin-bottom:10px}
.slide h2{font-size:clamp(20px,2.8vw,28px);font-weight:800;margin-bottom:14px}
.slide-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:start}
.slide-grid.single{grid-template-columns:1fr}
@media (max-width:860px){.slide-grid{grid-template-columns:1fr}.slide{padding:20px 18px 24px}}
.slide-text{font-size:16.5px;color:var(--ink-2)}
.slide-text .lede{font-weight:700;color:var(--ink)}
.slide-img{width:100%;border-radius:18px;margin-bottom:16px;max-height:340px;object-fit:cover;display:block}
.rule-box{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--acg,#F1EEFF);border-inline-start:5px solid var(--ac,var(--brand));font-weight:600;color:var(--ink)}
.rule-box .lbl{display:block;font-family:var(--f-ui);font-size:12px;font-weight:700;color:var(--ac,var(--brand));margin-bottom:2px}
.points{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.points li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.points li .n{width:26px;height:26px;border-radius:9px;background:var(--ac,var(--brand));color:#fff;font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.pairs{display:grid;gap:10px;margin-top:6px}
.pair{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.pair .h{padding:9px 14px;font-weight:700;font-family:var(--f-ui);background:var(--acg,#F1EEFF);color:var(--ink)}
.pair .b{padding:10px 14px;color:var(--ink-2)}
.pair.mis .h{background:#FDECEC;color:#A12A2E}
.pair.mis .b{background:#EEFAF3;color:#146B40}
.pair.mis .b::before{content:"✓ التصحيح: ";font-weight:700}
.pair.tool .h::before{content:"🛠 ";}
.slide-visual{min-width:0}
.slide-visual svg{width:100%;height:auto;display:block}
.slide-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.video-box{position:relative;width:100%;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;margin-top:16px}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.deck-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);gap:10px}
.deck-arrow{width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.deck-arrow[disabled]{opacity:.25}
.swipe-hint{font-family:var(--f-ui);font-size:12.5px;color:var(--ink-3)}

/* ---------- Exercises list ---------- */
.ex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ex-item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;transition:transform .15s,border-color .15s}
.ex-item:hover{transform:translateY(-2px);border-color:var(--ac,#CFC8EA)}
.ex-item .ico{font-size:22px;width:46px;height:46px;border-radius:14px;background:var(--acg,#F1EEFF);display:flex;align-items:center;justify-content:center;flex:none}
.ex-item h4{font-size:15px;font-weight:700}
.ex-item .done{margin-inline-start:auto;color:var(--ok);font-size:18px}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.nav-row .btn{flex:1;min-width:150px}

/* ---------- Exercise page ---------- */
.ex-head{display:flex;gap:16px;align-items:center;margin-top:8px}
.ex-head .ico{font-size:34px;width:70px;height:70px;border-radius:22px;background:var(--acg,#F1EEFF);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.ex-head h1{font-size:clamp(21px,3vw,30px);font-weight:800}
.ex-block{margin-top:16px;padding:18px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.ex-block>.lbl{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15px;margin-bottom:8px;color:var(--ink)}
.ex-block.scenario{background:linear-gradient(135deg,#FFFDF6,#FFF6F9);border-color:#F4E3EA}
.ex-block.extract{background:var(--acg,#F1EEFF);border:none}
.ex-block.principle{border-inline-start:5px solid var(--ac,var(--brand))}
.ex-block.task{background:#15122B;color:#fff;border:none}
.ex-block.task>.lbl{color:#FFD58A}
.ex-block.task p,.ex-block.task li{color:#EDEAFB}
.ex-block.hint{background:#FFF7E6;border-color:#FBE3B1}
.steps-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps-list li{display:flex;gap:10px;align-items:flex-start}
.steps-list .n{width:26px;height:26px;border-radius:50%;background:var(--ac,var(--brand));color:#fff;font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.ex-img{width:100%;max-height:360px;object-fit:cover;border-radius:22px;margin-top:14px;display:block}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}
.model-box .model-body{margin-top:10px;padding:12px 14px;border-radius:14px;background:#EEFAF3;color:#10573A}

/* Answer box */
.answer-box{margin-top:16px;padding:18px 20px;border-radius:22px;background:var(--surface);border:2px solid var(--ac,var(--brand));box-shadow:var(--sh-1)}
.answer-box textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--f-body);font-size:15.5px;line-height:1.8;resize:vertical;background:var(--surface-2)}
.answer-box textarea:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #CFC5FF;border-color:#B7AAFF}
.answer-view{padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);white-space:pre-wrap}
.locked-note{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:#F3F1F9;color:var(--ink-3);font-family:var(--f-ui);font-weight:600}
.group-picker{margin-top:16px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.group-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.group-btn{padding:8px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:14px}
.group-btn.on{background:var(--ac,var(--brand));color:#fff;border-color:transparent}
.assign-hint{padding:10px 14px;border-radius:12px;background:#FFF7E6;border:1px solid #FBE3B1;font-family:var(--f-ui);font-size:14px;margin-top:6px}
.members-line{margin-top:10px;font-family:var(--f-ui);font-size:13.5px;color:var(--ink-2)}

/* Interactive formats */
.q-card{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);margin-top:10px}
.q-card .qt{font-weight:700;margin-bottom:8px;display:flex;gap:8px}
.q-card .qn{width:26px;height:26px;border-radius:8px;background:var(--acg,#F1EEFF);color:var(--ink);font-family:var(--f-ui);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:start;font-family:var(--f-body);font-size:15px;width:100%}
.opt:hover:not([disabled]){border-color:#B7AAFF}
.opt.sel{border-color:var(--ac,var(--brand));background:var(--acg,#F1EEFF);font-weight:600}
.opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid #C9C3DE;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.opt.sel .mk{border-color:var(--ac,var(--brand));background:var(--ac,var(--brand));color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--danger);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.tf-row{display:flex;gap:8px}
.tf-row .opt{justify-content:center;width:auto;flex:1}
.disabled-area{opacity:.55;pointer-events:none;filter:grayscale(.3)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;background:#F4F1FF;border:1px dashed #C9BEFF;margin-top:10px;min-height:52px}
.chip{padding:7px 14px;border-radius:999px;background:#fff;border:1.5px solid #D6CEFA;font-family:var(--f-ui);font-weight:600;font-size:14px}
.chip.sel{background:var(--ac,var(--brand));color:#fff;border-color:transparent}
.chip.used{opacity:.3;text-decoration:line-through}
.blank{display:inline-flex;min-width:110px;padding:2px 12px;margin:0 4px;border-radius:10px;border:2px dashed #B7AAFF;background:#fff;font-family:var(--f-ui);font-weight:700;color:var(--brand);justify-content:center;vertical-align:middle;line-height:1.7}
.blank.filled{border-style:solid;background:var(--acg,#F1EEFF)}
.blank.right{border-color:var(--ok);background:var(--ok-bg);color:#10573A}
.blank.wrong{border-color:var(--danger);background:var(--bad-bg);color:#A12A2E}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.cmp-row{grid-template-columns:1fr}}
.cmp-opt{padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);text-align:start;font-family:var(--f-body);font-size:15px;line-height:1.7;min-height:70px}
.cmp-opt b{font-family:var(--f-ui);color:var(--ink-3);display:block;font-size:12px}
.cmp-opt.sel{border-color:var(--ac,var(--brand));background:var(--acg,#F1EEFF)}
.cmp-opt.compact{padding:6px 10px;min-height:0;font-size:13.5px;line-height:1.6;border-radius:10px}
.cmp-opt.right{border-color:var(--ok);background:var(--ok-bg)}
.cmp-opt.wrong{border-color:var(--danger);background:var(--bad-bg)}
.correct-note{font-family:var(--f-ui);font-size:12.5px;color:#10573A;margin-top:4px}
.save-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.status-note{font-family:var(--f-ui);font-size:13px;color:var(--ink-3)}

/* Feed */
.feed{margin-top:18px}
.feed-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.feed-head h3{font-size:18px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#FF3D5A;box-shadow:0 0 0 0 rgba(255,61,90,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,90,.55)}70%{box-shadow:0 0 0 10px rgba(255,61,90,0)}100%{box-shadow:0 0 0 0 rgba(255,61,90,0)}}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.post{padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.post.mine{border-color:var(--ac,var(--brand));box-shadow:0 0 0 3px var(--acg,#F1EEFF)}
.post-head{display:flex;align-items:center;gap:8px}
.post-head .av{width:32px;height:32px;border-radius:50%;background:var(--acg,#F1EEFF);color:var(--ink);font-weight:700;font-family:var(--f-ui);display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.post-head .who{font-family:var(--f-ui);font-weight:700;font-size:14px;line-height:1.3}
.post-head .role{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);line-height:1.3}
.post-body{white-space:pre-wrap;font-size:15px;color:var(--ink-2)}
.post-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.like-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-ui);font-weight:600;font-size:13px}
.like-btn.on{background:#FFF0E0;border-color:#FFCF99}
.like-btn[disabled]{opacity:.6;cursor:default}
.del-btn{margin-inline-start:auto;color:#C62F35;font-size:13px;padding:3px 8px;border-radius:8px}
.del-btn:hover{background:#FDECEC}
.empty{padding:22px;border-radius:18px;border:1.5px dashed var(--line);text-align:center;color:var(--ink-3);font-family:var(--f-ui)}
.group-answers{display:grid;gap:12px;margin-top:12px}
.ga-card{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.ga-card.mine{border-color:var(--ac,var(--brand));box-shadow:0 0 0 3px var(--acg,#F1EEFF)}
.ga-card h4{font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ga-item{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ga-item:last-child{border-bottom:none}
.ga-item .qn{font-family:var(--f-ui);font-weight:700;color:var(--ink-3);min-width:22px}
.tag-ok{color:var(--ok);font-weight:700}
.tag-bad{color:var(--danger);font-weight:700}

/* ---------- Lab ---------- */
.lab-timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:22px;background:#15122B;color:#fff}
.lab-timer .clock{font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:1px;direction:ltr}
.lab-timer .muted{color:#B7B2D6}
.stage{margin-top:14px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.stage.locked{background:#F6F4FB}
.stage h3{font-size:17px;display:flex;align-items:center;gap:10px}
.stage .no{width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;font-family:var(--f-ui);font-size:14px;display:flex;align-items:center;justify-content:center}
.lock-note{margin-top:8px;font-family:var(--f-ui);font-weight:700;color:var(--ink-3)}
.lab-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lab-group{padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.lab-group h4{font-size:16px;margin-bottom:8px}
.lab-ans{padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.lab-ans .st{font-family:var(--f-ui);font-weight:700;font-size:12.5px;color:var(--brand)}

/* ---------- Account ---------- */
.progress{height:12px;border-radius:12px;background:#ECE8F7;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--grad);border-radius:12px;transition:width .5s}
.big-pct{font-family:var(--f-display);font-size:46px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.badge{text-align:center;padding:14px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative}
.badge .medal{width:84px;height:84px;margin:0 auto 8px;display:block}
.badge h5{margin:0;font-family:var(--f-ui);font-size:13px;line-height:1.5}
.badge .pct{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.badge.locked .medal{filter:grayscale(1);opacity:.35}
.badge .lock{position:absolute;top:10px;inset-inline-end:12px;font-size:14px}
.congrats-card{border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#FFF9EE,#FFF0F6 50%,#F1EDFF);border:1px solid #F1DDEA;padding:30px;text-align:center;position:relative}
.congrats-card .emo{font-size:52px}
.congrats-card h2{font-size:28px;margin:6px 0 12px}
.congrats-card .nm{font-family:var(--f-display);font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.congrats-foot{display:flex;justify-content:space-between;margin-top:18px;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);gap:10px;flex-wrap:wrap}
.notice{padding:12px 14px;border-radius:14px;background:#FFF7E6;border:1px solid #FBE3B1;font-family:var(--f-ui);font-size:14px;margin-top:12px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-family:var(--f-ui);font-weight:700;font-size:13.5px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-family:var(--f-body);font-size:15px;width:100%}
.field textarea{min-height:90px;resize:vertical;line-height:1.8}
.field .help{font-family:var(--f-ui);font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* Rich editor */
.rte{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.rte-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-bottom:1px solid var(--line);background:#fff;align-items:center}
.rte-bar button{min-width:32px;height:32px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.rte-bar button:hover{background:#F1EEFB}
.rte-bar select{height:32px;border-radius:8px;border:1px solid var(--line);padding:0 6px;font-size:13px;background:#fff}
.rte-bar input[type=color]{width:34px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.rte-bar .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.rte-area{min-height:90px;padding:10px 12px;outline:none;line-height:1.8;font-family:var(--f-body);font-size:15px}
.rte-area:focus{background:#fff}

/* Image picker */
.img-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-pick .thumb{width:84px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#F1EEFB}
.img-pick .err{color:var(--danger);font-family:var(--f-ui);font-size:12.5px}

/* ---------- Modals & toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(21,18,43,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:24px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(20,10,60,.35);animation:pop .18s}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:20px;margin-bottom:10px}
.modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#15122B;color:#fff;padding:12px 20px;border-radius:14px;font-family:var(--f-ui);font-weight:600;z-index:200;box-shadow:var(--sh-2);max-width:92vw;text-align:center;animation:pop .2s}
.float-badge{position:fixed;bottom:20px;inset-inline-start:20px;z-index:90;background:#15122B;color:#fff;padding:12px 18px;border-radius:999px;font-family:var(--f-ui);font-weight:700;box-shadow:var(--sh-2)}

/* ---------- Login ---------- */
.login{max-width:980px;margin:26px auto;display:grid;grid-template-columns:1.05fr 1fr;border-radius:30px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-2)}
.login-art{background:linear-gradient(145deg,#EDE7FF,#FFE6F1 60%,#FFF3DC);display:flex;align-items:center;justify-content:center;padding:18px}
.login-art svg{width:100%;height:auto}
.login-form{padding:30px 28px}
.login-form h1{font-size:26px;font-weight:800;margin-bottom:6px}
.or-line{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-family:var(--f-ui);font-size:13px;margin:14px 0}
.or-line::before,.or-line::after{content:"";height:1px;background:var(--line);flex:1}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-art{max-height:260px;overflow:hidden}}

/* ---------- Footer ---------- */
.footer{margin-top:60px;background:#15122B;color:#D8D4EE;padding:34px 0 26px}
.footer .wrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.footer .nm{font-family:var(--f-display);font-size:20px;font-weight:800;color:#fff}
.footer .bio{font-size:14px;max-width:560px}
.footer a{color:#FFB9D5;font-family:var(--f-ui);font-weight:600;text-decoration:none;direction:ltr}
.socials{display:flex;gap:10px;margin-top:8px}
.socials a{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:background .15s}
.socials a:hover{background:rgba(255,255,255,.18)}

/* ---------- Admin ---------- */
.admin-top{display:flex;align-items:center;gap:12px;margin:20px 0 8px;flex-wrap:wrap}
.admin-top h1{font-size:26px;font-weight:800;flex:1}
.bell-wrap{position:relative}
.bell-dot{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#FF3D5A;color:#fff;font-family:var(--f-ui);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.bell-menu{position:absolute;top:46px;inset-inline-end:0;width:min(360px,92vw);max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-2);z-index:60;padding:8px}
.bell-item{padding:9px 10px;border-radius:12px;font-size:13.5px;font-family:var(--f-ui);display:flex;gap:8px}
.bell-item.unread{background:#F3EFFF}
.bell-item .t{color:var(--ink-3);font-size:12px}
.admin-band{display:flex;align-items:center;gap:10px;margin:28px 0 12px}
.admin-band .bar{width:6px;height:28px;border-radius:6px;background:var(--bc,var(--brand))}
.admin-band h2{font-size:19px;font-weight:800}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);min-height:170px}
.tool .th{display:flex;align-items:center;gap:10px}
.tool .th .ti{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.tool .th h4{font-size:15px;font-weight:700;line-height:1.4}
.tool .tb{font-size:13.5px;color:var(--ink-2);font-family:var(--f-ui);flex:1}
.tool .tb .bigno{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--ink);line-height:1.2}
.tool .tf{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tool-drop{grid-column:1/-1;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
.tool.danger-tool{border-color:#F5C2C4;background:#FFF7F7}
.acc{border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;overflow:hidden;border-inline-start:6px solid var(--ac,var(--brand))}
.acc-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--acg,#F6F4FC);cursor:pointer;flex-wrap:wrap}
.acc-head .aico{width:40px;height:40px;border-radius:12px;background:var(--ac,var(--brand));display:flex;align-items:center;justify-content:center;flex:none}
.acc-head h3{font-size:15.5px;font-weight:700;flex:1;min-width:160px}
.acc-head .arrow{transition:transform .2s;font-size:14px;color:var(--ink-3)}
.acc.open .acc-head .arrow{transform:rotate(-90deg)}
.acc-body{padding:12px 14px;display:none}
.acc.open .acc-body{display:block}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap}
.drag-handle{cursor:grab;font-size:18px;color:var(--ink-3);padding:0 4px;user-select:none}
.acc.dragging{opacity:.5}
.acc.drop-target{outline:3px dashed var(--brand);outline-offset:2px}
.ex-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex-row .nm{font-weight:700;font-family:var(--f-ui);font-size:14px;flex:1;min-width:180px}
.ex-row .summary{margin-top:6px;font-size:13px;color:var(--ink-2);font-family:var(--f-ui);background:var(--surface-2);border-radius:12px;padding:8px 10px}
.ex-row .summary .it{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-family:var(--f-ui);font-size:11.5px;font-weight:700}
.tag.added{background:#E7F8F2;color:#0B7A5E}
.tag.mod{background:#FFF1DB;color:#9A5B00}
.tag.hid{background:#EEE;color:#555}
.tag.off{background:#FDECEC;color:#A12A2E}
.tag.fmt{background:#EFEBFF;color:var(--brand)}
.slide-editor{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;background:var(--surface-2)}
.slide-editor .se-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.item-editor{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fff}
.form-page{max-width:900px;margin:0 auto}
.sticky-actions{position:sticky;bottom:0;background:rgba(245,243,251,.94);backdrop-filter:blur(6px);padding:12px 0;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:20px;z-index:20}
.assign-group{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.assign-group .ag-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);cursor:pointer}
.assign-group .ag-body{padding:12px;display:none}
.assign-group.open .ag-body{display:block}
.chk-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.chk-list label{display:flex;gap:8px;align-items:center;padding:4px 0;font-family:var(--f-ui);font-size:14px}
.member-box{margin-top:10px;padding:10px;border-radius:12px;background:#F4F1FF}
.member-box .m{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;margin:3px;font-family:var(--f-ui);font-size:13px}
.people-list{display:grid;gap:6px}
.person{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font-family:var(--f-ui);font-size:14px;flex-wrap:wrap}
.person .nm{flex:1;min-width:140px;font-weight:600}

</style>
</head>
<body>

<script>
const COURSE = Object.freeze({"axes":[{"id":"a1","slides":[{"type":"opening","title":"لماذا يغادر مستخدم مهتم؟","text":"<p>المستخدم داخل التطبيق لا يمنح التجربة وقتًا طويلًا لإقناعه. قد يكون مهتمًا بالمنتج فعلًا، ومع ذلك يغادر خلال لحظات، دون أن يترك لنا تفسيرًا واحدًا.</p>","rule":"<p>السؤال الذي يفتح هذا المحور: لماذا يغادر من كان مهتمًا؟</p>","chart":{"kind":"flow","items":["اهتمام","تصفح","تردد","مغادرة!"]},"id":"a1s1"},{"type":"principle","title":"ما الذي يدفع مستخدمًا مهتمًا إلى المغادرة؟","points":["غموض: معلومة غير واضحة أو خطوة لا يُعرف ما بعدها.","تعقيد: خطوات كثيرة أو خيارات متزاحمة.","بطء: انتظار تحميل أو وصول متأخر إلى المطلوب.","عدم ثقة: شك في السعر أو الأمان أو النتيجة."],"intro":"<p>قبل أي شرح: فكّر في سبب واحد فقط تتوقع أنه قد يجعل المستخدم يغادر دون إتمام الشراء. أغلب الإجابات تقع عادة تحت أربع فئات:</p>","rule":"<p>اكتب سببك أولًا، ثم ضعه في إحدى الفئات الأربع.</p>","chart":{"kind":"cards","items":["❔ غموض","🧩 تعقيد","🐢 بطء","🛡️ عدم ثقة"]},"id":"a1s2"},{"type":"principle","title":"طبيعة السلوك داخل الهاتف المحمول","points":["السرعة: يتوقع الوصول إلى ما يبحث عنه بسرعة.","الحساسية تجاه التعقيد: أي خطوة غير واضحة أو غير ضرورية قد ترفع احتمالية التردد.","التركيز على النتيجة: غالبًا يدخل التطبيق بهدف الوصول إلى نتيجة واضحة، لا لخوض رحلة طويلة من الاستكشاف.","انخفاض التسامح مع العوائق: كلما زاد الجهد المطلوب، زادت احتمالية فقدان تركيزه أو انسحابه."],"intro":"<p>المستخدم داخل تطبيق التجارة الإلكترونية يتعامل مع التجربة بدرجة عالية من:</p>","chart":{"kind":"cards","items":["⚡ سرعة","🧩 تعقيد","🎯 نتيجة","🏋️ جهد"]},"id":"a1s3"},{"type":"principle","title":"لماذا يكون التعقيد أكثر حساسية داخل الهاتف؟","points":["شاشة أصغر: مساحة أقل لعرض المعلومات.","خطوات يجب أن تكون أوضح: لا مجال للغموض.","تفاعل أسرع: المستخدم يتنقل بإبهامه وبسرعة.","أي ارتباك: قد يوقف الرحلة بالكامل."],"intro":"<p>في تجربة الهاتف تتسلسل القيود بشكل واضح: شاشة أصغر تعني مساحة أقل للمعلومات، وهذا يفرض خطوات أوضح وتفاعلًا أسرع.</p>","rule":"<p>كل عنصر داخل التطبيق يضيف جهدًا ذهنيًا أو عمليًا على المستخدم.</p>","chart":{"kind":"vflow","items":["شاشة أصغر","مساحة أقل للمعلومات","خطوات يجب أن تكون أوضح","تفاعل أسرع","أي ارتباك قد يوقف الرحلة!"]},"id":"a1s4"},{"type":"principle","title":"التجربة الناجحة تقلل الجهد المطلوب","points":["الجهد الذهني: أين أجد المنتج؟ ماذا يعني هذا الخيار؟ ماذا سيحدث بعد الضغط؟ هل السعر النهائي واضح؟","الجهد العملي: عدد الخطوات، كثرة الحقول، التنقل بين صفحات متعددة، إعادة إدخال المعلومات، انتظار التحميل."],"intro":"<p>هناك نوعان من الجهد يجب الانتباه إليهما: جهد ذهني يستهلك التفكير، وجهد عملي يستهلك الوقت والحركة.</p>","rule":"<p>التجربة الجيدة = أقل جهد ممكن للوصول إلى النتيجة.</p>","chart":{"kind":"compare","items":["🧠 جهد ذهني :: أين أجد المنتج؟ ; ماذا يعني هذا الخيار؟ ; ماذا سيحدث بعد الضغط؟ ; لماذا أحتاج هذه المعلومة؟ ; هل السعر النهائي واضح؟","👆 جهد عملي :: عدد الخطوات ; كثرة الحقول ; التنقل بين صفحات متعددة ; إعادة إدخال المعلومات ; انتظار تحميل الصفحة"]},"id":"a1s5"},{"type":"principle","title":"المستخدم المهتم قد لا يصبح مشتريًا","points":["مثال: أعجبه المنتج، دخل صفحة المنتج، وجد المعلومات غير واضحة، بدأ بالتردد، ثم غادر.","الاهتمام بداية التفاعل فقط، أما الإتمام فهو نتيجة لتجربة واضحة وسلسة."],"intro":"<p>يمكن أن تبدأ الرحلة بالاهتمام، لكن الإتمام يحتاج إلى انتقالات متتالية، والمشكلة التجارية تظهر عندما توجد فجوة بين أي مرحلتين.</p>","rule":"<p>وجود الاهتمام لا يكفي إذا كانت التجربة تعرقل الانتقال إلى الخطوة التالية.</p>","chart":{"kind":"flow","items":["اهتمام","تفاعل","وضوح","ثقة","قرار","إتمام*"]},"id":"a1s6"},{"type":"principle","title":"ماذا يفعل المستخدم داخل التطبيق؟","points":["يكتشف: هل المنتج أو العرض مناسب؟","يفهم: هل المعلومات كافية وواضحة؟","يقارن: هل هذا الخيار أفضل من البدائل؟","يقرر: هل أصبح مستعدًا للشراء؟","ينفذ: هل يستطيع إتمام الإجراء بسهولة؟","يؤكد: هل يعرف أن العملية تمت بنجاح؟"],"intro":"<p>يمكن النظر إلى رحلة المستخدم باعتبارها سلسلة من القرارات الصغيرة، لكل منها سؤال يشغله:</p>","chart":{"kind":"steps","items":["يكتشف::هل العرض مناسب؟","يفهم::هل المعلومات واضحة؟","يقارن::هل هو أفضل من البدائل؟","يقرر::هل أنا مستعد للشراء؟","ينفذ::هل الإجراء سهل؟","يؤكد::هل تمت العملية بنجاح؟"]},"id":"a1s7"},{"type":"principle","title":"المشكلة ليست دائمًا في المنتج","points":["عين الفريق: صفحة منتج ← سلة ← دفع.","عين المستخدم: أين السعر؟ هل الشحن محسوب؟ ماذا سيحدث إذا ضغطت؟ هل أستطيع الإلغاء؟ لماذا أحتاج هذه البيانات؟"],"intro":"<p>فريق التطبيق يرى مسارًا بسيطًا: صفحة منتج ثم سلة ثم دفع. لكن المستخدم يرى أمام الشاشة نفسها أسئلة لم يُجب عنها بعد.</p>","rule":"<p>تحليل التجربة يبدأ من منظور المستخدم، لا من منظور من صمّم التطبيق.</p>","chart":{"kind":"compare","items":["👥 عين فريق المنتج :: صفحة منتج ; سلة ; دفع","👁️ عين المستخدم :: أين السعر؟ ; هل الشحن محسوب؟ ; ماذا سيحدث إذا ضغطت؟ ; هل أستطيع الإلغاء؟ ; لماذا أحتاج هذه البيانات؟"]},"id":"a1s8"},{"type":"principle","title":"السلوك يكشف أين يحتاج المستخدم إلى مساعدة","points":["يستكشف: «أشوف وش الموجود».","يقارن: «أي واحد أفضل؟».","متردد: «أشتري أو لا؟».","جاهز: «أبي أكمل»."],"intro":"<p>ليس كل مستخدم في التطبيق في الحالة نفسها؛ لذلك لا ينبغي التعامل مع جميع المستخدمين بالطريقة نفسها.</p>","rule":"<p>السلوك يكشف الحالة، والحالة تحدد ما يحتاجه المستخدم.</p>","chart":{"kind":"cards","items":["🔎 يستكشف::«أشوف وش الموجود»","⚖️ يقارن::«أي واحد أفضل؟»","❓ متردد::«أشتري أو لا؟»","🛒 جاهز::«أبي أكمل»"]},"id":"a1s9"},{"type":"principle","title":"ماذا تعني السرعة من منظور المستخدم؟","points":["سرعة الوصول: هل أصل إلى المنتج أو المعلومة بسرعة؟","سرعة الفهم: هل أفهم ما أراه بسرعة؟","سرعة القرار: هل أملك المعلومات التي أحتاجها لاتخاذ القرار؟","سرعة التنفيذ: هل أستطيع تنفيذ الخطوة دون عوائق؟"],"intro":"<p>السرعة لها أكثر من معنى، ولا تقتصر على زمن تحميل الشاشة:</p>","rule":"<p>قد يكون التطبيق سريع التحميل، لكنه بطيء في إيصال المستخدم إلى النتيجة.</p>","chart":{"kind":"hub","items":["السرعة","الوصول","الفهم","القرار","التنفيذ"]},"id":"a1s10"},{"type":"principle","title":"ليست كل خطوة احتكاكًا","points":["لا يعرف المستخدم سبب وجودها.","لا تضيف قيمة واضحة.","تتطلب معلومات غير ضرورية.","تؤخر الوصول للنتيجة أو تجعل الخطوة التالية غير واضحة.","تخلق ترددًا أو مفاجأة."],"intro":"<p>الخطوة تصبح مشكلة عندما:</p>","rule":"<p>طلب عنوان التوصيل قد يكون ضروريًا، لكن طلب معلومات لا ترتبط بإتمام الطلب جهد إضافي يحتاج إلى تبرير.</p>","chart":{"kind":"compare","items":["✅ خطوة ضرورية :: عنوان التوصيل ; عرض السعر النهائي ; تأكيد الطلب","⚠️ خطوة غير مبررة :: معلومة لا ترتبط بالشراء ; إعادة إدخال البيانات ; خيارات إضافية في كل خطوة"]},"id":"a1s11"},{"type":"summary","title":"من الاهتمام إلى الإتمام","text":"<p>كلما اقترب المستخدم من قرار الشراء، أصبحت حساسيته تجاه الاحتكاك أعلى. المستخدمون يتناقصون تدريجيًا من الاهتمام حتى الإتمام، والفكرة هنا بصرية لا إحصائية.</p>","rule":"<p>في كل انتقال اسأل: ما الذي قد يجعل المستخدم يتوقف هنا؟</p>","chart":{"kind":"funnel","items":["اهتمام","تفاعل","تقييم","قرار","إتمام"]},"id":"a1s12"}],"exercises":[{"id":"a1e1","title":"اكتشف مصدر الاحتكاك","icon":"🕵️","mode":"individual","format":"text","steps":["اقرأ السيناريو وتخيّل نفسك مكان المستخدم.","افصل بين ما أتعب تفكيره وما أتعب يده.","اقترح نقطة واحدة فقط كانت ستمنعه من المغادرة."],"scenario":"<p>مستخدم فتح تطبيقًا للبحث عن حذاء، ووجد المنتج المناسب وضغط عليه. احتاج إلى المرور عبر عدة شاشات قبل أن يعرف السعر النهائي وتكلفة التوصيل، وفي منتصف الرحلة أغلق التطبيق.</p>","principle":"الاحتكاك قد يكون جهدًا ذهنيًا (غموض، تفكير زائد) أو جهدًا عمليًا (خطوات، حقول، تنقل)، وكلاهما يرفع احتمال المغادرة.","task":"<p>اكتب: جهدًا ذهنيًا واحدًا، وجهدًا عمليًا واحدًا، ونقطة واحدة كان يمكن أن تمنعه من المغادرة.</p>","why":"يدرّبك على تفكيك لحظة المغادرة إلى مصادر جهد محددة بدل الاكتفاء بقول «التجربة سيئة».","model":"<p>لا توجد إجابة وحيدة. مثال: الجهد الذهني: عدم معرفة السعر النهائي حتى وقت متأخر. الجهد العملي: المرور بعدة شاشات قبل رؤية التكلفة. نقطة المنع: إظهار السعر النهائي وتكلفة التوصيل في صفحة المنتج مباشرة.</p>","axis":"a1"},{"id":"a1e2","title":"أكمل الفراغ: لغة السلوك","icon":"🧩","mode":"group","format":"fillblank","steps":[],"items":[{"text":"المستخدم داخل تطبيقات الهاتف يتسم سلوكه بـ ___ تجاه التعقيد.","answer":"الحساسية العالية"},{"text":"المستخدم غالبًا يبحث عن الوصول السريع إلى ___ واضحة.","answer":"نتيجة"},{"text":"أي تأخير أو ___ قد يؤدي إلى الانسحاب.","answer":"غموض"},{"text":"الجهد الذي يبذله المستخدم يمكن أن يكون جهدًا ذهنيًا أو ___.","answer":"عملي"},{"text":"كثرة الخطوات قد تزيد احتمالية ___.","answer":"الانسحاب"},{"text":"عدم وضوح الخطوة التالية قد يؤدي إلى ___.","answer":"التردد"},{"text":"نجاح تجربة الشراء يرتبط بتقليل ___ المطلوب من المستخدم.","answer":"الجهد"},{"text":"المستخدم لا يدخل التطبيق بالضرورة بهدف ___ الطويل.","answer":"الاستكشاف"},{"text":"كلما زادت العوائق زاد احتمال فقدان المستخدم لـ ___.","answer":"التركيز"},{"text":"التجربة الواضحة والسلسة تساعد المستخدم على الانتقال نحو ___.","answer":"الإتمام"}],"principle":"المصطلحات الدقيقة تبني لغة مشتركة للفريق عند تحليل سلوك المستخدم.","hint":"<p>كل كلمة في البنك تُستخدم مرة واحدة فقط. اضغط الكلمة ثم الفراغ، واضغط فراغًا ممتلئًا لإفراغه.</p>","why":"يثبّت المفاهيم الأساسية للمحور بطريقة تفاعلية تتطلب اتفاق المجموعة.","model":"<p>الحساسية العالية، نتيجة، غموض، عملي، الانسحاب، التردد، الجهد، الاستكشاف، التركيز، الإتمام.</p>","axis":"a1"},{"id":"a1e3","title":"رتّب رحلة القرار","icon":"🧭","mode":"individual","format":"mcq","steps":[],"items":[{"q":"ما الترتيب المنطقي لرحلة المستخدم؟","options":["يفهم ← يكتشف ← يقرر ← يقارن ← ينفذ ← يؤكد","يكتشف ← يفهم ← يقارن ← يقرر ← ينفذ ← يؤكد","يكتشف ← يقارن ← يفهم ← ينفذ ← يقرر ← يؤكد","يقرر ← يكتشف ← يفهم ← يقارن ← يؤكد ← ينفذ"],"answer":1},{"q":"ما المرحلة التي تأتي مباشرة بعد «يقارن»؟","options":["يفهم","ينفذ","يقرر","يؤكد"],"answer":2},{"q":"في أي مرحلة يسأل المستخدم: «هل تمت العملية بنجاح؟»","options":["ينفذ","يؤكد","يقرر","يكتشف"],"answer":1},{"q":"مستخدم يسأل: «هل المعلومات كافية وواضحة؟» — في أي مرحلة هو؟","options":["يفهم","يكتشف","ينفذ","يؤكد"],"answer":0}],"scenario":"<p>أمامك ست بطاقات مبعثرة: يقرر، يكتشف، يؤكد، يقارن، ينفذ، يفهم. المطلوب إعادة بنائها كرحلة منطقية لمستخدم داخل تطبيق تجاري.</p>","principle":"رحلة الشراء سلسلة قرارات متتابعة؛ ومعرفة ترتيبها تكشف أين يمكن أن يظهر التردد.","hint":"<p>فكّر في السؤال الذي يشغل المستخدم عند كل مرحلة قبل أن تختار.</p>","why":"ترتيب المراحل يبني الخريطة الذهنية التي ستستخدمها في كل تحليل لاحق.","model":"<p>الترتيب الصحيح: يكتشف ← يفهم ← يقارن ← يقرر ← ينفذ ← يؤكد. التردد قد يظهر في أي مرحلة، والإجابة الأقوى تربطه بمشكلة واضحة في التجربة.</p>","axis":"a1"},{"id":"a1e4","title":"عين المستخدم","icon":"👁️","mode":"group","format":"text","steps":["ناقشوا الصفحة كأنكم مستخدمون لأول مرة.","اجمعوا الأسئلة التي تسبق الضغط على «أضف للسلة».","اختاروا السؤال الأخطر إن بقي بلا إجابة."],"scenario":"<p>صفحة منتج تحتوي على: صورة المنتج، اسم المنتج، وصف قصير، السعر، زر «أضف للسلة»، وتقييمات المستخدمين.</p>","principle":"ما يبدو واضحًا لفريق التطبيق قد يكون مليئًا بالأسئلة غير المجابة في عين المستخدم.","task":"<p>اكتبوا 3 أسئلة قد يطرحها المستخدم قبل الضغط على «أضف للسلة»، ثم حددوا: أي سؤال منها إن لم يجد له إجابة قد يرفع التردد؟ ولماذا؟</p>","why":"ينقلكم من منظور المصمم إلى منظور المستخدم، وهو أساس كل تشخيص للاحتكاك.","model":"<p>مثال: «هل السعر يشمل الشحن؟» — لأن المستخدم قد لا يعرف التكلفة النهائية. التقييم: نقطة لكل سؤال واقعي، وارتباطه بقرار الشراء، وتفسير واضح لتأثيره.</p>","axis":"a1"},{"id":"a1e5","title":"ماذا يحتاج المستخدم؟","icon":"🛒","mode":"individual","format":"mcq","steps":[],"items":[{"q":"مستخدم يشاهد عدة منتجات دون التفاعل مع أي منها.","options":["طلب الدفع","معلومات تساعده على الاستكشاف","رسالة تأكيد الطلب","نموذج بيانات"],"answer":1},{"q":"مستخدم يقارن منتجين متشابهين.","options":["معلومات مقارنة واضحة","طلب تسجيل حساب","صفحة دفع","رسالة شكر"],"answer":0},{"q":"مستخدم وصل للسلة لكنه لم يبدأ الدفع.","options":["إخفاء السعر النهائي","زيادة عدد الخطوات","توضيح ما سيحدث بعد المتابعة","إزالة معلومات المنتج"],"answer":2},{"q":"مستخدم مستعد للشراء.","options":["إجباره على استكشاف منتجات أخرى","تسهيل الانتقال إلى الإتمام","إخفاء زر الإتمام","إضافة نموذج جديد"],"answer":1},{"q":"مستخدم متردد بسبب غموض السعر.","options":["إضافة معلومات السعر والتكلفة بوضوح","إرسال إعلان عام","إضافة صور أكثر فقط","إخفاء الرسوم"],"answer":0}],"scenario":"<p>خمس بطاقات لمستخدمين في حالات مختلفة داخل التطبيق. لكل حالة تدخّل أنسب من غيره.</p>","principle":"الحالة السلوكية للمستخدم (يستكشف، يقارن، متردد، جاهز) تحدد نوع المساعدة التي يحتاجها.","hint":"<p>اسأل نفسك: ما الذي يمنع هذا المستخدم من الانتقال للخطوة التالية الآن؟</p>","why":"يربط قراءة السلوك بقرار عملي: ماذا نقدم لكل مستخدم.","model":"<p>1: معلومات تساعده على الاستكشاف. 2: معلومات مقارنة واضحة. 3: توضيح ما سيحدث بعد المتابعة. 4: تسهيل الانتقال إلى الإتمام. 5: إضافة معلومات السعر والتكلفة بوضوح.</p>","axis":"a1"},{"id":"a1e6","title":"صح أم خطأ: معنى السرعة","icon":"⚡","mode":"individual","format":"truefalse","steps":[],"items":[{"q":"سرعة التطبيق تعني فقط سرعة تحميل الشاشة.","answer":false},{"q":"وضوح المعلومات يؤثر في سرعة فهم المستخدم.","answer":true},{"q":"كثرة الخيارات قد تزيد الجهد المطلوب لاتخاذ القرار.","answer":true},{"q":"المستخدم المهتم بالمنتج سيكمل الشراء مهما كانت التجربة.","answer":false},{"q":"الوصول السريع إلى النتيجة جزء من تجربة الهاتف المحمول.","answer":true},{"q":"كل خطوة إضافية تكون سيئة بالضرورة.","answer":false},{"q":"الخطوة غير الضرورية قد تضيف احتكاكًا إلى الرحلة.","answer":true},{"q":"يمكن أن يكون التطبيق سريعًا تقنيًا ومع ذلك تكون التجربة بطيئة.","answer":true},{"q":"وضوح الخطوة التالية يساعد المستخدم على الاستمرار.","answer":true},{"q":"تحليل سلوك المستخدم يبدأ من فهم ما يفعله داخل التطبيق.","answer":true}],"principle":"السرعة من منظور المستخدم تشمل الوصول والفهم والقرار والتنفيذ، لا زمن التحميل وحده.","hint":"<p>انتبه للكلمات المطلقة مثل «فقط» و«بالضرورة» و«مهما كانت».</p>","why":"يكشف المفاهيم الخاطئة الشائعة حول السرعة والجهد بسرعة ووضوح.","model":"<p>خطأ، صح، صح، خطأ، صح، خطأ، صح، صح، صح، صح.</p>","axis":"a1"},{"id":"a1e7","title":"ضرورية أم احتكاك؟","icon":"⚖️","mode":"individual","format":"mcq","steps":[],"items":[{"q":"اختيار عنوان التوصيل","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":0},{"q":"عرض السعر النهائي","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":0},{"q":"طلب معلومة غير مرتبطة بالشراء","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":1},{"q":"تأكيد الطلب","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":0},{"q":"عرض خيارات إضافية في كل خطوة","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":1},{"q":"توضيح الخطوة التالية","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":0},{"q":"إجبار المستخدم على التنقل بين صفحات كثيرة","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":1},{"q":"عرض معلومات تساعد على اتخاذ القرار","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":0},{"q":"إعادة إدخال نفس البيانات","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":1},{"q":"إضافة خطوة لا يفهم المستخدم سببها","options":["ضروري","قد يكون احتكاكًا","يعتمد على السياق"],"answer":1}],"scenario":"<p>عشرة عناصر تظهر عادة داخل رحلة الشراء. بعضها ضروري لإتمام الطلب، وبعضها قد يتحول إلى احتكاك.</p>","principle":"لا نحكم على الخطوة من وجودها فقط؛ نسأل عن قيمتها بالنسبة للهدف الذي يحاول المستخدم تحقيقه.","hint":"<p>اسأل عن كل عنصر: هل يخدم هدف المستخدم الآن؟</p>","why":"يدرّبك على التمييز بين الجهد الضروري والجهد الزائد قبل اقتراح أي حذف.","model":"<p>ضروري: عنوان التوصيل، السعر النهائي، تأكيد الطلب، توضيح الخطوة التالية، معلومات تساعد على القرار. قد يكون احتكاكًا: معلومة غير مرتبطة بالشراء، خيارات إضافية في كل خطوة، التنقل بين صفحات كثيرة، إعادة إدخال البيانات، خطوة لا يُفهم سببها.</p>","axis":"a1"}],"highlights":["السرعة والحساسية تجاه التعقيد","الجهد الذهني مقابل الجهد العملي","الاهتمام لا يعني الإتمام","رحلة القرار من الاكتشاف إلى التأكيد"],"unit":1,"icon":"eye","color":0,"scene":"browse","title":"عقل المستخدم في راحة يده","classic":"فهم سلوك المستخدم داخل تطبيقات التجارة عبر الهاتف المحمول","duration":"90 دقيقة","desc":"<p>المستخدم داخل التطبيق سريع وحساس تجاه التعقيد، وقد يغادر خلال لحظات رغم اهتمامه بالمنتج. هنا نفهم لماذا يحدث ذلك، وكيف نقرأ الجهد الذهني والعملي الذي تفرضه التجربة عليه.</p>"},{"id":"a2","slides":[{"type":"opening","title":"من الاهتمام إلى الإتمام","text":"<p>عرفنا أن المستخدم سريع وحساس تجاه التعقيد. الآن نتتبع رحلته خطوة بخطوة: ما الذي يشغله في كل مرحلة؟ وأين تنكسر الرحلة؟</p>","rule":"<p>الإتمام ليس لحظة واحدة، بل سلسلة انتقالات ناجحة.</p>","chart":{"kind":"flow","items":["الاكتشاف","الفهم","المقارنة","القرار","التنفيذ","التأكيد*"]},"id":"a2s1"},{"type":"principle","title":"كل مرحلة لها سؤال مختلف","points":["الاكتشاف: ماذا يوجد؟","الفهم: ما هذا المنتج؟","المقارنة: هل هذا مناسب لي؟","القرار: هل أشتري الآن؟","التنفيذ: كيف أكمل؟","التأكيد: هل تمت العملية؟"],"intro":"<p>لكل مرحلة سؤال يشغل المستخدم، والسؤال أهم من اسم المرحلة:</p>","rule":"<p>إذا لم تجب التجربة عن السؤال الذي يشغل المستخدم في اللحظة المناسبة، قد تظهر نقطة احتكاك.</p>","chart":{"kind":"table","items":["المرحلة ; السؤال الذي يشغل المستخدم","الاكتشاف ; ماذا يوجد؟","الفهم ; ما هذا المنتج؟","المقارنة ; هل هذا مناسب لي؟","القرار ; هل أشتري الآن؟","التنفيذ ; كيف أكمل؟","التأكيد ; هل تمت العملية؟"]},"id":"a2s2"},{"type":"principle","title":"التجربة الجيدة تقلل الفجوة بين التوقع والواقع","points":["مفاجأة: شيء لم يكن في الحسبان.","تردد: إعادة التفكير في القرار.","احتمال انسحاب: خروج من الرحلة."],"intro":"<p>قبل الخطوة يقول المستخدم: «أعرف تقريبًا ماذا سيحدث». وبعدها: «حدث ما كنت أتوقعه». كلما اتسعت الفجوة بين الاثنين ظهرت سلسلة خطيرة:</p>","chart":{"kind":"gap","items":["توقع المستخدم","الفجوة","ما حدث فعليًا","تردد / انسحاب"]},"id":"a2s3"},{"type":"principle","title":"التردد ليس دائمًا رفضًا للمنتج","points":["هل السعر النهائي واضح؟","هل المنتج مناسب؟","هل التوصيل متاح؟","ماذا سيحدث بعد الضغط؟","هل يمكنني التراجع؟","هل المعلومات كافية؟"],"intro":"<p>قد يكون المستخدم راغبًا في المنتج، لكن هناك سؤالًا لم يجد له إجابة، مثل:</p>","rule":"<p>عند ظهور التردد، ابحث عن السؤال الذي لم تجب عنه التجربة.</p>","chart":{"kind":"hub","items":["؟","هل السعر النهائي واضح؟","هل المنتج مناسب؟","هل التوصيل متاح؟","ماذا سيحدث بعد الضغط؟","هل يمكنني التراجع؟","هل المعلومات كافية؟"]},"id":"a2s4"},{"type":"summary","title":"السؤال المفقود","text":"<p>الرحلة تنكسر حين يبقى سؤال بلا إجابة في لحظته. المفاجأة المتأخرة، والمعلومة الغائبة، والخطوة الغامضة كلها أشكال للفجوة نفسها بين ما يتوقعه المستخدم وما يحدث فعلًا.</p>","rule":"<p>صمّم كل مرحلة لتجيب عن سؤالها قبل أن يُطرح.</p>","id":"a2s5"}],"exercises":[{"id":"a2e1","title":"أين انقطع المسار؟","icon":"✂️","mode":"group","format":"text","steps":["ارسموا المسار الذي سلكه المستخدم مرحلة بمرحلة.","حددوا اللحظة التي تغيّر فيها قراره.","اقترحوا تغييرًا يقلل المفاجأة."],"scenario":"<p>مستخدم شاهد إعلانًا لمنتج، دخل التطبيق، وجد المنتج، قرأ الوصف، أضافه للسلة، ثم انتقل إلى الدفع. هناك اكتشف أن تكلفة التوصيل ظهرت لأول مرة، فأغلق التطبيق.</p>","principle":"المفاجأة في مرحلة متأخرة توسّع الفجوة بين التوقع والواقع، وتكلفتها على القرار أعلى كلما اقترب المستخدم من الإتمام.","task":"<p>حددوا: أين حدثت نقطة الاحتكاك؟ ما الذي كان المستخدم يتوقع معرفته قبل هذه اللحظة؟ ما التغيير الذي يمكن أن يقلل المفاجأة؟</p>","why":"يعلّمكم تحديد موضع الاحتكاك بدقة وربطه بتوقع المستخدم لا بالمنتج.","model":"<p>نقطة الاحتكاك ظهرت عند اكتشاف تكلفة غير متوقعة في مرحلة متأخرة. والتحسين يرتبط بوضوح التكلفة قبل الوصول إلى نقطة القرار النهائي، مثل إظهار تقدير التوصيل في صفحة المنتج.</p>","axis":"a2"},{"id":"a2e2","title":"قارن بين تجربتين","icon":"🔍","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"يظهر سعر المنتج فقط، وفي آخر خطوة تظهر رسوم التوصيل.","b":"يظهر سعر المنتج وتكلفة التوصيل بوضوح قبل القرار النهائي.","answer":"b"},{"a":"زر «متابعة» دون توضيح ما بعده.","b":"زر «المتابعة إلى الدفع» مع ملخص الطلب.","answer":"b"},{"a":"سياسة الإرجاع موجودة في صفحة منفصلة داخل الإعدادات.","b":"جملة مختصرة عن الإرجاع بجانب زر الإضافة للسلة.","answer":"b"}],"scenario":"<p>في كل زوج تجربتان لنفس الموقف. المطلوب اختيار التجربة التي تقلل الغموض والمفاجأة — لا التجربة الأجمل.</p>","principle":"التجربة الأفضل تعطي المستخدم المعلومات المؤثرة على قراره في وقت أبكر وبشكل أوضح.","hint":"<p>السؤال في كل زوج: أي تجربة تقلل الغموض؟</p>","why":"يدرّب المجموعة على الحكم بمعيار الوضوح والتوقيت بدل الذوق البصري.","model":"<p>في كل الأزواج التجربة (ب) أدق لأنها تكشف المعلومة المؤثرة مبكرًا وتجعل الخطوة التالية متوقعة.</p>","axis":"a2"},{"id":"a2e3","title":"السؤال المفقود","icon":"❓","mode":"group","format":"text","steps":["فكّروا في حالة المستخدم لحظة التوقف.","صوغوا الأسئلة من منظور فريق يريد الفهم لا التخمين.","اربطوا كل سؤال بسلوك يمكن ملاحظته."],"scenario":"<p>تطبيق تجاري لديه عدد جيد من المستخدمين الذين يصلون إلى صفحة المنتج، ونسبة التفاعل جيدة، لكن نسبة الانتقال إلى الخطوة التالية منخفضة.</p>","principle":"التردد غالبًا علامة على سؤال لم تجب عنه التجربة، لا على رفض المنتج.","task":"<p>اكتبوا 5 أسئلة يجب على فريق التطبيق طرحها لفهم سبب التردد.</p>","why":"يحوّل ملاحظة عامة («التحويل منخفض») إلى أسئلة تحقيق قابلة للبحث.","model":"<p>هل المعلومات كافية؟ هل السعر واضح؟ هل تفاصيل التوصيل واضحة؟ هل يعرف المستخدم الخطوة التالية؟ هل هناك معلومات مفقودة أو تعقيد في الانتقال أو مشكلة تقنية؟ — الفريق الذي يربط السؤال بسلوك المستخدم يحصل على نقطة إضافية.</p>","axis":"a2"}],"highlights":["لكل مرحلة سؤال يشغل المستخدم","فجوة التوقع والواقع","التردد ليس رفضًا للمنتج"],"unit":1,"icon":"route","color":1,"scene":"journey","title":"الفجوة بين «أعجبني» و«اشتريت»","classic":"تفكيك رحلة المستخدم وتحليل نقاط التأثير على قرار الشراء","duration":"60 دقيقة","desc":"<p>كل مرحلة في رحلة الشراء يشغلها سؤال مختلف، وإذا لم تجب التجربة عنه في اللحظة المناسبة ظهر الاحتكاك. نتتبع هنا الانتقال من الاهتمام إلى الإتمام والفجوة بين التوقع والواقع.</p>"},{"id":"a3","slides":[{"type":"opening","title":"نقطة الاحتكاك","text":"<p>نقطة الاحتكاك هي اللحظة التي يصبح فيها استمرار المستخدم أكثر صعوبة مما ينبغي. قد تظهر بسبب غموض، أو كثرة خطوات، أو بطء، أو معلومة ناقصة، أو مفاجأة، أو تردد.</p>","rule":"<p>رحلة المستخدم خط مستقيم، والاحتكاك علامات تحذير متناثرة عليه.</p>","chart":{"kind":"flow","items":["دخول","بحث ⚠️","منتج","سلة ⚠️","دفع ⚠️","إتمام*"]},"id":"a3s1"},{"type":"principle","title":"حلّل السلوك قبل أن تقترح الحل","points":["ماذا كان المستخدم يحاول أن يفعل؟","أين توقف؟","ماذا كان يتوقع؟","ماذا واجه فعليًا؟","ما الذي قد يفسر التوقف؟","ما التغيير الذي يمكن اختباره؟"],"intro":"<p>عند انخفاض الإتمام لا نبدأ بالسؤال: «ما التعديل الذي نضيفه؟». نبدأ بست خطوات تشخيصية:</p>","chart":{"kind":"steps","items":["الهدف::ماذا كان يحاول أن يفعل؟","التوقف::أين توقف؟","التوقع::ماذا كان يتوقع؟","الواقع::ماذا واجه فعليًا؟","التفسير::ما الذي قد يفسر التوقف؟","الاختبار::ما التغيير القابل للاختبار؟"]},"id":"a3s2"},{"type":"examples","title":"أين يمكن أن يظهر الاحتكاك؟","items":["قبل القرار::معلومات ناقصة، صعوبة المقارنة، عدم وضوح المنتج.","أثناء التنقل::مسار غير واضح، خيارات كثيرة، انتقالات غير متوقعة.","قبل الإتمام::خطوات كثيرة، تكلفة غير متوقعة، معلومات غير واضحة.","بعد الإتمام::عدم وضوح ما حدث، وعدم معرفة الخطوة التالية."],"id":"a3s3"},{"type":"principle","title":"كيف نقيّم التجربة؟","points":["هل يعرف المستخدم أين هو؟","هل يعرف ماذا يفعل بعد ذلك؟","هل يفهم ما يراه؟","هل يملك المعلومات اللازمة لاتخاذ القرار؟","هل يستطيع تنفيذ الخطوة بسهولة؟","هل يعرف ماذا حدث بعد الإتمام؟"],"intro":"<p>لا يكفي أن نسأل: «هل التطبيق يعمل؟». نحتاج إلى أسئلة أعمق كأنها عدسة تحليل حول الشاشة:</p>","chart":{"kind":"hub","items":["📱 عدسة التحليل","أين أنا؟","ماذا بعد؟","هل أفهم ما أراه؟","هل لدي معلومات القرار؟","هل التنفيذ سهل؟","ماذا حدث بعد الإتمام؟"]},"id":"a3s4"},{"type":"principle","title":"هل كل احتكاك سيئ؟","points":["إذا كانت الإجابة نعم: نبحث عن طريقة لجعل الخطوة أوضح وأسهل وأسرع.","إذا كانت لا: الخطوة مرشحة للحذف أو الدمج."],"intro":"<p>لا. بعض الخطوات ضرورية لتحقيق الأمان، والدقة، واكتمال البيانات، وتنفيذ الطلب، وحماية المستخدم. السؤال الأفضل: هل هذا الجهد ضروري لتحقيق نتيجة مهمة للمستخدم أو للتطبيق؟</p>","rule":"<p>أوضح + أسهل + أسرع — بدل الحذف الأعمى.</p>","chart":{"kind":"balance","items":["قيمة الخطوة","الجهد المطلوب"]},"id":"a3s5"},{"type":"principle","title":"السلوك يخبرنا أكثر من الانطباع","points":["ينتقل للخطوة التالية؟","يعود للخلف أو يعيد المحاولة؟","يتوقف أو يغادر؟","يصل إلى الإتمام؟"],"intro":"<p>بدل أن نقول: «التطبيق يبدو سهلًا»، نسأل: ماذا يفعل المستخدم فعليًا؟ هل:</p>","rule":"<p>فهم السلوك ينقلنا من الانطباع إلى التشخيص.</p>","chart":{"kind":"compare","items":["💭 انطباع :: «يبدو سهلًا» ; رأي الفريق ; شعور عام","📊 سلوك :: المستخدم يصل للخطوة التالية دون توقف ; نسبة العودة للخلف ; نقطة المغادرة"]},"id":"a3s6"},{"type":"tools","title":"نموذج التشخيص السريع","items":["ماذا يفعل المستخدم؟::السلوك الفعلي.","ماذا يريد أن يحقق؟::الهدف.","أين يتوقف؟::نقطة الاحتكاك.","ماذا كان يتوقع؟::التوقع.","ماذا واجه؟::التجربة الفعلية.","ما الذي قد يفسر الفرق؟::سبب محتمل.","ماذا يمكن تحسينه؟::إجراء قابل للاختبار."],"id":"a3s7"},{"type":"principle","title":"لماذا يهمنا فهم السلوك؟","points":["سلوك المستخدم يصنع تجربة الشراء.","تجربة الشراء تكشف نقاط الاحتكاك.","نقاط الاحتكاك تؤثر في قرار المستخدم.","قرار المستخدم يحدد معدل الإتمام."],"intro":"<p>الهدف النهائي من تحليل السلوك ليس جمع الملاحظات، بل فهم العلاقة المتسلسلة بين خمسة عناصر تنتهي بالنتيجة التجارية.</p>","chart":{"kind":"vflow","items":["سلوك المستخدم","تجربة الشراء","نقاط الاحتكاك","قرار المستخدم","معدل الإتمام*"]},"id":"a3s8"},{"type":"summary","title":"ماذا نأخذ من هذه الوحدة؟","text":"<p>المستخدم داخل الهاتف حساس تجاه التعقيد، والاهتمام بالمنتج لا يعني الإتمام. رحلة الشراء تتكون من انتقالات، ويمكن أن يحدث الاحتكاك في أي منها، ونقطة الاحتكاك لحظة يصبح فيها الاستمرار أصعب مما ينبغي.</p>","rule":"<p>قبل اقتراح الحل: ماذا فعل؟ أين توقف؟ ماذا كان يتوقع؟ ماذا واجه؟ ولماذا قد يكون توقف؟</p>","id":"a3s9"}],"exercises":[{"id":"a3e1","title":"غرفة التشخيص","icon":"🩺","mode":"group","format":"text","steps":["طبّقوا النموذج: السلوك ← نقطة التوقف ← السؤال المحتمل ← سبب الاحتكاك ← التحسين المقترح.","املؤوا كل خانة بجملة واحدة.","جهّزوا عرضًا لتشخيصكم في 60 ثانية."],"scenario":"<p>متجر إلكتروني رحلة الشراء فيه كالتالي: المستخدم يدخل التطبيق، يبحث عن المنتج، يفتح صفحة المنتج، يضيفه للسلة، ينتقل إلى الدفع — وعند هذه النقطة ينسحب عدد من المستخدمين.</p>","principle":"التشخيص الجيد يسير من السلوك إلى السبب قبل أن يصل إلى الحل.","task":"<p>اكتبوا تشخيصكم وفق النموذج الخماسي: السلوك، نقطة التوقف، السؤال المحتمل، سبب الاحتكاك، التحسين المقترح.</p>","why":"يرسّخ تسلسل التشخيص كعادة تفكير جماعية قبل القفز إلى الحلول.","model":"<p>السلوك: وصل للدفع. نقطة التوقف: قبل الإتمام. السؤال المحتمل: كم سأدفع فعليًا؟ الاحتكاك: تكلفة غير واضحة. التحسين: توضيح التكلفة النهائية في وقت مناسب.</p>","axis":"a3"},{"id":"a3e2","title":"صيد الاحتكاك","icon":"🎣","mode":"individual","format":"text","steps":["اقرأ السيناريو سطرًا سطرًا.","ضع علامة على كل لحظة يزداد فيها جهد المستخدم.","رتّب ما وجدته حسب الأولوية."],"scenario":"<p>المستخدم يبحث عن منتج فيجد 40 نتيجة، ولا يستطيع ترتيبها بسهولة. يفتح أحد المنتجات فيجد الوصف طويلًا جدًا ولا يجد معلومات التوصيل. يضيف المنتج للسلة ثم يكتشف أن عليه إنشاء حساب. ينشئ الحساب، ويعيد إدخال بيانات العنوان، وينتقل للدفع فتظهر رسوم إضافية.</p>","principle":"الاحتكاك نادرًا ما يكون نقطة واحدة؛ غالبًا سلسلة من العوائق الصغيرة المتراكمة.","task":"<p>حدد جميع نقاط الاحتكاك المحتملة، ثم اكتب: أي نقطة تبدأ بتحليلها أولًا؟ ولماذا؟</p>","why":"يدرّب عينك على رصد الاحتكاك المتراكم، وعلى تبرير الأولوية لا الاكتفاء بالرصد.","model":"<p>صعوبة تصفية النتائج، وصف طويل يصعّب الوصول للمعلومة، عدم وضوح التوصيل، إجبار المستخدم على إنشاء حساب، إعادة إدخال بيانات موجودة، ظهور رسوم إضافية متأخرًا. لا توجد إجابة واحدة للأولوية؛ المطلوب تبريرها بتأثيرها المحتمل وموقعها في الرحلة.</p>","axis":"a3"},{"id":"a3e3","title":"تقييم تجربة شراء بستة أبعاد","icon":"📋","mode":"individual","format":"mcq","steps":[],"items":[{"q":"وضوح السعر","options":["جيد","يحتاج تحسين"],"answer":0},{"q":"وضوح الخطوات","options":["جيد","يحتاج تحسين"],"answer":0},{"q":"سهولة التنفيذ","options":["جيد","يحتاج تحسين"],"answer":1},{"q":"تكرار البيانات","options":["جيد","يحتاج تحسين"],"answer":1},{"q":"وضوح النتيجة بعد الدفع","options":["جيد","يحتاج تحسين"],"answer":1},{"q":"الثقة في الإتمام","options":["جيد","يحتاج تحسين"],"answer":1}],"scenario":"<p>المستخدم وصل إلى صفحة الدفع. السعر النهائي واضح، والخطوات واضحة، لكن عليه إدخال معلومات سبق أن أدخلها، وبعد الدفع لا تظهر رسالة واضحة تؤكد نجاح العملية.</p>","principle":"التجربة يمكن أن تكون جيدة في جزء ومربكة في جزء آخر؛ لذلك نقيّمها بأبعاد منفصلة.","hint":"<p>قيّم كل بُعد وحده دون أن يتأثر حكمك ببقية الأبعاد.</p>","why":"يدرّبك على التقييم المفصّل بدل الحكم الإجمالي «جيدة/سيئة».","model":"<p>وضوح السعر: جيد. وضوح الخطوات: جيد. سهولة التنفيذ: يحتاج تحسين. تكرار البيانات: يحتاج تحسين. وضوح النتيجة: يحتاج تحسين. الثقة في الإتمام: تحتاج تعزيز.</p>","axis":"a3"},{"id":"a3e4","title":"محكمة الاحتكاك","icon":"👨‍⚖️","mode":"group","format":"text","steps":["اختاروا خطوة واحدة من الأربع (أو أكثر).","قرروا: ضرورية / يمكن تحسينها / يمكن الاستغناء عنها.","اكتبوا مرافعة دفاع من 30 ثانية."],"scenario":"<p>أمام المحكمة أربع خطوات من رحلة شراء: (1) إنشاء حساب قبل الشراء، (2) إدخال عنوان التوصيل، (3) تأكيد رقم الجوال، (4) عرض ملخص الطلب قبل الدفع.</p>","principle":"الحكم على الخطوة يكون بميزان قيمتها مقابل الجهد الذي تطلبه، لا بمجرد وجودها.","task":"<p>اكتبوا حكمكم على كل خطوة اخترتموها مع مرافعة قصيرة تبرر القرار.</p>","why":"المهم هنا منطق القرار لا «الإجابة النموذجية»؛ النشاط يدرّب على الدفاع عن الأولويات بالحجة.","model":"<p>مثال: إنشاء حساب قبل الشراء — يمكن تحسينها: إتاحة الشراء كضيف ثم عرض إنشاء الحساب بعد الإتمام. ملخص الطلب قبل الدفع — ضرورية: تقلل المفاجأة وتبني الثقة.</p>","axis":"a3"},{"id":"a3e5","title":"صحّح العبارة","icon":"✍️","mode":"group","format":"comparePairs","steps":[],"items":[{"a":"التطبيق ممتاز لأن تصميمه جميل.","b":"نحتاج إلى فهم كيف يتصرف المستخدم داخل التطبيق.","answer":"b"},{"a":"المستخدم الذي وصل إلى صفحة المنتج سيشتري غالبًا.","b":"الوصول إلى صفحة المنتج مرحلة في الرحلة، وليس ضمانًا للإتمام.","answer":"b"},{"a":"كثرة الخطوات سيئة دائمًا.","b":"الخطوات تحتاج إلى تقييم بحسب ضرورتها وقيمتها.","answer":"b"},{"a":"انخفاض الإتمام يعني أن المنتج غير مناسب.","b":"انخفاض الإتمام يحتاج إلى تحليل نقطة التوقف وأسبابها.","answer":"b"},{"a":"سرعة التطبيق تعني سرعة التحميل فقط.","b":"السرعة تشمل الوصول والفهم والقرار والتنفيذ.","answer":"b"}],"scenario":"<p>خمسة أزواج من العبارات. في كل زوج عبارة شائعة وأخرى أدق في وصف سلوك المستخدم.</p>","principle":"التفكير الدقيق يربط الحكم بالسلوك والتحليل، لا بالانطباع أو التعميم.","hint":"<p>اختاروا العبارة التي تصف ما يحدث فعلًا دون تعميم.</p>","why":"يصحح أنماط التفكير الخاطئة الأكثر شيوعًا في فرق المنتجات.","model":"<p>العبارة (ب) هي الأدق في الأزواج الخمسة، لأنها تربط الحكم بتحليل السلوك لا بالافتراض.</p>","axis":"a3"},{"id":"a3e6","title":"لا تقبلوا الإجابة السهلة","icon":"🚫","mode":"group","format":"text","steps":["ارفضوا التفسير الجاهز واطلبوا الدليل.","افصلوا ما تعرفونه عما لا تعرفونه.","انتهوا بتحسين واحد قابل للاختبار."],"scenario":"<p>تطبيق لمتجر تجزئة لديه عدد جيد من الزوار. المستخدمون يصلون إلى صفحات المنتجات، ونسبة التفاعل جيدة، لكن عددًا منهم لا ينتقلون إلى الإتمام. الفريق يقول: «ربما المستخدمون لا يريدون الشراء».</p>","principle":"لا يمكن تحديد السبب من المعطيات وحدها؛ الخطوة الصحيحة تحليل الرحلة وتحديد نقطة التوقف بدل الافتراض.","task":"<p>باستخدام نموذج التشخيص، حللوا: ماذا نعرف؟ ماذا لا نعرف؟ أين نحتاج إلى بيانات؟ أين يمكن أن يكون الاحتكاك؟ ما الأسئلة التي نحتاج طرحها؟ ما التحسين الذي يمكن اختباره؟</p>","why":"يبني مناعة ضد القفز إلى الاستنتاجات غير المدعومة.","model":"<p>نعرف: الوصول والتفاعل جيدان. لا نعرف: أين يتوقف المستخدمون تحديدًا ولماذا. نحتاج بيانات: الانتقال بين الصفحة والسلة والدفع. احتكاك محتمل: غموض التكلفة أو التوصيل. تحسين قابل للاختبار: إظهار التكلفة النهائية مبكرًا وقياس الانتقال إلى السلة.</p>","axis":"a3"},{"id":"a3e7","title":"قبل أن نزيد الإعلانات","icon":"📢","mode":"group","format":"text","steps":["أجيبوا عن الأسئلة الستة قبل التفكير في أي حملة.","اختاروا فرضية واحدة فقط.","حددوا كيف ستختبرونها."],"scenario":"<p>متجر إلكتروني لاحظ أن المستخدمين يدخلون التطبيق بأعداد جيدة، يشاهدون المنتجات، يتفاعلون مع صفحاتها، ويضيفون بعضها إلى السلة، لكن نسبة الإتمام أقل من المتوقع. الإدارة طلبت من الفريق «زيادة الإعلانات».</p>","principle":"زيادة الزيارات لا تعالج احتكاكًا داخل الرحلة؛ الفرضية القابلة للاختبار تسبق الحملة.","task":"<p>قبل اقتراح أي حملة، قدّموا: فرضية واحدة + سبب اختيارها + طريقة اختبارها، مستندين إلى: ما نعرفه، ما لا نعرفه، المرحلة التي تستحق التحقيق، نقاط الاحتكاك المحتملة، البيانات المطلوبة.</p>","why":"يدرّب على مقاومة الحلول الجاهزة من الإدارة بلغة البيانات والفرضيات.","model":"<p>مثال: فرضية: المستخدمون ينسحبون عند ظهور رسوم التوصيل في الدفع. السبب: الانخفاض يحدث بعد الإضافة للسلة. الاختبار: إظهار التوصيل في السلة لنصف المستخدمين ومقارنة الإتمام. التقييم على الارتباط بالسلوك والوضوح وإمكانية الاختبار.</p>","axis":"a3"},{"id":"a3e8","title":"محقق تجربة المستخدم","icon":"🔎","mode":"group","format":"text","steps":["تحولوا إلى فريق تحليل تجربة المستخدم.","أجيبوا عن الأسئلة الثمانية بالترتيب.","ممنوع تقديم حل قبل تقديم تفسير للسلوك."],"scenario":"<p>تطبيق تجارة إلكترونية يعمل جيدًا من الناحية التقنية، وعدد المستخدمين جيد، والمستخدمون يشاهدون المنتجات وبعضهم يضيفها للسلة، لكن نسبة الإتمام منخفضة، والفريق لا يعرف أين المشكلة.</p>","principle":"التشخيص الأولي المنظّم يحوّل الغموض إلى فرضية قابلة للاختبار، ولا حل قبل تفسير للسلوك.","task":"<p>ابنوا تشخيصًا أوليًا: ماذا نعرف؟ ماذا لا نعرف؟ ما المرحلة التي نحقق فيها؟ ما السلوك الذي نبحث عنه؟ أين قد توجد نقطة الاحتكاك؟ ما تفسير محتمل؟ ما البيانات التي نحتاجها؟ ما التحسين الذي يمكن اختباره؟</p>","why":"نشاط ختامي يجمع أدوات المحور كلها في حالة واحدة متكاملة (يُعرض في 90 ثانية).","model":"<p>التقييم من 10: فهم سلوك المستخدم (2)، تحديد منطقي لموضع الاحتكاك (2)، أسئلة تشخيص جيدة (2)، فرضية قابلة للاختبار (2)، ربط واضح بين الاحتكاك والإتمام (2).</p>","axis":"a3"}],"highlights":["تعريف نقطة الاحتكاك وأنواعها","حلّل السلوك قبل أن تقترح الحل","ليس كل احتكاك سيئًا","نموذج التشخيص السريع بسبع مراحل"],"unit":1,"icon":"alert","color":2,"scene":"friction","title":"صيّاد الاحتكاك","classic":"تحسين تجربة الشراء داخل التطبيق ورفع معدل الإتمام","duration":"120 دقيقة","desc":"<p>نقطة الاحتكاك هي اللحظة التي يصبح فيها استمرار المستخدم أصعب مما ينبغي. نتعلم هنا اكتشافها وتصنيفها وتقييم التجربة من منظور المستخدم، ثم ربطها مباشرة بمعدل الإتمام.</p>"},{"id":"a4","slides":[{"type":"opening","title":"كيف نتدخل داخل رحلة المستخدم؟","text":"<p>في المحور السابق فهمنا رحلة المستخدم. الآن السؤال: متى وكيف يمكن أن يتدخل التسويق داخل هذه الرحلة؟ ليس كل مستخدم يحتاج الرسالة نفسها، وليس كل توقيت مناسبًا للتدخل.</p>","rule":"<p>التسويق داخل التطبيق نقاط تدخل صغيرة على خريطة الرحلة نفسها.</p>","chart":{"kind":"flow","items":["اكتشاف 💬","استكشاف 🎁","تقييم ✨","إجراء 🔔","إتمام*"]},"id":"a4s1"},{"type":"principle","title":"متى تكون الرسالة التسويقية مفيدة؟","points":["يتصفح: قد يحتاج إلى اكتشاف خيارات.","يقارن: قد يحتاج إلى معلومات تساعده على المفاضلة.","أضاف للسلة: قد يحتاج إلى تذكير أو طمأنة.","بدأ الدفع: يحتاج إلى وضوح لا إلى تشتيت."],"intro":"<p>تخيل أربعة مستخدمين داخل تطبيق تجاري: الأول يتصفح منتجًا، والثاني يقارن الخيارات، والثالث أضاف منتجًا إلى السلة، والرابع بدأ الدفع. هل يحتاج هؤلاء جميعًا إلى الرسالة نفسها؟</p>","rule":"<p>ناقش قبل أن ترى الإجابة: ما الرسالة المناسبة لكل حالة؟</p>","chart":{"kind":"cards","items":["📱 يتصفح","⚖️ يقارن","🛒 أضاف للسلة","💳 بدأ الدفع"]},"id":"a4s2"},{"type":"principle","title":"ما المقصود بالتسويق داخل التطبيق؟","points":["العروض.","الإشعارات.","الرسائل داخل التطبيق.","التوصيات."],"intro":"<p>التسويق داخل التطبيق هو تدخل تسويقي موجّه يظهر أثناء استخدام التطبيق بهدف التأثير في سلوك المستخدم. ومن أمثلته:</p>","rule":"<p>وجود الرسالة لا يضمن تأثيرها؛ السياق + التوقيت + المحتوى + حالة المستخدم هي التي تحدد ملاءمة التدخل.</p>","chart":{"kind":"equation","items":["السياق","التوقيت","المحتوى","حالة المستخدم","= تدخل ملائم"]},"id":"a4s3"},{"type":"examples","title":"رسالة موجودة ≠ رسالة مناسبة","items":["الموقف::مستخدم يبحث عن حذاء رياضي.","الرسالة التي ظهرت::«خصم 20% على أدوات المطبخ!».","التقييم::الرسالة قد تكون صحيحة تجاريًا، لكنها لا ترتبط بما يفعله المستخدم الآن.","الفكرة::الارتباط بالسياق أهم من مجرد وجود الرسالة."],"id":"a4s4"},{"type":"principle","title":"ابدأ من سلوك المستخدم","points":["سلوك المستخدم.","الحاجة أو العائق.","هدف التدخل.","الرسالة المناسبة.","التوقيت المناسب.","قياس النتيجة."],"intro":"<p>الخطأ الشائع أن نقول: «لدينا عرض، أين نرسله؟». والأفضل: «لدينا سلوك محدد، ما التدخل المناسب له؟». المسار الصحيح يبدأ بالسلوك وينتهي بالقياس:</p>","chart":{"kind":"flow","items":["سلوك المستخدم*","الحاجة أو العائق","هدف التدخل","الرسالة المناسبة","التوقيت المناسب","قياس النتيجة"]},"id":"a4s5"},{"type":"principle","title":"أين يمكن أن نتدخل؟","points":["الاكتشاف: قد يحتاج المستخدم إلى اكتشاف خيارات.","الاستكشاف: قد يحتاج إلى توصيات أو معلومات.","التقييم: قد يحتاج إلى مقارنة أو إثبات قيمة.","الإجراء: قد يحتاج إلى تذكير أو تسهيل.","الإتمام: قد يحتاج إلى وضوح وطمأنينة."],"intro":"<p>داخل الرحلة نقاط مختلفة يمكن أن يحدث فيها تدخل تسويقي، ولكل نقطة حاجة مختلفة:</p>","chart":{"kind":"steps","items":["الاكتشاف::اكتشاف خيارات","الاستكشاف::توصيات ومعلومات","التقييم::مقارنة وإثبات قيمة","الإجراء::تذكير وتسهيل","الإتمام::وضوح وطمأنينة"]},"id":"a4s6"},{"type":"principle","title":"الرسالة نفسها قد تنجح أو تفشل حسب توقيتها","points":["تدخل مبكر جدًا: قد يكون مزعجًا.","تدخل متأخر جدًا: قد يفقد تأثيره.","تدخل في اللحظة المناسبة: يدعم القرار."],"intro":"<p>التوقيت عنصر حاسم في نجاح الرسالة:</p>","chart":{"kind":"timeline","items":["مبكر جدًا ❌::مزعج","مناسب ✓::يدعم القرار*","متأخر جدًا ❌::فقد تأثيره"]},"id":"a4s7"},{"type":"principle","title":"قبل أن يحتاج المستخدم الرسالة... قد تصبح عبئًا","points":["فتح التطبيق: لا توجد نية واضحة بعد.","الاستكشاف: تبدأ الاهتمامات بالظهور.","التقييم ثم القرار: هنا يصبح التدخل منطقيًا."],"intro":"<p>مستخدم فتح التطبيق للتو، وقبل أن يرى أي منتج تظهر نافذة: «خصم 20%! اشترِ الآن!». المستخدم لم يصل بعد إلى مرحلة اتخاذ القرار؛ قد تكون الرسالة صحيحة، لكن النية لم تتشكل بعد.</p>","rule":"<p>التدخل التسويقي يحتاج إلى قراءة مرحلة المستخدم قبل إرسال الرسالة.</p>","chart":{"kind":"flow","items":["فتح التطبيق + رسالة!","؟","استكشاف","تقييم","قرار"]},"id":"a4s8"},{"type":"principle","title":"ماذا نريد من الرسالة؟","points":["توضيح.","تقليل تردد.","اقتراح خيار.","تذكير.","تشجيع على الإجراء."],"intro":"<p>الرسالة الجيدة لا تكتفي بقول «لدينا عرض!»، بل ترتبط بقرار المستخدم وتخدم خطوة في رحلته. يمكن أن يكون هدفها:</p>","chart":{"kind":"cards","items":["💡 توضيح","🤝 تقليل تردد","✨ اقتراح خيار","⏰ تذكير","🚀 تشجيع على الإجراء"]},"id":"a4s9"},{"type":"principle","title":"ما الذي يجعل محتوى الرسالة مؤثرًا؟","points":["واضحًا: لا يترك المستخدم يبحث عن المعنى.","مباشرًا: يصل إلى الفكرة بسرعة.","مرتبطًا باحتياج المستخدم: لا يقدم رسالة منفصلة عن سياقه.","داعمًا للقرار: يساعد المستخدم على الانتقال للخطوة التالية."],"intro":"<p>ينبغي أن يكون محتوى الرسالة:</p>","rule":"<p>المحتوى الجيد يقلل الغموض أو التعقيد بدل زيادته.</p>","chart":{"kind":"cards","items":["✓ واضح","✓ مباشر","✓ مرتبط","✓ داعم للقرار"]},"id":"a4s10"},{"type":"summary","title":"التدخل الذكي يبدأ من السلوك","text":"<p>التسويق داخل التطبيق تدخل مرتبط بسلوك المستخدم، والسياق يحدد ملاءمته، والتوقيت يحدد أثره، والمحتوى الواضح المباشر يجعله داعمًا للقرار لا عبئًا عليه.</p>","rule":"<p>لا تسأل «أين نرسل العرض؟» بل «ماذا يحتاج هذا المستخدم الآن؟».</p>","id":"a4s11"}],"exercises":[{"id":"a4e1","title":"مناسب أم عشوائي؟","icon":"🎯","mode":"individual","format":"mcq","steps":[],"items":[{"q":"مستخدم يتصفح أجهزة لابتوب ← توصية بأجهزة مشابهة.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0},{"q":"مستخدم يتابع طلبه ← عرض عشوائي لأدوات منزلية.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":1},{"q":"مستخدم أضاف منتجًا إلى السلة ← تذكير بمحتويات السلة.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0},{"q":"مستخدم يبحث عن منتج محدد ← معلومات تساعده على المقارنة.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0},{"q":"مستخدم في مرحلة الدفع ← رسالة ترويجية تشوش على الإتمام.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":1},{"q":"مستخدم شاهد منتجًا عدة مرات ← توصية مرتبطة بالمنتج.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0},{"q":"مستخدم يبحث عن منتج ← رسالة لا علاقة لها بما يبحث عنه.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":1},{"q":"مستخدم أنهى عملية الشراء ← رسالة تؤكد الطلب.","options":["مرتبط بالسياق","غير مرتبط بالسياق"],"answer":0},{"q":"مستخدم يواجه مشكلة أثناء
